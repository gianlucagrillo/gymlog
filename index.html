<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap');
  #gymlog * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
  #gymlog h1, #gymlog .num { font-family: 'Barlow Condensed', sans-serif; }
  #gymlog { color: #EDEBE3; background: #16181B; border-radius: 14px; padding: 20px; max-width: 480px; margin: 0 auto; }
  #gymlog select, #gymlog input { background: #21242A; border: 1px solid #3A3E46; color: #EDEBE3; border-radius: 8px; padding: 10px 12px; font-size: 15px; width: 100%; }
  #gymlog select:focus, #gymlog input:focus { outline: none; border-color: #E8A33D; }
  #gymlog button { background: #E8A33D; color: #16181B; border: none; border-radius: 8px; padding: 11px 16px; font-weight: 600; font-size: 14px; cursor: pointer; }
  #gymlog button:active { transform: scale(0.98); }
  #gymlog button.ghost { background: transparent; border: 1px solid #3A3E46; color: #B7B4A9; }
  #gymlog .card { background: #1D2024; border: 1px solid #2C3036; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
  #gymlog .row { display: flex; gap: 10px; align-items: center; }
  #gymlog .ex-name { font-weight: 600; font-size: 15px; }
  #gymlog .ex-meta { color: #8C8A82; font-size: 12px; margin-top: 2px; }
  #gymlog .weight-badge { font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 700; color: #E8A33D; min-width: 64px; text-align: right; }
  #gymlog .delta { font-size: 12px; margin-top: 2px; text-align: right; }
  #gymlog .delta.up { color: #7FBF7F; }
  #gymlog .delta.down { color: #D97757; }
  #gymlog .delta.flat { color: #8C8A82; }
  #gymlog .history { margin-top: 10px; padding-top: 10px; border-top: 1px solid #2C3036; display: none; }
  #gymlog .history.open { display: block; }
  #gymlog .hist-row { display: flex; justify-content: space-between; font-size: 13px; color: #B7B4A9; padding: 3px 0; }
  #gymlog .spark { display: flex; align-items: flex-end; gap: 3px; height: 32px; margin-top: 8px; }
  #gymlog .bar { flex: 1; background: #E8A33D; border-radius: 2px 2px 0 0; min-height: 2px; }
  #gymlog .toggle { cursor: pointer; color: #8C8A82; font-size: 12px; text-decoration: underline; margin-top: 6px; }
  #gymlog .hist-row .del { color: #D97757; cursor: pointer; font-size: 12px; margin-left: 10px; }
  #gymlog .tabs { display: flex; gap: 6px; overflow-x: auto; margin: 14px 0 18px; padding-bottom: 2px; }
  #gymlog .tab { flex: 0 0 auto; padding: 8px 14px; border-radius: 20px; border: 1px solid #3A3E46; color: #B7B4A9; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
  #gymlog .tab.active { background: #E8A33D; color: #16181B; border-color: #E8A33D; }
</style>

<div id="gymlog">
  <h1 style="font-size:28px;font-weight:700;margin:0 0 2px;">Gym log</h1>
  <p style="color:#8C8A82;font-size:13px;margin:0;">Tap an exercise to log this week's weight</p>
  <div class="tabs" id="tabs"></div>
  <div id="ex-list"></div>
  <p style="color:#5C5A52;font-size:11px;margin:18px 0 0;">Saved on this device only</p>
</div>

<script>
(function() {
  const DAYS = [
    { id: 'day1', label: 'Day 1', exercises: [
      { name: 'Incline dumbbell press', meta: '3 × 6–10', rest: '2–3 min', restSec: 180 },
      { name: 'Flat machine/chest press', meta: '3 × 8–12', rest: '2 min', restSec: 120 },
      { name: 'Cable fly', meta: '2 × 12–15', rest: '60–90 sec', restSec: 90 },
      { name: 'Seated dumbbell shoulder press', meta: '2 × 8–12', rest: '2 min', restSec: 120 },
      { name: 'Cable lateral raise', meta: '4 × 12–20', rest: '60–90 sec', restSec: 90 },
      { name: 'Overhead cable triceps extension', meta: '3 × 10–15', rest: '60–90 sec', restSec: 90 },
      { name: 'Triceps pushdown', meta: '2 × 10–15', rest: '60–90 sec', restSec: 90 }
    ]},
    { id: 'day2', label: 'Day 2', exercises: [
      { name: 'Dumbbell shoulder press', meta: '3 × 6–10', rest: '60–90 sec', restSec: 90 },
      { name: 'Pull-ups / lat pulldown', meta: '3 × 6–10', rest: '2–3 min', restSec: 180 },
      { name: 'Chest-supported row', meta: '3 × 8–12', rest: '2 min', restSec: 120 },
      { name: 'Single-arm lat pulldown', meta: '2 × 10–15', rest: '90 sec', restSec: 90 },
      { name: 'Cable row', meta: '2 × 8–12', rest: '2 min', restSec: 120 },
      { name: 'Reverse pec deck', meta: '3 × 12–20', rest: '60–90 sec', restSec: 90 },
      { name: 'Cable rear-delt raise', meta: '2 × 12–20', rest: '60–90 sec', restSec: 90 },
      { name: 'Incline dumbbell curl', meta: '3 × 8–12', rest: '90 sec', restSec: 90 },
      { name: 'Cable curl', meta: '2 × 10–15', rest: '60–90 sec', restSec: 90 }
    ]},
    { id: 'day3', label: 'Day 3', exercises: [
      { name: 'Dumbbell lateral raise', meta: '3 × 6–10', rest: '60–90 sec', restSec: 90 },
      { name: 'Squat / hack squat', meta: '3 × 6–10', rest: '2–3 min', restSec: 180 },
      { name: 'Romanian deadlift', meta: '3 × 8–12', rest: '2–3 min', restSec: 180 },
      { name: 'Leg press', meta: '3 × 10–15', rest: '2 min', restSec: 120 },
      { name: 'Leg curl', meta: '3 × 10–15', rest: '90 sec', restSec: 90 },
      { name: 'Leg extension', meta: '2 × 12–15', rest: '60–90 sec', restSec: 90 },
      { name: 'Standing calf raise', meta: '3 × 8–15', rest: '60–90 sec', restSec: 90 },
      { name: 'Seated calf raise', meta: '2 × 12–20', rest: '60–90 sec', restSec: 90 },
      { name: 'Cable crunch', meta: '3 × 10–15', rest: '60–90 sec', restSec: 90 },
      { name: 'Hanging leg raise', meta: '2 × 10–15', rest: '60–90 sec', restSec: 90 }
    ]},
    { id: 'day4', label: 'Day 4', exercises: [
      { name: 'Dumbbell shoulder press', meta: '3 × 6–10', rest: '60–90 sec', restSec: 90 },
      { name: 'Cable lateral raise', meta: '4 × 12–20', rest: '60–90 sec', restSec: 90 },
      { name: 'Reverse pec deck', meta: '3 × 12–20', rest: '60–90 sec', restSec: 90 },
      { name: 'Seated dumbbell shoulder press', meta: '2–3 × 8–12', rest: '2 min', restSec: 120 },
      { name: 'EZ-bar curl', meta: '3 × 8–12', rest: '90 sec', restSec: 90 },
      { name: 'Incline dumbbell curl', meta: '2 × 10–15', rest: '60–90 sec', restSec: 90 },
      { name: 'Cable pushdown', meta: '3 × 10–15', rest: '60–90 sec', restSec: 90 },
      { name: 'Overhead cable triceps extension', meta: '2 × 10–15', rest: '60–90 sec', restSec: 90 }
    ]},
    { id: 'day5', label: 'Day 5', exercises: [
      { name: 'Dumbbell lateral raise', meta: '3 × 6–10', rest: '60–90 sec', restSec: 90 },
      { name: 'Incline Smith/machine press', meta: '3 × 6–10', rest: '2–3 min', restSec: 180 },
      { name: 'Lat pulldown', meta: '3 × 8–12', rest: '2 min', restSec: 120 },
      { name: 'Chest-supported row', meta: '2 × 8–12', rest: '2 min', restSec: 120 },
      { name: 'Cable fly', meta: '2 × 12–15', rest: '60–90 sec', restSec: 90 },
      { name: 'Cable lateral raise', meta: '4 × 12–20', rest: '60–90 sec', restSec: 90 },
      { name: 'Reverse pec deck', meta: '2 × 12–20', rest: '60–90 sec', restSec: 90 },
      { name: 'EZ-bar curl', meta: '2 × 8–12', rest: '90 sec', restSec: 90 },
      { name: 'Rope triceps pushdown', meta: '2 × 10–15', rest: '60–90 sec', restSec: 90 }
    ]}
  ];

  function slug(dayId, name) {
    return dayId + '_' + name.toLowerCase().replace(/[^a-z0-9]+/g, '_');
  }

  const STORE_KEY = 'gymlog-entries-v2';
  let entries = {};
  let activeDay = DAYS[0].id;
  const timers = {};

  async function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      entries = raw ? JSON.parse(raw) : {};
    } catch (e) { entries = {}; }
    renderTabs();
    renderExercises();
  }

  async function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(entries)); }
    catch (e) { console.error('save failed', e); }
  }

  function todayStr() {
    return new Date().toISOString().slice(0, 10);
  }

  function fmtDate(iso) {
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
  }

  function fmtClock(sec) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return `${m}:${s.toString().padStart(2, '0')}`;
  }

  function clearAllTimers() {
    Object.values(timers).forEach(t => clearInterval(t));
    for (const k in timers) delete timers[k];
  }

  function renderTabs() {
    const tabs = document.getElementById('tabs');
    tabs.innerHTML = DAYS.map(d =>
      `<div class="tab ${d.id === activeDay ? 'active' : ''}" data-day="${d.id}">${d.label}</div>`
    ).join('');
    tabs.querySelectorAll('.tab').forEach(t => {
      t.addEventListener('click', () => {
        activeDay = t.getAttribute('data-day');
        renderTabs();
        renderExercises();
      });
    });
  }

  function renderExercises() {
    clearAllTimers();
    const day = DAYS.find(d => d.id === activeDay);
    const list = document.getElementById('ex-list');
    list.innerHTML = '';
    day.exercises.forEach(ex => {
      const key = slug(day.id, ex.name);
      const hist = (entries[key] || []).slice().sort((a, b) => a.date.localeCompare(b.date));
      const last = hist[hist.length - 1];
      const prev = hist[hist.length - 2];
      let deltaHtml = '';
      if (last && prev) {
        const diff = Math.round((last.weight - prev.weight) * 10) / 10;
        const cls = diff > 0 ? 'up' : diff < 0 ? 'down' : 'flat';
        const sign = diff > 0 ? '+' : '';
        deltaHtml = `<div class="delta ${cls}">${sign}${diff}kg vs last</div>`;
      }
      const maxW = Math.max(...hist.map(h => h.weight), 1);
      const sparkBars = hist.slice(-8).map(h =>
        `<div class="bar" style="height:${Math.max(8, (h.weight / maxW) * 32)}px" title="${fmtDate(h.date)}: ${h.weight}kg"></div>`
      ).join('');

      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="row" style="justify-content:space-between;cursor:pointer;" data-toggle="${key}">
          <div>
            <div class="ex-name">${ex.name}</div>
            <div class="ex-meta">${ex.meta} · rest ${ex.rest}</div>
          </div>
          <div>
            <div class="weight-badge">${last ? last.weight + 'kg' : '—'}</div>
            ${deltaHtml}
          </div>
        </div>
        ${hist.length ? `<div class="spark">${sparkBars}</div>` : ''}
        <div class="row" style="margin-top:10px;gap:8px;">
          <button class="ghost" data-timer="${key}" data-rest="${ex.restSec}" style="flex:1;">Start rest timer</button>
        </div>
        <div class="history" id="hist-${key}">
          <div class="row" style="margin-bottom:10px;">
            <input type="number" step="0.5" placeholder="Weight (kg)" id="input-${key}" style="flex:2;" />
            <button data-log="${key}" style="flex:1;">Log</button>
          </div>
          ${hist.slice().reverse().map(h => `<div class="hist-row"><span>${fmtDate(h.date)}</span><span>${h.weight}kg<span class="del" data-del-key="${key}" data-del-date="${h.date}">Delete</span></span></div>`).join('') || '<div class="hist-row" style="color:#5C5A52;">No entries yet</div>'}
        </div>
        <div class="toggle" data-toggle="${key}">View history / log new weight</div>
      `;
      list.appendChild(card);
    });

    list.querySelectorAll('[data-toggle]').forEach(el => {
      el.addEventListener('click', () => {
        const key = el.getAttribute('data-toggle');
        const h = document.getElementById('hist-' + key);
        h.classList.toggle('open');
        const isOpen = h.classList.contains('open');
        list.querySelectorAll(`[data-toggle="${key}"].toggle`).forEach(t => {
          t.textContent = isOpen ? 'Hide history' : 'View history / log new weight';
        });
      });
    });

    list.querySelectorAll('[data-log]').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const key = btn.getAttribute('data-log');
        const input = document.getElementById('input-' + key);
        const val = parseFloat(input.value);
        if (!val || val <= 0) {
          input.style.borderColor = '#D97757';
          return;
        }
        if (!entries[key]) entries[key] = [];
        const today = todayStr();
        const existingIdx = entries[key].findIndex(h => h.date === today);
        if (existingIdx >= 0) entries[key][existingIdx].weight = val;
        else entries[key].push({ date: today, weight: val });
        await save();
        renderExercises();
      });
    });

    list.querySelectorAll('[data-del-key]').forEach(del => {
      del.addEventListener('click', async (e) => {
        e.stopPropagation();
        const key = del.getAttribute('data-del-key');
        const date = del.getAttribute('data-del-date');
        if (!confirm('Delete this entry?')) return;
        entries[key] = (entries[key] || []).filter(h => h.date !== date);
        await save();
        renderExercises();
      });
    });

    list.querySelectorAll('[data-timer]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const key = btn.getAttribute('data-timer');
        const restSec = parseInt(btn.getAttribute('data-rest'), 10);

        if (timers[key]) {
          clearInterval(timers[key]);
          delete timers[key];
          btn.textContent = 'Start rest timer';
          btn.style.color = '';
          return;
        }

        let remaining = restSec;
        btn.textContent = fmtClock(remaining);
        btn.style.color = '#E8A33D';
        timers[key] = setInterval(() => {
          remaining -= 1;
          if (remaining <= 0) {
            clearInterval(timers[key]);
            delete timers[key];
            btn.textContent = "Time's up — start again";
            btn.style.color = '#7FBF7F';
            if (navigator.vibrate) navigator.vibrate([250, 100, 250]);
            return;
          }
          btn.textContent = fmtClock(remaining);
        }, 1000);
      });
    });
  }

  load();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
</body>
</html>

      { name: 'Dumbbell lateral raise', meta: '3 × 6–10' },
      { name: 'Incline Smith/machine press', meta: '3 × 6–10' },
      { name: 'Lat pulldown', meta: '3 × 8–12' },
      { name: 'Chest-supported row', meta: '2 × 8–12' },
      { name: 'Cable fly', meta: '2 × 12–15' },
      { name: 'Cable lateral raise', meta: '4 × 12–20' },
      { name: 'Reverse pec deck', meta: '2 × 12–20' },
      { name: 'EZ-bar curl', meta: '2 × 8–12' },
      { name: 'Rope triceps pushdown', meta: '2 × 10–15' }
    ]}
  ];

  function slug(dayId, name) {
    return dayId + '_' + name.toLowerCase().replace(/[^a-z0-9]+/g, '_');
  }

  const STORE_KEY = 'gymlog-entries-v2';
  let entries = {};
  let activeDay = DAYS[0].id;

  async function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      entries = raw ? JSON.parse(raw) : {};
    } catch (e) { entries = {}; }
    renderTabs();
    renderExercises();
  }

  async function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(entries)); }
    catch (e) { console.error('save failed', e); }
  }

  function todayStr() {
    return new Date().toISOString().slice(0, 10);
  }

  function fmtDate(iso) {
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
  }

  function renderTabs() {
    const tabs = document.getElementById('tabs');
    tabs.innerHTML = DAYS.map(d =>
      `<div class="tab ${d.id === activeDay ? 'active' : ''}" data-day="${d.id}">${d.label}</div>`
    ).join('');
    tabs.querySelectorAll('.tab').forEach(t => {
      t.addEventListener('click', () => {
        activeDay = t.getAttribute('data-day');
        renderTabs();
        renderExercises();
      });
    });
  }

  function renderExercises() {
    const day = DAYS.find(d => d.id === activeDay);
    const list = document.getElementById('ex-list');
    list.innerHTML = '';
    day.exercises.forEach(ex => {
      const key = slug(day.id, ex.name);
      const hist = (entries[key] || []).slice().sort((a, b) => a.date.localeCompare(b.date));
      const last = hist[hist.length - 1];
      const prev = hist[hist.length - 2];
      let deltaHtml = '';
      if (last && prev) {
        const diff = Math.round((last.weight - prev.weight) * 10) / 10;
        const cls = diff > 0 ? 'up' : diff < 0 ? 'down' : 'flat';
        const sign = diff > 0 ? '+' : '';
        deltaHtml = `<div class="delta ${cls}">${sign}${diff}kg vs last</div>`;
      }
      const maxW = Math.max(...hist.map(h => h.weight), 1);
      const sparkBars = hist.slice(-8).map(h =>
        `<div class="bar" style="height:${Math.max(8, (h.weight / maxW) * 32)}px" title="${fmtDate(h.date)}: ${h.weight}kg"></div>`
      ).join('');

      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="row" style="justify-content:space-between;cursor:pointer;" data-toggle="${key}">
          <div>
            <div class="ex-name">${ex.name}</div>
            <div class="ex-meta">${ex.meta}</div>
          </div>
          <div>
            <div class="weight-badge">${last ? last.weight + 'kg' : '—'}</div>
            ${deltaHtml}
          </div>
        </div>
        ${hist.length ? `<div class="spark">${sparkBars}</div>` : ''}
        <div class="history" id="hist-${key}">
          <div class="row" style="margin-bottom:10px;">
            <input type="number" step="0.5" placeholder="Weight (kg)" id="input-${key}" style="flex:2;" />
            <button data-log="${key}" style="flex:1;">Log</button>
          </div>
          ${hist.slice().reverse().map(h => `<div class="hist-row"><span>${fmtDate(h.date)}</span><span>${h.weight}kg</span></div>`).join('') || '<div class="hist-row" style="color:#5C5A52;">No entries yet</div>'}
        </div>
        <div class="toggle" data-toggle="${key}">View history / log new weight</div>
      `;
      list.appendChild(card);
    });

    list.querySelectorAll('[data-toggle]').forEach(el => {
      el.addEventListener('click', () => {
        const key = el.getAttribute('data-toggle');
        const h = document.getElementById('hist-' + key);
        h.classList.toggle('open');
        const isOpen = h.classList.contains('open');
        list.querySelectorAll(`[data-toggle="${key}"].toggle`).forEach(t => {
          t.textContent = isOpen ? 'Hide history' : 'View history / log new weight';
        });
      });
    });

    list.querySelectorAll('[data-log]').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const key = btn.getAttribute('data-log');
        const input = document.getElementById('input-' + key);
        const val = parseFloat(input.value);
        if (!val || val <= 0) {
          input.style.borderColor = '#D97757';
          return;
        }
        if (!entries[key]) entries[key] = [];
        const today = todayStr();
        const existingIdx = entries[key].findIndex(h => h.date === today);
        if (existingIdx >= 0) entries[key][existingIdx].weight = val;
        else entries[key].push({ date: today, weight: val });
        await save();
        renderExercises();
      });
    });
  }

  load();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
</body>
</html>

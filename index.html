<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gym log</title>
<meta name="theme-color" content="#16181B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym log">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
  html, body { margin: 0; padding: 0; background: #0F1113; min-height: 100vh; }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); padding-top: max(20px, env(safe-area-inset-top)); padding-bottom: max(20px, env(safe-area-inset-bottom)); }

  #gymlog * { box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }
  #gymlog h1, #gymlog .num, #gymlog .weight-badge { font-family: 'Barlow Condensed', 'Inter', sans-serif; }
  #gymlog { color: #EDEBE3; background: #16181B; border-radius: 14px; padding: 20px; max-width: 480px; margin: 0 auto; }
  #gymlog select, #gymlog input, #gymlog textarea { background: #21242A; border: 1px solid #3A3E46; color: #EDEBE3; border-radius: 8px; padding: 10px 12px; font-size: 15px; width: 100%; }
  #gymlog select:focus, #gymlog input:focus, #gymlog textarea:focus { outline: none; border-color: #E8A33D; }
  #gymlog button { background: #E8A33D; color: #16181B; border: none; border-radius: 8px; padding: 11px 16px; font-weight: 600; font-size: 14px; cursor: pointer; }
  #gymlog button:active { transform: scale(0.98); }
  #gymlog button:disabled { opacity: .35; cursor: default; }
  #gymlog button.ghost { background: transparent; border: 1px solid #3A3E46; color: #B7B4A9; }
  #gymlog button.danger { background: transparent; border: 1px solid #D97757; color: #D97757; }
  #gymlog button.mini { padding: 6px 10px; font-size: 12px; }
  #gymlog .card { background: #1D2024; border: 1px solid #2C3036; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
  #gymlog .row { display: flex; gap: 10px; align-items: center; }
  #gymlog .ex-name { font-weight: 600; font-size: 15px; }
  #gymlog .ex-meta { color: #8C8A82; font-size: 12px; margin-top: 2px; }
  #gymlog .weight-badge { font-size: 26px; font-weight: 700; color: #E8A33D; min-width: 64px; text-align: right; }
  #gymlog .delta { font-size: 12px; margin-top: 2px; text-align: right; }
  #gymlog .delta.up { color: #7FBF7F; }
  #gymlog .delta.down { color: #D97757; }
  #gymlog .delta.flat { color: #8C8A82; }
  #gymlog .history { margin-top: 10px; padding-top: 10px; border-top: 1px solid #2C3036; display: none; }
  #gymlog .history.open { display: block; }
  #gymlog .hist-row { display: flex; justify-content: space-between; font-size: 13px; color: #B7B4A9; padding: 3px 0; }
  #gymlog .spark { display: flex; align-items: flex-end; gap: 3px; height: 32px; margin-top: 8px; }
  #gymlog .bar { flex: 1; max-width: 28px; background: #E8A33D; border-radius: 2px 2px 0 0; min-height: 2px; }
  #gymlog .toggle { cursor: pointer; color: #8C8A82; font-size: 12px; text-decoration: underline; margin-top: 6px; }
  #gymlog .hist-row .del { color: #D97757; cursor: pointer; font-size: 12px; margin-left: 10px; }
  #gymlog .tabs { display: flex; gap: 6px; overflow-x: auto; margin: 14px 0 18px; padding-bottom: 2px; }
  #gymlog .tab { flex: 0 0 auto; padding: 8px 14px; border-radius: 20px; border: 1px solid #3A3E46; color: #B7B4A9; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
  #gymlog .tab.active { background: #E8A33D; color: #16181B; border-color: #E8A33D; }
  #gymlog .set-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  #gymlog .set-label { width: 46px; font-size: 13px; color: #8C8A82; flex-shrink: 0; }
  #gymlog .set-row input { flex: 1; min-width: 0; }
  #gymlog .easy-check { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #8C8A82; flex-shrink: 0; width: 62px; }
  #gymlog .easy-check input { width: auto; accent-color: #E8A33D; }
  #gymlog .session { padding: 8px 0; border-bottom: 1px solid #2C3036; }
  #gymlog .session:last-child { border-bottom: none; }
  #gymlog .session-head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #B7B4A9; margin-bottom: 6px; }
  #gymlog .session-sets { display: flex; gap: 6px; flex-wrap: wrap; }
  #gymlog .set-chip { background: #21242A; border-radius: 6px; padding: 3px 9px; font-size: 12px; color: #EDEBE3; border: 1px solid transparent; }
  #gymlog .set-chip.easy { color: #7FBF7F; border-color: #7FBF7F; }
  #gymlog .easy-note { font-size: 11px; color: #7FBF7F; margin-top: 2px; text-align: right; }
  #gymlog .toolbar { display: flex; gap: 6px; margin-top: 12px; }
  #gymlog .toolbar button { flex: 1; }
  #gymlog .pr-badge { display: inline-block; background: #E8A33D; color: #16181B; border-radius: 5px; padding: 1px 6px; font-size: 10px; font-weight: 700; letter-spacing: .04em; vertical-align: middle; }
  #gymlog .stats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  #gymlog .stat { background: #21242A; border: 1px solid #2C3036; border-radius: 8px; padding: 6px 10px; font-size: 11px; color: #8C8A82; flex: 1; min-width: 92px; }
  #gymlog .stat b { display: block; color: #EDEBE3; font-size: 15px; font-weight: 600; margin-top: 2px; }
  #gymlog .ed-ex { background: #1D2024; border: 1px solid #2C3036; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  #gymlog .ed-grid { display: flex; gap: 6px; margin-top: 8px; }
  #gymlog .ed-grid label { flex: 1; font-size: 10px; color: #8C8A82; }
  #gymlog .ed-grid input { margin-top: 3px; padding: 7px 8px; font-size: 14px; text-align: center; }
  #gymlog .ed-actions { display: flex; gap: 6px; margin-top: 8px; justify-content: flex-end; }
  #gymlog .hint { color: #5C5A52; font-size: 11px; line-height: 1.5; }
  #gymlog textarea { font-family: ui-monospace, monospace; font-size: 11px; height: 120px; resize: vertical; }
  #gymlog .timer-btn.running { color: #E8A33D; border-color: #E8A33D; }
  #gymlog .timer-btn.done { color: #7FBF7F; border-color: #7FBF7F; }
  #gymlog .draft-note { font-size: 11px; color: #E8A33D; margin-top: 6px; text-align: center; }
  #gymlog [hidden] { display: none !important; }
  #gymlog .cycle-line { color: #E8A33D; font-size: 12px; font-weight: 600; margin: 4px 0 0; }
  #gymlog .cycle-line.over { color: #D97757; }
  #gymlog .card.priority { box-shadow: inset 3px 0 0 #E8A33D; }
  #gymlog .prio-tag { display: inline-block; border: 1px solid #E8A33D; color: #E8A33D; border-radius: 5px; padding: 0 5px; font-size: 9px; font-weight: 700; letter-spacing: .05em; vertical-align: middle; margin-left: 4px; }
  #gymlog .ed-grid select { margin-top: 3px; padding: 7px 8px; font-size: 13px; }
  #gymlog .prio-check { display: flex; align-items: flex-end; gap: 6px; padding-bottom: 8px; }
  #gymlog .prio-check input { width: auto; accent-color: #E8A33D; margin: 0; }
  #gymlog .vol-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #B7B4A9; padding: 4px 0; }
  #gymlog .vol-name { width: 88px; flex-shrink: 0; }
  #gymlog .vol-track { flex: 1; height: 8px; background: #21242A; border-radius: 4px; overflow: hidden; }
  #gymlog .vol-fill { height: 100%; background: #E8A33D; }
  #gymlog .vol-fill.full { background: #7FBF7F; }
  #gymlog .vol-num { width: 44px; text-align: right; flex-shrink: 0; color: #EDEBE3; }
</style>
</head>
<body>

<div id="gymlog">
  <div class="row" style="justify-content:space-between;align-items:flex-start;">
    <div>
      <h1 style="font-size:28px;font-weight:700;margin:0 0 2px;">Gym log</h1>
      <p id="subtitle" style="color:#8C8A82;font-size:13px;margin:0;">Tap an exercise to log this week's weight</p>
      <p id="cycle-line" class="cycle-line" hidden></p>
    </div>
  </div>
  <div class="toolbar">
    <button class="ghost mini" id="nav-log">Workout</button>
    <button class="ghost mini" id="nav-edit">Routine</button>
    <button class="ghost mini" id="nav-data">Data</button>
  </div>
  <div id="view"></div>
  <p class="hint" id="backup-note" style="margin:18px 0 0;">Saved on this device only — export a backup now and then.</p>
</div>

<script>
(function() {
  'use strict';

  // ---------- default routine ----------
  var MUSCLES = ['Side delts', 'Front delts', 'Rear delts', 'Chest', 'Back', 'Biceps', 'Triceps',
                 'Quads', 'Hamstrings', 'Glutes', 'Calves', 'Abs', 'Other'];

  function defaultRoutine() {
    return [
      { id: 'day1', label: 'Day 1', exercises: [
        { name: 'Dumbbell lateral raise', muscle: 'Side delts', priority: true, sets: 3, repMin: 6, repMax: 10, restSec: 90 },
        { name: 'Incline dumbbell press', muscle: 'Chest', sets: 3, repMin: 6, repMax: 10, restSec: 180 },
        { name: 'Flat machine/chest press', muscle: 'Chest', sets: 3, repMin: 8, repMax: 12, restSec: 120 },
        { name: 'Seated dumbbell shoulder press', muscle: 'Front delts', sets: 3, repMin: 8, repMax: 12, restSec: 120 },
        { name: 'Seated dumbbell lateral raise', muscle: 'Side delts', sets: 4, repMin: 12, repMax: 20, restSec: 90 },
        { name: 'Overhead dumbbell triceps extension', muscle: 'Triceps', sets: 3, repMin: 10, repMax: 15, restSec: 90 }
      ]},
      { id: 'day2', label: 'Day 2', exercises: [
        { name: 'Dumbbell shoulder press', muscle: 'Front delts', priority: true, sets: 3, repMin: 6, repMax: 10, restSec: 120 },
        { name: 'Pull-ups / lat pulldown', muscle: 'Back', sets: 3, repMin: 6, repMax: 10, restSec: 180 },
        { name: 'Chest-supported row', muscle: 'Back', sets: 3, repMin: 8, repMax: 12, restSec: 120 },
        { name: 'Reverse pec deck', muscle: 'Rear delts', sets: 4, repMin: 12, repMax: 20, restSec: 90 },
        { name: 'Incline dumbbell curl', muscle: 'Biceps', sets: 3, repMin: 8, repMax: 12, restSec: 90 },
        { name: 'Dumbbell hammer curl', muscle: 'Biceps', sets: 2, repMin: 10, repMax: 15, restSec: 90 }
      ]},
      { id: 'day3', label: 'Day 3', exercises: [
        { name: 'Dumbbell lateral raise', muscle: 'Side delts', priority: true, sets: 3, repMin: 6, repMax: 10, restSec: 90 },
        { name: 'Squat / hack squat', muscle: 'Quads', sets: 3, repMin: 6, repMax: 10, restSec: 180 },
        { name: 'Romanian deadlift', muscle: 'Hamstrings', sets: 3, repMin: 8, repMax: 12, restSec: 180 },
        { name: 'Leg press', muscle: 'Quads', sets: 3, repMin: 10, repMax: 15, restSec: 120 },
        { name: 'Leg curl', muscle: 'Hamstrings', sets: 3, repMin: 10, repMax: 15, restSec: 90 },
        { name: 'Standing calf raise', muscle: 'Calves', sets: 4, repMin: 8, repMax: 15, restSec: 90 }
      ]},
      { id: 'day4', label: 'Day 4', exercises: [
        { name: 'Dumbbell shoulder press', muscle: 'Front delts', priority: true, sets: 3, repMin: 6, repMax: 10, restSec: 120 },
        { name: 'Seated dumbbell lateral raise', muscle: 'Side delts', sets: 4, repMin: 12, repMax: 20, restSec: 90 },
        { name: 'Reverse pec deck', muscle: 'Rear delts', sets: 3, repMin: 12, repMax: 20, restSec: 90 },
        { name: 'EZ-bar curl', muscle: 'Biceps', sets: 3, repMin: 8, repMax: 12, restSec: 90 },
        { name: 'Dumbbell skull crusher', muscle: 'Triceps', sets: 3, repMin: 10, repMax: 15, restSec: 90 },
        { name: 'Overhead dumbbell triceps extension', muscle: 'Triceps', sets: 2, repMin: 10, repMax: 15, restSec: 90 }
      ]},
      { id: 'day5', label: 'Day 5', exercises: [
        { name: 'Dumbbell lateral raise', muscle: 'Side delts', priority: true, sets: 3, repMin: 6, repMax: 10, restSec: 90 },
        { name: 'Incline Smith/machine press', muscle: 'Chest', sets: 3, repMin: 6, repMax: 10, restSec: 180 },
        { name: 'Lat pulldown', muscle: 'Back', sets: 3, repMin: 8, repMax: 12, restSec: 120 },
        // Moved here from Day 2: keeps the Day 2 id so its history stays attached.
        { id: 'day2_cable_row', name: 'Cable row', muscle: 'Back', sets: 3, repMin: 8, repMax: 12, restSec: 120 },
        { name: 'Seated dumbbell lateral raise', muscle: 'Side delts', sets: 4, repMin: 12, repMax: 20, restSec: 90 },
        { name: 'Reverse pec deck', muscle: 'Rear delts', sets: 2, repMin: 12, repMax: 20, restSec: 90 }
      ]}
    ].map(function(d) {
      d.exercises = d.exercises.map(function(ex) {
        // Legacy id = same slug the v3 store used, so existing history stays attached.
        if (!ex.id) ex.id = d.id + '_' + ex.name.toLowerCase().replace(/[^a-z0-9]+/g, '_');
        return ex;
      });
      return d;
    });
  }

  // Routines saved before muscles/priority existed get them from the default routine
  // (matched by exercise id, then by name). Unknown exercises fall back to 'Other'.
  function fillMeta(days) {
    var byId = {}, byName = {};
    defaultRoutine().forEach(function(d) {
      d.exercises.forEach(function(e) { byId[e.id] = e; byName[e.name.toLowerCase()] = e; });
    });
    days.forEach(function(d) {
      d.exercises.forEach(function(e) {
        var ref = byId[e.id] || byName[e.name.toLowerCase()];
        if (!e.muscle) e.muscle = ref ? ref.muscle : 'Other';
        if (e.priority === undefined) e.priority = !!(ref && ref.priority);
      });
    });
    return days;
  }

  // ---------- storage ----------
  var STORE_KEY = 'gymlog-entries-v4';
  var LEGACY_KEY = 'gymlog-entries-v3';
  var ROUTINE_KEY = 'gymlog-routine-v1';
  var ROUTINES_KEY = 'gymlog-routines-v1';
  var TIMER_KEY = 'gymlog-timer-v1';
  var BACKUP_KEY = 'gymlog-lastbackup-v1';

  var entries = {};
  var routine = [];
  var activeDay = null;
  var view = 'log';
  var openCards = {};
  var drafts = {};

  function readJSON(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) { return fallback; }
  }

  function saveEntries() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(entries)); }
    catch (e) { alert('Save failed: browser storage is full or unavailable.'); }
  }

  // ---------- routines: several saved plans, one active; `routine` is the active plan's days ----------
  // store = { active: id, list: [{ id, name, days, cycle: { start: 'YYYY-MM-DD', weeks: n } | null }] }
  var store = null;

  function activePlan() {
    return store.list.find(function(p) { return p.id === store.active; }) || store.list[0];
  }
  function saveRoutine() {
    activePlan().days = routine;
    try { localStorage.setItem(ROUTINES_KEY, JSON.stringify(store)); }
    catch (e) { alert('Could not save the routine.'); }
  }
  function loadRoutines() {
    var s = readJSON(ROUTINES_KEY, null);
    if (!s || !Array.isArray(s.list) || !s.list.length) {
      // First run with multi-routine support: the single saved routine (or the default) becomes plan #1.
      var old = readJSON(ROUTINE_KEY, null);
      var days = Array.isArray(old) && old.length ? old : defaultRoutine();
      s = { active: 'plan1', list: [{ id: 'plan1', name: 'Shoulder specialization', days: days, cycle: null }] };
    }
    s.list.forEach(function(p) { fillMeta(p.days); });
    store = s;
    routine = activePlan().days;
    try { localStorage.setItem(ROUTINES_KEY, JSON.stringify(store)); } catch (e) {}
  }
  function switchPlan(id) {
    store.active = id;
    routine = activePlan().days;
    saveRoutine();
    activeDay = pickStartDay();
  }

  // ---------- training cycle ----------
  function cycleInfo() {
    var c = activePlan().cycle;
    if (!c || !c.start || !c.weeks) return null;
    var start = new Date(c.start + 'T00:00:00');
    var today = new Date(todayStr() + 'T00:00:00');
    var days = Math.round((today - start) / 86400000);
    if (days < 0) return { text: 'Cycle starts in ' + (-days) + (days === -1 ? ' day' : ' days'), over: false };
    var week = Math.floor(days / 7) + 1;
    if (week > c.weeks) return { text: 'Week ' + week + ' — cycle planned for ' + c.weeks + ' weeks is over', over: true };
    return { text: 'Week ' + week + ' / ' + c.weeks + (week === c.weeks ? ' — last week' : ''), over: false };
  }
  function paintCycle() {
    var el = document.getElementById('cycle-line');
    var info = cycleInfo();
    var name = activePlan().name;
    if (!info && store.list.length < 2) { el.hidden = true; return; }
    el.hidden = false;
    el.textContent = (store.list.length > 1 ? name : '') + (info ? (store.list.length > 1 ? ' · ' : '') + info.text : '');
    el.classList.toggle('over', !!(info && info.over));
  }

  // ---------- weekly sets per muscle ----------
  function mondayOf(dateStr) {
    var d = new Date(dateStr + 'T00:00:00');
    var dow = (d.getDay() + 6) % 7;
    d.setDate(d.getDate() - dow);
    return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  }
  function weeklyVolume() {
    var planned = {}, done = {}, muscleOf = {};
    routine.forEach(function(d) {
      d.exercises.forEach(function(e) {
        planned[e.muscle] = (planned[e.muscle] || 0) + e.sets;
        muscleOf[e.id] = e.muscle;
      });
    });
    // Exercises from other saved routines still count if logged this week.
    store.list.forEach(function(p) {
      p.days.forEach(function(d) { d.exercises.forEach(function(e) { if (!muscleOf[e.id]) muscleOf[e.id] = e.muscle; }); });
    });
    var weekStart = mondayOf(todayStr());
    for (var k in entries) {
      var m = muscleOf[k];
      if (!m) continue;
      (entries[k] || []).forEach(function(s) {
        if (s.date >= weekStart) done[m] = (done[m] || 0) + s.sets.length;
      });
    }
    return MUSCLES.filter(function(m) { return planned[m] || done[m]; })
      .map(function(m) { return { muscle: m, done: done[m] || 0, planned: planned[m] || 0 }; })
      .sort(function(a, b) { return b.planned - a.planned || b.done - a.done; });
  }

  // ---------- drafts: typed-but-unlogged values survive the re-render after logging another exercise ----------
  function captureDraft(key, setCount) {
    var d = { w: [], r: [], easy: false };
    for (var i = 1; i <= setCount; i++) {
      var wi = document.getElementById('w-' + key + '-' + i);
      var ri = document.getElementById('r-' + key + '-' + i);
      d.w.push(wi ? wi.value : '');
      d.r.push(ri ? ri.value : '');
    }
    var ei = document.getElementById('easy-' + key);
    d.easy = !!(ei && ei.checked);
    drafts[key] = d;
  }
  function clearDraft(key) {
    delete drafts[key];
  }

  // ---------- which day to open on ----------
  // Open the day you trained today, or else the one after the last day you trained.
  function pickStartDay() {
    var lastDate = null;
    for (var k in entries) (entries[k] || []).forEach(function(s) { if (!lastDate || s.date > lastDate) lastDate = s.date; });
    if (!lastDate) return routine[0].id;

    var idx = -1, bestHits = 0;
    routine.forEach(function(d, i) {
      var hits = d.exercises.filter(function(ex) {
        return (entries[ex.id] || []).some(function(s) { return s.date === lastDate; });
      }).length;
      if (hits > bestHits) { bestHits = hits; idx = i; }
    });
    if (idx < 0) return routine[0].id;
    if (lastDate === todayStr()) return routine[idx].id;
    return routine[(idx + 1) % routine.length].id;
  }

  // ---------- backup health ----------
  function daysSinceBackup() {
    var at = localStorage.getItem(BACKUP_KEY);
    if (!at) return null;
    return Math.floor((Date.now() - new Date(at).getTime()) / 86400000);
  }
  function markBackedUp() {
    localStorage.setItem(BACKUP_KEY, new Date().toISOString());
    paintBackupNote();
  }
  function paintBackupNote() {
    var el = document.getElementById('backup-note');
    if (!el) return;
    var hasData = Object.keys(entries).some(function(k) { return (entries[k] || []).length; });
    var d = daysSinceBackup();
    var txt = 'Saved on this device only — ';
    txt += d == null ? 'no backup yet' : d === 0 ? 'backed up today' : 'last backup ' + d + (d === 1 ? ' day' : ' days') + ' ago';
    el.textContent = txt;
    var stale = hasData && (d == null || d >= 14);
    el.style.color = stale ? '#E8A33D' : '';
    el.style.cursor = stale ? 'pointer' : '';
    el.style.textDecoration = stale ? 'underline' : '';
  }

  // v3 -> v4: sets become { weight, reps }. The v3 key is left untouched as a fallback.
  function migrate() {
    var v4 = readJSON(STORE_KEY, null);
    if (v4) return v4;
    var v3 = readJSON(LEGACY_KEY, null);
    if (!v3) return {};
    var out = {};
    Object.keys(v3).forEach(function(key) {
      out[key] = (v3[key] || []).map(function(s) {
        return {
          date: s.date,
          easy: !!s.easy,
          sets: (s.sets || []).map(function(x) { return { weight: x.weight, reps: null }; })
        };
      });
    });
    localStorage.setItem(STORE_KEY, JSON.stringify(out));
    return out;
  }

  // ---------- helpers ----------
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function todayStr() {
    var d = new Date();
    return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  }
  function fmtDate(iso) {
    var d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  }
  function fmtClock(sec) {
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ':' + String(s).padStart(2, '0');
  }
  function fmtRest(sec) {
    return (sec >= 120 && sec % 60 === 0) ? (sec / 60) + ' min' : sec + ' sec';
  }
  function metaOf(ex) { return ex.sets + ' × ' + ex.repMin + '–' + ex.repMax; }
  function avg(nums) { return nums.reduce(function(a, b) { return a + b; }, 0) / nums.length; }
  function round1(n) { return Math.round(n * 10) / 10; }
  // 0 kg = bodyweight (pull-ups, hanging leg raise...)
  function fmtW(w) { return w === 0 ? 'BW' : w + 'kg'; }
  function totalReps(session) {
    return session.sets.reduce(function(a, s) { return a + (s.reps || 0); }, 0);
  }
  function uid(prefix) { return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function sortedHist(key) {
    return (entries[key] || []).slice().sort(function(a, b) { return a.date.localeCompare(b.date); });
  }
  // Estimated 1RM, Epley formula. Not computable without reps.
  function e1rm(set) {
    if (!set.reps || set.reps < 1) return null;
    return set.weight * (1 + set.reps / 30);
  }
  function bestOf(hist) {
    var best = { weight: 0, e1rm: 0, e1rmDate: null, weightDate: null };
    hist.forEach(function(s) {
      s.sets.forEach(function(set) {
        if (set.weight > best.weight) { best.weight = set.weight; best.weightDate = s.date; }
        var e = e1rm(set);
        if (e && e > best.e1rm) { best.e1rm = e; best.e1rmDate = s.date; }
      });
    });
    return best;
  }
  function volumeOf(session) {
    var v = 0, any = false;
    session.sets.forEach(function(s) {
      if (s.reps && s.reps > 0) { v += s.weight * s.reps; any = true; }
    });
    return any ? v : null;
  }
  function progressionHint(ex, last) {
    if (!last) return '';
    if (last.easy) return '↑ try adding weight';
    var withReps = last.sets.filter(function(s) { return s.reps && s.reps > 0; });
    if (withReps.length === last.sets.length && withReps.length > 0 &&
        withReps.every(function(s) { return s.reps >= ex.repMax; })) {
      return '↑ top of the range, add weight';
    }
    return '';
  }

  // ---------- rest timer (clock-anchored, survives re-renders) ----------
  var timer = readJSON(TIMER_KEY, null); // { key, endAt, restSec }
  // A rest that ran out ages ago belongs to a past session: don't resurrect it on launch.
  if (timer && (!timer.endAt || timer.endAt < Date.now() - 10 * 60 * 1000)) {
    timer = null;
    localStorage.removeItem(TIMER_KEY);
  }
  var ticker = null;
  var wakeLock = null;

  // Keep the screen on while resting: a locked phone suspends JS, so the
  // end-of-rest vibration/beep would never fire.
  function acquireWakeLock() {
    try {
      if (!('wakeLock' in navigator) || wakeLock || document.visibilityState !== 'visible') return;
      navigator.wakeLock.request('screen').then(function(l) {
        wakeLock = l;
        l.addEventListener('release', function() { wakeLock = null; });
      }).catch(function() {});
    } catch (e) {}
  }
  function releaseWakeLock() {
    try { if (wakeLock) wakeLock.release(); } catch (e) {}
    wakeLock = null;
  }

  function timerRemaining() {
    if (!timer) return 0;
    return Math.max(0, Math.ceil((timer.endAt - Date.now()) / 1000));
  }
  function startTimer(key, restSec) {
    timer = { key: key, endAt: Date.now() + restSec * 1000, restSec: restSec, alerted: false };
    localStorage.setItem(TIMER_KEY, JSON.stringify(timer));
    acquireWakeLock();
    ensureTicker();
    paintTimers();
  }
  function stopTimer() {
    timer = null;
    localStorage.removeItem(TIMER_KEY);
    releaseWakeLock();
    paintTimers();
  }
  function ensureTicker() {
    if (ticker) return;
    ticker = setInterval(paintTimers, 250);
  }
  function stopTicker() {
    if (ticker) { clearInterval(ticker); ticker = null; }
  }
  function beep() {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      var ctx = new Ctx(), o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 880; g.gain.value = 0.15;
      o.start();
      setTimeout(function() { o.stop(); ctx.close(); }, 350);
    } catch (e) {}
  }
  function paintTimers() {
    var btns = document.querySelectorAll('[data-timer]');
    var remaining = timerRemaining();
    if (timer && remaining <= 0 && !timer.alerted) {
      timer.alerted = true;
      // Only alert if the rest ended just now, not when reopening the app much later.
      if (Date.now() - timer.endAt < 15000) {
        if (navigator.vibrate) navigator.vibrate([250, 100, 250]);
        beep();
      }
      releaseWakeLock();
    }
    btns.forEach(function(btn) {
      var key = btn.getAttribute('data-timer');
      btn.classList.remove('running', 'done');
      if (timer && timer.key === key) {
        if (remaining > 0) {
          btn.textContent = fmtClock(remaining);
          btn.classList.add('running');
        } else {
          btn.textContent = "Time's up — tap to restart";
          btn.classList.add('done');
        }
      } else {
        btn.textContent = 'Start rest timer (' + fmtRest(parseInt(btn.getAttribute('data-rest'), 10)) + ')';
      }
    });
    // Nothing left to count down: stop ticking instead of spinning forever.
    if (!timer || remaining <= 0) stopTicker();
  }

  // ---------- render ----------
  function render() {
    document.getElementById('nav-log').classList.toggle('ghost', view !== 'log');
    document.getElementById('nav-edit').classList.toggle('ghost', view !== 'edit');
    document.getElementById('nav-data').classList.toggle('ghost', view !== 'data');
    var sub = document.getElementById('subtitle');
    sub.textContent = view === 'log' ? "Tap an exercise to log this week's weight"
      : view === 'edit' ? 'Add, edit or reorder your exercises'
      : 'Backup, restore and stats';
    if (view === 'log') renderLog();
    else if (view === 'edit') renderEdit();
    else renderData();
    paintBackupNote();
    paintCycle();
  }

  function tabsHtml() {
    return '<div class="tabs">' + routine.map(function(d) {
      return '<div class="tab ' + (d.id === activeDay ? 'active' : '') + '" data-day="' + d.id + '">' + esc(d.label) + '</div>';
    }).join('') + '</div>';
  }

  function bindTabs(root) {
    root.querySelectorAll('[data-day]').forEach(function(t) {
      t.addEventListener('click', function() {
        activeDay = t.getAttribute('data-day');
        render();
      });
    });
  }

  function renderLog() {
    var root = document.getElementById('view');
    var day = routine.find(function(d) { return d.id === activeDay; }) || routine[0];
    if (!day) { root.innerHTML = '<p class="hint">No days in your routine. Open “Routine” and add one.</p>'; return; }
    activeDay = day.id;

    var html = tabsHtml();

    day.exercises.forEach(function(ex) {
      var key = ex.id;
      var hist = sortedHist(key);
      var last = hist[hist.length - 1];
      var prev = hist[hist.length - 2];

      var lastWeights = last ? last.sets.map(function(s) { return s.weight; }) : [];
      var lastLabel = lastWeights.length
        ? (lastWeights.every(function(w) { return w === lastWeights[0]; })
            ? fmtW(lastWeights[0])
            : (lastWeights.every(function(w) { return w === 0; }) ? 'BW' : lastWeights.join('/') + 'kg'))
        : '—';

      // --- delta vs last: kept exactly as in the original version, do not refactor ---
      var deltaHtml = '';
      if (last && prev) {
        var diff = Math.round((avg(lastWeights) - avg(prev.sets.map(function(s) { return s.weight; }))) * 10) / 10;
        var cls = diff > 0 ? 'up' : diff < 0 ? 'down' : 'flat';
        var sign = diff > 0 ? '+' : '';
        deltaHtml = '<div class="delta ' + cls + '">' + sign + diff + 'kg vs last</div>';
      }
      // --- end of untouched block ---

      var hint = progressionHint(ex, last);
      var hintHtml = hint ? '<div class="easy-note">' + hint + '</div>' : '';

      var best = bestOf(hist);
      var isPr = !!(last && best.e1rmDate && best.e1rmDate === last.date && hist.length > 1);
      var prHtml = isPr ? ' <span class="pr-badge">PR</span>' : '';

      // Bodyweight exercises have no load to chart, so the sparkline tracks total reps instead.
      var allW = [];
      hist.forEach(function(h) { h.sets.forEach(function(s) { allW.push(s.weight); }); });
      var bwOnly = allW.length > 0 && allW.every(function(w) { return w === 0; });
      var metric = function(h) {
        return bwOnly ? totalReps(h) : round1(avg(h.sets.map(function(s) { return s.weight; })));
      };
      var maxM = Math.max.apply(null, hist.map(metric).concat([1]));
      var sparkBars = hist.slice(-8).map(function(h) {
        var a = metric(h);
        return '<div class="bar" style="height:' + Math.max(8, (a / maxM) * 32) + 'px" title="' + fmtDate(h.date) + ': ' + a + (bwOnly ? ' reps' : 'kg') + '"></div>';
      }).join('');

      // Inputs: today's unsaved draft if any, otherwise pre-filled from the last session.
      var draft = drafts[key];
      var setInputs = '';
      for (var i = 1; i <= ex.sets; i++) {
        var pre = last && last.sets[i - 1] ? last.sets[i - 1] : null;
        var pw = pre && pre.weight != null ? pre.weight : '';
        var pr = pre && pre.reps != null ? pre.reps : '';
        if (draft && draft.w[i - 1] !== undefined) pw = draft.w[i - 1];
        if (draft && draft.r[i - 1] !== undefined) pr = draft.r[i - 1];
        setInputs +=
          '<div class="set-row">' +
            '<div class="set-label">Set ' + i + '</div>' +
            '<input type="number" inputmode="decimal" step="0.5" min="0" placeholder="kg (0 = BW)" value="' + esc(pw) + '" id="w-' + key + '-' + i + '" data-draft="' + key + '" data-setcount="' + ex.sets + '">' +
            '<input type="number" inputmode="numeric" step="1" min="0" placeholder="reps" value="' + esc(pr) + '" id="r-' + key + '-' + i + '" data-draft="' + key + '" data-setcount="' + ex.sets + '">' +
          '</div>';
      }
      setInputs +=
        '<label class="easy-check" style="width:auto;margin:2px 0 10px;">' +
          '<input type="checkbox" id="easy-' + key + '" data-draft="' + key + '" data-setcount="' + ex.sets + '"' + (draft && draft.easy ? ' checked' : '') + '> too easy, add weight next time' +
        '</label>';

      var statsHtml = '';
      if (hist.length) {
        var lastVol = last ? volumeOf(last) : null;
        statsHtml = '<div class="stats">' +
          '<div class="stat">Best weight<b>' + (best.weight ? best.weight + ' kg' : '—') + '</b></div>' +
          '<div class="stat">Est. 1RM<b>' + (best.e1rm ? round1(best.e1rm) + ' kg' : '—') + '</b></div>' +
          '<div class="stat">Last volume<b>' + (lastVol ? round1(lastVol) + ' kg' : '—') + '</b></div>' +
        '</div>';
      }

      var sessionsHtml = hist.slice().reverse().map(function(h) {
        var chips = h.sets.map(function(s, idx) {
          var reps = (s.reps && s.reps > 0) ? ' × ' + s.reps : '';
          return '<span class="set-chip">S' + (idx + 1) + ': ' + fmtW(s.weight) + reps + '</span>';
        }).join('');
        var vol = volumeOf(h);
        var volTxt = vol ? ' · ' + round1(vol) + 'kg vol' : '';
        return '<div class="session">' +
            '<div class="session-head">' +
              '<span>' + fmtDate(h.date) + (h.easy ? ' <span style="color:#7FBF7F;">↑ easy</span>' : '') + volTxt + '</span>' +
              '<span class="del" data-del-key="' + key + '" data-del-date="' + h.date + '">Delete</span>' +
            '</div>' +
            '<div class="session-sets">' + chips + '</div>' +
          '</div>';
      }).join('') || '<div class="hist-row" style="color:#5C5A52;">No entries yet</div>';

      var isOpen = !!openCards[key] || !!draft;
      if (draft) openCards[key] = true;

      html +=
        '<div class="card' + (ex.priority ? ' priority' : '') + '">' +
          '<div class="row" style="justify-content:space-between;cursor:pointer;" data-toggle="' + key + '">' +
            '<div>' +
              '<div class="ex-name">' + esc(ex.name) + (ex.priority ? '<span class="prio-tag">PRIORITY</span>' : '') + prHtml + '</div>' +
              '<div class="ex-meta">' + metaOf(ex) + ' · rest ' + fmtRest(ex.restSec) + '</div>' +
            '</div>' +
            '<div>' +
              '<div class="weight-badge">' + lastLabel + '</div>' +
              deltaHtml +
              hintHtml +
            '</div>' +
          '</div>' +
          (hist.length ? '<div class="spark">' + sparkBars + '</div>' : '') +
          '<div class="row" style="margin-top:10px;gap:8px;">' +
            '<button class="ghost timer-btn" data-timer="' + key + '" data-rest="' + ex.restSec + '" style="flex:1;"></button>' +
          '</div>' +
          '<div class="history' + (isOpen ? ' open' : '') + '" id="hist-' + key + '">' +
            setInputs +
            '<button data-log="' + key + '" data-setcount="' + ex.sets + '" style="width:100%;margin-top:4px;">Log session</button>' +
            '<div class="draft-note" id="draft-' + key + '"' + (draft ? '' : ' hidden') + '>Not logged yet — values kept until you tap Log session</div>' +
            '<div style="margin-top:12px;padding-top:10px;border-top:1px solid #2C3036;">' + statsHtml + sessionsHtml + '</div>' +
          '</div>' +
          '<div class="toggle" data-toggle="' + key + '">' + (isOpen ? 'Hide history' : 'View history / log new weight') + '</div>' +
        '</div>';
    });

    root.innerHTML = html;
    bindTabs(root);

    root.querySelectorAll('[data-toggle]').forEach(function(el) {
      el.addEventListener('click', function() {
        var key = el.getAttribute('data-toggle');
        openCards[key] = !openCards[key];
        var h = document.getElementById('hist-' + key);
        h.classList.toggle('open', openCards[key]);
        root.querySelectorAll('[data-toggle="' + key + '"].toggle').forEach(function(t) {
          t.textContent = openCards[key] ? 'Hide history' : 'View history / log new weight';
        });
      });
    });

    root.querySelectorAll('[data-draft]').forEach(function(inp) {
      var ev = inp.type === 'checkbox' ? 'change' : 'input';
      inp.addEventListener(ev, function() {
        var key = inp.getAttribute('data-draft');
        captureDraft(key, parseInt(inp.getAttribute('data-setcount'), 10));
        var note = document.getElementById('draft-' + key);
        if (note) note.hidden = false;
      });
    });

    root.querySelectorAll('[data-log]').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var key = btn.getAttribute('data-log');
        var setCount = parseInt(btn.getAttribute('data-setcount'), 10);
        var sets = [];
        for (var i = 1; i <= setCount; i++) {
          var wi = document.getElementById('w-' + key + '-' + i);
          var ri = document.getElementById('r-' + key + '-' + i);
          var w = parseFloat(wi.value);
          var r = parseInt(ri.value, 10);
          var hasW = isFinite(w) && w > 0;
          var hasR = isFinite(r) && r > 0;
          wi.style.borderColor = '';
          // A set counts if it has a load, or reps alone (bodyweight, logged as 0 kg).
          if (hasW || hasR) sets.push({ weight: hasW ? w : 0, reps: hasR ? r : null });
        }
        if (sets.length === 0) {
          document.getElementById('w-' + key + '-1').style.borderColor = '#D97757';
          return;
        }
        var easy = document.getElementById('easy-' + key).checked;
        if (!entries[key]) entries[key] = [];
        var today = todayStr();
        var idx = entries[key].findIndex(function(h) { return h.date === today; });
        if (idx >= 0) { entries[key][idx].sets = sets; entries[key][idx].easy = easy; }
        else entries[key].push({ date: today, sets: sets, easy: easy });
        saveEntries();
        clearDraft(key);
        render();
      });
    });

    root.querySelectorAll('[data-del-key]').forEach(function(del) {
      del.addEventListener('click', function(e) {
        e.stopPropagation();
        var key = del.getAttribute('data-del-key');
        var date = del.getAttribute('data-del-date');
        if (!confirm('Delete this entry?')) return;
        entries[key] = (entries[key] || []).filter(function(h) { return h.date !== date; });
        saveEntries();
        render();
      });
    });

    root.querySelectorAll('[data-timer]').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var key = btn.getAttribute('data-timer');
        var restSec = parseInt(btn.getAttribute('data-rest'), 10);
        if (timer && timer.key === key && timerRemaining() > 0) stopTimer();
        else startTimer(key, restSec);
      });
    });

    ensureTicker();
    paintTimers();
  }

  // ---------- routine editor ----------
  function renderEdit() {
    var root = document.getElementById('view');
    var day = routine.find(function(d) { return d.id === activeDay; }) || routine[0];
    var plan = activePlan();
    var cyc = plan.cycle || {};

    var html =
      '<div class="card" style="margin-top:14px;">' +
        '<label class="hint">Active routine</label>' +
        '<select id="plan-select" style="margin-top:6px;">' +
          store.list.map(function(p) {
            return '<option value="' + p.id + '"' + (p.id === plan.id ? ' selected' : '') + '>' + esc(p.name) + '</option>';
          }).join('') +
        '</select>' +
        '<div class="ed-grid">' +
          '<label style="flex:2;">Name<input id="plan-name" value="' + esc(plan.name) + '" style="text-align:left;"></label>' +
        '</div>' +
        '<div class="ed-grid">' +
          '<label style="flex:2;">Cycle start<input type="date" id="cycle-start" value="' + (cyc.start || '') + '"></label>' +
          '<label>Weeks<input type="number" min="1" max="52" id="cycle-weeks" value="' + (cyc.weeks || '') + '"></label>' +
        '</div>' +
        '<div class="ed-actions">' +
          '<button class="ghost mini" id="plan-dup">Duplicate</button>' +
          '<button class="danger mini" id="plan-del"' + (store.list.length < 2 ? ' disabled' : '') + '>Delete routine</button>' +
        '</div>' +
      '</div>' +
      tabsHtml();

    if (day) {
      activeDay = day.id;
      html +=
        '<div class="card">' +
          '<label class="hint">Day name</label>' +
          '<input id="day-label" value="' + esc(day.label) + '" style="margin-top:6px;">' +
          '<div class="ed-actions">' +
            '<button class="ghost mini" id="day-save">Save name</button>' +
            '<button class="danger mini" id="day-del">Delete day</button>' +
          '</div>' +
        '</div>';

      day.exercises.forEach(function(ex, i) {
        html +=
          '<div class="ed-ex">' +
            '<input data-f="name" data-i="' + i + '" value="' + esc(ex.name) + '">' +
            '<div class="ed-grid">' +
              '<label>Sets<input type="number" min="1" max="12" data-f="sets" data-i="' + i + '" value="' + ex.sets + '"></label>' +
              '<label>Rep min<input type="number" min="1" data-f="repMin" data-i="' + i + '" value="' + ex.repMin + '"></label>' +
              '<label>Rep max<input type="number" min="1" data-f="repMax" data-i="' + i + '" value="' + ex.repMax + '"></label>' +
              '<label>Rest sec<input type="number" min="0" step="15" data-f="restSec" data-i="' + i + '" value="' + ex.restSec + '"></label>' +
            '</div>' +
            '<div class="ed-grid">' +
              '<label style="flex:2;">Muscle<select data-f="muscle" data-i="' + i + '">' +
                MUSCLES.map(function(m) { return '<option' + (m === ex.muscle ? ' selected' : '') + '>' + m + '</option>'; }).join('') +
              '</select></label>' +
              '<label class="prio-check"><input type="checkbox" data-f="priority" data-i="' + i + '"' + (ex.priority ? ' checked' : '') + '> Priority</label>' +
            '</div>' +
            '<div class="ed-actions">' +
              '<button class="ghost mini" data-move="' + i + '" data-dir="-1"' + (i === 0 ? ' disabled' : '') + '>↑</button>' +
              '<button class="ghost mini" data-move="' + i + '" data-dir="1"' + (i === day.exercises.length - 1 ? ' disabled' : '') + '>↓</button>' +
              '<button class="danger mini" data-rm="' + i + '">Delete</button>' +
            '</div>' +
          '</div>';
      });

      html +=
        '<button id="add-ex" style="width:100%;margin-top:6px;">+ Add exercise</button>';
    }

    html +=
      '<div class="toolbar" style="margin-top:14px;">' +
        '<button class="ghost mini" id="add-day">+ New day</button>' +
        '<button class="ghost mini" id="reset-routine">Reset routine</button>' +
      '</div>' +
      '<p class="hint" style="margin-top:10px;">Field edits are saved as soon as you leave the field. Deleting an exercise keeps its history: recreate it with the same name on the same day and the history comes back. A duplicated routine shares history with the original for every exercise you keep.</p>';

    root.innerHTML = html;
    bindTabs(root);

    document.getElementById('plan-select').addEventListener('change', function(e) {
      switchPlan(e.target.value);
      render();
    });
    document.getElementById('plan-name').addEventListener('change', function(e) {
      var v = e.target.value.trim();
      if (!v) { e.target.value = plan.name; return; }
      plan.name = v;
      saveRoutine();
      render();
    });
    function saveCycle() {
      var s = document.getElementById('cycle-start').value;
      var w = parseInt(document.getElementById('cycle-weeks').value, 10);
      plan.cycle = (s && w > 0) ? { start: s, weeks: w } : null;
      saveRoutine();
      paintCycle();
    }
    document.getElementById('cycle-start').addEventListener('change', saveCycle);
    document.getElementById('cycle-weeks').addEventListener('change', saveCycle);
    document.getElementById('plan-dup').addEventListener('click', function() {
      var name = prompt('Name for the copy:', plan.name + ' (copy)');
      if (!name || !name.trim()) return;
      // Same exercise ids as the original, so the history carries over.
      var copy = { id: uid('plan'), name: name.trim(), days: JSON.parse(JSON.stringify(routine)), cycle: null };
      store.list.push(copy);
      switchPlan(copy.id);
      render();
    });
    document.getElementById('plan-del').addEventListener('click', function() {
      if (store.list.length < 2) return;
      if (!confirm('Delete the routine "' + plan.name + '"? Logged history is kept.')) return;
      store.list = store.list.filter(function(p) { return p.id !== plan.id; });
      switchPlan(store.list[0].id);
      render();
    });

    if (!day) return;

    root.querySelectorAll('[data-f]').forEach(function(inp) {
      inp.addEventListener('change', function() {
        var i = parseInt(inp.getAttribute('data-i'), 10);
        var f = inp.getAttribute('data-f');
        var ex = day.exercises[i];
        if (f === 'name') {
          var v = inp.value.trim();
          if (!v) { inp.value = ex.name; return; }
          ex.name = v;
        } else if (f === 'muscle') {
          ex.muscle = inp.value;
        } else if (f === 'priority') {
          ex.priority = inp.checked;
        } else {
          var n = parseInt(inp.value, 10);
          if (isNaN(n) || n < 0) { inp.value = ex[f]; return; }
          ex[f] = n;
        }
        if (ex.repMax < ex.repMin) ex.repMax = ex.repMin;
        saveRoutine();
        renderEdit();
      });
    });

    document.getElementById('day-save').addEventListener('click', function() {
      var v = document.getElementById('day-label').value.trim();
      if (v) { day.label = v; saveRoutine(); render(); }
    });

    document.getElementById('day-del').addEventListener('click', function() {
      if (routine.length <= 1) { alert('You need to keep at least one day.'); return; }
      if (!confirm('Delete "' + day.label + '"? Exercise history is kept.')) return;
      routine = routine.filter(function(d) { return d.id !== day.id; });
      activeDay = routine[0].id;
      saveRoutine();
      render();
    });

    root.querySelectorAll('[data-move]').forEach(function(b) {
      b.addEventListener('click', function() {
        var i = parseInt(b.getAttribute('data-move'), 10);
        var dir = parseInt(b.getAttribute('data-dir'), 10);
        var j = i + dir;
        if (j < 0 || j >= day.exercises.length) return;
        var tmp = day.exercises[i];
        day.exercises[i] = day.exercises[j];
        day.exercises[j] = tmp;
        saveRoutine();
        renderEdit();
      });
    });

    root.querySelectorAll('[data-rm]').forEach(function(b) {
      b.addEventListener('click', function() {
        var i = parseInt(b.getAttribute('data-rm'), 10);
        if (!confirm('Remove "' + day.exercises[i].name + '" from the routine? Its history is kept.')) return;
        day.exercises.splice(i, 1);
        saveRoutine();
        renderEdit();
      });
    });

    document.getElementById('add-ex').addEventListener('click', function() {
      var name = prompt('New exercise name:');
      if (!name || !name.trim()) return;
      name = name.trim();
      var legacyId = day.id + '_' + name.toLowerCase().replace(/[^a-z0-9]+/g, '_');
      var taken = routine.some(function(d) {
        return d.exercises.some(function(e) { return e.id === legacyId; });
      });
      day.exercises.push({
        id: taken ? uid('ex') : legacyId,
        name: name, muscle: 'Other', priority: false, sets: 3, repMin: 8, repMax: 12, restSec: 90
      });
      saveRoutine();
      renderEdit();
    });

    document.getElementById('add-day').addEventListener('click', function() {
      var label = prompt('New day name:', 'Day ' + (routine.length + 1));
      if (!label || !label.trim()) return;
      var d = { id: uid('day'), label: label.trim(), exercises: [] };
      routine.push(d);
      activeDay = d.id;
      saveRoutine();
      render();
    });

    document.getElementById('reset-routine').addEventListener('click', function() {
      if (!confirm('Reset "' + plan.name + '" to the default shoulder specialization routine? Your logged weights are NOT affected.')) return;
      routine = defaultRoutine();
      activeDay = routine[0].id;
      saveRoutine();
      render();
    });
  }

  // ---------- data / backup ----------
  function exportPayload() {
    return {
      app: 'gymlog',
      version: 5,
      exportedAt: new Date().toISOString(),
      routines: store,
      routine: routine,
      entries: entries
    };
  }

  function weeklyVolumeHtml() {
    var rows = weeklyVolume();
    if (!rows.length) return '';
    return '<div class="card">' +
      '<div class="ex-name">This week — sets per muscle</div>' +
      '<p class="hint" style="margin:2px 0 8px;">Logged since Monday vs planned in “' + esc(activePlan().name) + '”.</p>' +
      rows.map(function(r) {
        var pct = r.planned ? Math.min(100, Math.round(r.done / r.planned * 100)) : 100;
        return '<div class="vol-row">' +
            '<div class="vol-name">' + r.muscle + '</div>' +
            '<div class="vol-track"><div class="vol-fill' + (r.planned && r.done >= r.planned ? ' full' : '') + '" style="width:' + pct + '%"></div></div>' +
            '<div class="vol-num">' + r.done + ' / ' + r.planned + '</div>' +
          '</div>';
      }).join('') +
    '</div>';
  }

  function renderData() {
    var root = document.getElementById('view');
    var keys = Object.keys(entries).filter(function(k) { return (entries[k] || []).length; });
    var totalSessions = 0, allDates = [];
    keys.forEach(function(k) {
      totalSessions += entries[k].length;
      entries[k].forEach(function(s) { allDates.push(s.date); });
    });
    allDates.sort();
    var uniqueDays = allDates.filter(function(d, i) { return allDates.indexOf(d) === i; }).length;
    var bd = daysSinceBackup();
    var backupTxt = bd == null ? 'Never backed up.' : bd === 0 ? 'Last backup: today.' : 'Last backup: ' + bd + (bd === 1 ? ' day' : ' days') + ' ago.';

    root.innerHTML =
      '<div class="stats" style="margin-top:14px;">' +
        '<div class="stat">Exercises tracked<b>' + keys.length + '</b></div>' +
        '<div class="stat">Total sessions<b>' + totalSessions + '</b></div>' +
        '<div class="stat">Gym days<b>' + uniqueDays + '</b></div>' +
      '</div>' +
      weeklyVolumeHtml() +
      '<div class="card">' +
        '<div class="ex-name">Backup</div>' +
        '<p class="hint" style="margin:4px 0 10px;">Your data lives in this browser only. Download a file every so often: if you switch phone or the browser clears its storage, without a backup it is gone.<br><b style="color:#B7B4A9;">' + backupTxt + '</b></p>' +
        '<button id="do-export" style="width:100%;">Download .json backup</button>' +
        '<button class="ghost" id="do-copy" style="width:100%;margin-top:8px;">Copy to clipboard</button>' +
      '</div>' +
      '<div class="card">' +
        '<div class="ex-name">Restore</div>' +
        '<p class="hint" style="margin:4px 0 10px;">Load a backup file, or paste its contents below and hit Import. This replaces all current data.</p>' +
        '<input type="file" accept="application/json,.json" id="file-in" style="padding:8px;">' +
        '<textarea id="paste-in" placeholder="...or paste the JSON here" style="margin-top:8px;"></textarea>' +
        '<button class="ghost" id="do-import" style="width:100%;margin-top:8px;">Import from pasted text</button>' +
      '</div>' +
      '<div class="card">' +
        '<div class="ex-name" style="color:#D97757;">Danger zone</div>' +
        '<p class="hint" style="margin:4px 0 10px;">Wipes every logged session. Your routine stays.</p>' +
        '<button class="danger" id="do-wipe" style="width:100%;">Delete all history</button>' +
      '</div>';

    document.getElementById('do-export').addEventListener('click', function() {
      var blob = new Blob([JSON.stringify(exportPayload(), null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'gymlog-backup-' + todayStr() + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
      markBackedUp();
      renderData();
    });

    document.getElementById('do-copy').addEventListener('click', function() {
      var txt = JSON.stringify(exportPayload());
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(function() { markBackedUp(); alert('Backup copied to clipboard.'); },
          function() { document.getElementById('paste-in').value = txt; });
      } else {
        document.getElementById('paste-in').value = txt;
        alert('Copy the text from the box below manually.');
      }
    });

    document.getElementById('file-in').addEventListener('change', function(e) {
      var f = e.target.files && e.target.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function() { applyImport(reader.result); };
      reader.readAsText(f);
    });

    document.getElementById('do-import').addEventListener('click', function() {
      applyImport(document.getElementById('paste-in').value);
    });

    document.getElementById('do-wipe').addEventListener('click', function() {
      if (!confirm('Delete ALL logged history?')) return;
      if (!confirm("Are you sure? This can't be undone without a backup.")) return;
      entries = {};
      saveEntries();
      alert('History deleted.');
      render();
    });
  }

  function applyImport(text) {
    var data;
    try { data = JSON.parse(text); }
    catch (e) { alert('Invalid file: that is not readable JSON.'); return; }

    var newEntries = data && data.entries ? data.entries : data;
    if (!newEntries || typeof newEntries !== 'object' || Array.isArray(newEntries)) {
      alert('Invalid file: no history found inside.');
      return;
    }
    var count = 0;
    for (var k in newEntries) {
      if (!Array.isArray(newEntries[k])) { alert('Invalid file: unexpected history structure.'); return; }
      count += newEntries[k].length;
    }
    if (!confirm('Import ' + count + ' sessions? Your current data will be replaced.')) return;

    entries = newEntries;
    saveEntries();
    if (data && data.routines && Array.isArray(data.routines.list) && data.routines.list.length) {
      // v5 backup: all saved routines
      data.routines.list.forEach(function(p) { fillMeta(p.days); });
      store = data.routines;
      routine = activePlan().days;
      saveRoutine();
      activeDay = pickStartDay();
    } else if (data && Array.isArray(data.routine) && data.routine.length) {
      // older backup: a single routine replaces the active one
      routine = fillMeta(data.routine);
      saveRoutine();
      activeDay = routine[0].id;
    }
    alert('Import complete.');
    view = 'log';
    render();
  }

  // ---------- bootstrap ----------
  entries = migrate();
  loadRoutines();
  activeDay = pickStartDay();

  document.getElementById('nav-log').addEventListener('click', function() { view = 'log'; render(); });
  document.getElementById('nav-edit').addEventListener('click', function() { view = 'edit'; render(); });
  document.getElementById('nav-data').addEventListener('click', function() { view = 'data'; render(); });
  document.getElementById('backup-note').addEventListener('click', function() { view = 'data'; render(); });

  // Coming back to the app: refresh the timer and re-take the screen wake lock.
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState !== 'visible') return;
    if (timer && timerRemaining() > 0) { acquireWakeLock(); ensureTicker(); }
    paintTimers();
  });

  render();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('service-worker.js').catch(function() {});
  });
}
</script>
</body>

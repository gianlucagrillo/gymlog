  function heroHtml(day, prog, sp, complete) {
    var dow = new Date(todayStr() + 'T00:00:00').getDay();
    var restToday = restDaysOf(activePlan()).indexOf(dow) >= 0 && !prog.started;
    var otherDone = !prog.started && Object.keys(entries).some(function(k) { return loggedOn(k, todayStr()); });
    var kicker = complete ? 'Done today' : otherDone ? 'Next up' : restToday ? 'Rest day · next up' : prog.started ? 'In progress' : 'Today';
    var meta, btn;
    if (complete) {
      var took = sp.start && sp.end - sp.start >= 60000 ? fmtMins(Math.round((sp.end - sp.start) / 60000)) + ' · ' : '';
      meta = took + sp.total + ' sets · ' + day.exercises.length + ' exercises';
      btn = '<button class="hero-btn ok" data-summary="1">View summary ' + ARROW + '</button>';
    } else {
      meta = day.exercises.length + ' exercises · ' + sp.total + ' sets · ' +
        (prog.started && sp.start ? '<span id="sess-clock"></span>' : '≈' + estimateMin(day) + ' min');
      btn = day.exercises.length ? '<button class="hero-btn" data-start="1">' + (prog.started ? 'Continue' : 'Start') + ' ' + ARROW + '</button>' : '';
    }
    var pct = sp.total ? sp.done / sp.total * 100 : 0;
    return '<div class="hero' + (complete ? ' complete' : '') + '">' +
      '<div class="hero-main">' +
        '<div class="hero-k">' + kicker + '</div>' +
        '<button class="hero-title" data-daypick="1">' + esc(day.label) + CHEV_DOWN + '</button>' +
        '<div class="hero-meta">' + meta + '</div>' +
        btn +
      '</div>' +
      '<div class="hero-ring">' + ringSvg(pct, 78, 7) + '<div><b>' + sp.done + '/' + sp.total + '</b><small>sets</small></div></div>' +
    '</div>';
  }

  function listHtml(day, models, prog, sp, complete) {
    var h = weekStripHtml() + heroHtml(day, prog, sp, complete);
    if (day.exercises.length) {
      if (complete) {
        // cool-down first once the workout is done; warm-up stays reachable, collapsed
        h += ppCardHtml(day, 'post', ppOpen.post !== undefined ? ppOpen.post : ppCount(day, todayStr(), 'post').done < ppCount(day, todayStr(), 'post').total);
      } else {
        var preC = ppCount(day, todayStr(), 'pre');
        h += ppCardHtml(day, 'pre', ppOpen.pre !== undefined ? ppOpen.pre : (!prog.started && preC.done < preC.total));
      }
    }
    var anyAlt = models.some(function(m) { return m.vars.length > 1; });
    h += '<div class="sec"><b>Exercises</b><span>' + (anyAlt ? 'station taken? tap ⇄' : '') + '</span></div>';
    models.forEach(function(m) {
      var ex = m.ex;
      if (m.run === 'start') {
        var grp = ssGroup(day, ex);
        h += '<div class="ss-group"><div class="ss-head"><b>Superset ' + esc(ex.ss) + '</b><span>alternate · rest ' +
          fmtClock(Math.max.apply(null, grp.map(function(e) { return e.restSec; }))) + ' per round</span></div>';
      }
      var cap;
      if (m.exComplete && m.todaySess) {
        var top = m.todaySess.sets.reduce(function(b, s) { return !b || s.weight > b.weight ? s : b; }, null);
        cap = '✓ ' + m.todaySess.sets.length + ' sets · ' + (top ? fmtSet(top) : '');
      } else if (m.nDone) {
        cap = m.nDone + ' / ' + ex.sets + ' sets done · rest ' + fmtClock(ex.restSec);
      } else {
        cap = ex.sets + ' sets × ' + ex.repMin + '–' + ex.repMax + ' · rest ' + fmtClock(ex.restSec);
      }
      var tip = m.hint && !m.exComplete ? '<small class="up">↑ add weight</small>' : '';
      var topW = m.last ? Math.max.apply(null, m.last.sets.map(function(s) { return s.weight || 0; })) : null;
      h += '<div class="exrow' + (m.exComplete ? ' done' : m.nDone ? ' active' : '') + (ex.priority ? ' priority' : '') + '" data-card="' + m.key + '" data-open="' + m.key + '">' +
          tileHtml(ex.name) +
          '<div class="mid">' +
            '<b>' + (m.ssLabel ? '<span class="ss-tag">' + m.ssLabel + '</span>' : '') + esc(ex.name) + m.prHtml + '</b>' +
            '<small>' + esc(cap) + '</small>' +
            (ex.main ? '<em>Alternative · planned: ' + esc(ex.main.name) + '</em>' : '') +
          '</div>' +
          '<div class="r"><b class="' + (m.last ? '' : 'empty') + '">' + (m.last ? fmtW(topW) : '—') + '</b>' + m.deltaHtml + tip + '</div>' +
          (m.vars.length > 1 && !m.todaySess ? '<button class="sub-btn" data-pick="' + m.mainId + '" aria-label="Substitute">' + SWAP_ICO + '</button>' : '') +
        '</div>';
      var after = day.exercises[m.idx + 1];
      if (m.run && !(after && after.ss === ex.ss)) h += '</div>';
    });
    return h;
  }

  function focusHtml(day, models) {
    var m = models.find(function(x) { return x.key === focusKey; });
    var ex = m.ex, n = models.length;
    var steps = models.map(function(x) {
      return '<i class="' + (x.key === m.key ? 'on' : x.exComplete ? 'ok' : x.nDone ? 'part' : '') + '" data-open="' + x.key + '"></i>';
    }).join('');
    var nextM = models[m.idx + 1], prevM = models[m.idx - 1];
    var tags = '<span class="tag">' + metaOf(ex) + '</span>' +
      '<button class="tag timer-btn" data-timer="' + m.key + '" data-rest="' + ex.restSec + '" data-name="' + esc(ex.name) + '"></button>' +
      (m.vars.length > 1 ? '<button class="tag acc" data-pick="' + m.mainId + '">' + SWAP_ICO + 'Substitute</button>' : '') +
      (m.ssLabel ? '<span class="tag acc">Superset ' + m.ssLabel + '</span>' : '') +
      (ex.priority ? '<span class="tag acc">Priority</span>' : '');
    var e1 = m.best && m.best.e1rm ? round1(m.best.e1rm) + ' kg' : '—';
    return '<div class="focus" data-card="' + m.key + '">' +
      '<div class="f-top">' +
        '<button class="ib" data-back="1" aria-label="Back to the list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>' +
        '<div class="steps">' + steps + '</div>' +
        (nextM ? '<button class="ib" data-open="' + nextM.key + '" aria-label="Next exercise"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>'
          : '<button class="ib" data-back="1" aria-label="Back to the list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg></button>') +
      '</div>' +
      '<div class="f-kick">Exercise ' + (m.idx + 1) + ' of ' + n + ' · ' + esc(ex.muscle || '') + (sessStart ? ' · <span id="sess-clock"></span>' : '') + '</div>' +
      '<div class="f-title">' + esc(ex.name) + m.prHtml + '</div>' +
      (ex.main ? '<div class="alt-line">Alternative · planned: ' + esc(ex.main.name) + '</div>' : '') +
      '<div class="f-tags">' + tags + '</div>' +
      '<div class="f-info">' +
        '<div><small>Last</small><b class="' + (m.last ? '' : 'empty') + '">' + m.lastLabel + '</b>' + m.deltaHtml + '</div>' +
        '<div><small>Best e1RM</small><b>' + e1 + '</b></div>' +
        '<div><small>Tip</small>' + (m.hint ? '<b class="tip">' + esc(m.hint.replace(/^↑\s*/, '↑ ')) + '</b>' : '<b class="tip muted">keep going</b>') + '</div>' +
      '</div>' +
      '<div class="f-sets" id="hist-' + m.key + '">' +
        m.setInputs +
        '<button class="ghost" data-log="' + m.key + '" data-setcount="' + ex.sets + '" style="width:100%;margin-top:4px;">' + (m.exComplete ? 'Update today’s session' : 'Log all sets at once') + '</button>' +
        '<div class="draft-note" id="draft-' + m.key + '"' + (m.draft && !m.todaySess ? '' : ' hidden') + '>Not saved yet — tap ✓ or Log all sets</div>' +
      '</div>' +
      (prevM || nextM ? '<div class="f-nav">' +
        (prevM ? '<button class="ghost" data-open="' + prevM.key + '">‹ ' + esc(prevM.ex.name) + '</button>' : '<span></span>') +
        (nextM ? '<button class="ghost" data-open="' + nextM.key + '">' + esc(nextM.ex.name) + ' ›</button>' : '<span></span>') +
      '</div>' : '') +
      (m.hist.length ? '<div class="f-hist"><div class="f-sec">History</div>' + chartHtml(m.key, m.hist) + m.statsHtml + m.sessionsHtml + '</div>' : '') +
    '</div>';
  }

  function openDayPicker() {
    var wrap = document.getElementById('sheet');
    wrap.innerHTML =
      '<div class="sheet-bg" data-close></div>' +
      '<div class="sheet">' +
        '<div class="sheet-grab"></div>' +
        '<div class="ex-name" style="font-size:18px;">Choose the day</div>' +
        '<p class="hint" style="margin:4px 0 14px;">The app suggests the next day in your rotation; pick another one if you need to.</p>' +
        routine.map(function(d) {
          var ed = effDay(d), p = dayProgress(ed);
          var st = p.total && p.done >= p.total ? ' · ✓ done today' : p.started ? ' · in progress' : '';
          return '<button class="tpl-opt pick-opt' + (d.id === activeDay ? ' sel' : '') + '" data-day-id="' + d.id + '">' +
            '<b>' + esc(d.label) + (d.id === activeDay ? CHECK : '') + '</b>' +
            '<span>' + d.exercises.length + ' exercises · ≈' + estimateMin(ed) + ' min' + st + '</span>' +
            '<small>' + esc(d.exercises.map(function(e) { return e.name; }).join(' · ')) + '</small>' +
          '</button>';
        }).join('') +
        '<button class="ghost" data-close style="width:100%;margin-top:6px;">Cancel</button>' +
      '</div>';
    wrap.hidden = false;
    document.body.style.overflow = 'hidden';
    wrap.querySelectorAll('[data-close]').forEach(function(el) { el.addEventListener('click', closeSheet); });
    wrap.querySelectorAll('[data-day-id]').forEach(function(b) {
      b.addEventListener('click', function() {
        activeDay = b.getAttribute('data-day-id');
        focusKey = null;
        closeSheet();
        render();
      });
    });
  }

  function renderLog() {
    var root = document.getElementById('view');
    var rawDay = routine.find(function(d) { return d.id === activeDay; }) || routine[0];
    if (!rawDay) { root.innerHTML = '<p class="hint">No days in your routine. Open “Routine” and add one.</p>'; return; }
    var day = effDay(rawDay);
    activeDay = day.id;

    var mvMap = movements();
    var prog = dayProgress(day);
    var sp = setProgress(day);
    var complete = !!prog.total && prog.done >= prog.total;
    sessStart = prog.started && !complete ? sp.start : null;
    // the exercise on screen was swapped for an alternative (or removed): follow it, or go back to the list
    if (focusKey && !day.exercises.some(function(e) { return e.id === focusKey; })) {
      var fx = day.exercises.find(function(e) { return variants(e).some(function(v) { return v.id === focusKey; }); });
      focusKey = fx ? fx.id : null;
    }
    var html = '';
    var models = [];

    // consecutive exercises sharing a superset letter are drawn as one group
    var runs = {};
    day.exercises.forEach(function(ex, i) {
      var before = day.exercises[i - 1], after = day.exercises[i + 1];
      if (ex.ss && before && before.ss === ex.ss) runs[i] = 'mid';
      else if (ex.ss && after && after.ss === ex.ss) runs[i] = 'start';
    });

    day.exercises.forEach(function(ex, exIdx) {
      var key = ex.id;
      var vars = variants(ex);
      var mainId = vars[0].id;
      var hist = sortedHist(key);
      var last = hist[hist.length - 1];
      var prev = hist[hist.length - 2];

      var lastWeights = last ? last.sets.map(function(s) { return s.weight; }) : [];
      var lastLabel = lastWeights.length
        ? (lastWeights.every(function(w) { return w === lastWeights[0]; })
            ? fmtW(lastWeights[0])
            : (lastWeights.every(function(w) { return w === 0; }) ? 'BW' : lastWeights.join('/') + 'kg'))
        : '—';

      // --- delta vs last: kept exactly as in the original version, do not refactor ---
      var deltaHtml = '';
      if (last && prev) {
        var diff = Math.round((avg(lastWeights) - avg(prev.sets.map(function(s) { return s.weight; }))) * 10) / 10;
        var cls = diff > 0 ? 'up' : diff < 0 ? 'down' : 'flat';
        var sign = diff > 0 ? '+' : '';
        deltaHtml = '<div class="delta ' + cls + '">' + sign + diff + 'kg vs last</div>';
      }
      // --- end of untouched block ---

      // judge progression on the last finished session, not on today's half-done one
      var hintSess = last && last.date === todayStr() && !exDone(ex) ? prev : last;
      var hint = progressionHint(ex, hintSess);
      var hintHtml = hint ? '<div class="easy-note">' + hint + '</div>' : '';

      var best = bestOf(hist);
      var isPr = !!(last && best.e1rmDate && best.e1rmDate === last.date && hist.length > 1);
      var prHtml = isPr ? ' <span class="pr-badge">PR</span>' : '';

      // Bodyweight exercises have no load to chart, so the sparkline tracks total reps instead.
      var allW = [];
      hist.forEach(function(h) { h.sets.forEach(function(s) { allW.push(s.weight); }); });
      var bwOnly = allW.length > 0 && allW.every(function(w) { return w === 0; });
      var metric = function(h) {
        return bwOnly ? totalReps(h) : round1(avg(h.sets.map(function(s) { return s.weight; })));
      };
      var maxM = Math.max.apply(null, hist.map(metric).concat([1]));
      var sparkBars = hist.slice(-8).map(function(h) {
        var a = metric(h);
        return '<div class="bar" style="height:' + Math.max(4, (a / maxM) * 28) + 'px" title="' + fmtDate(h.date) + ': ' + a + (bwOnly ? ' reps' : 'kg') + '"></div>';
      }).join('');

      // Rows: done sets show today's logged values; the rest show the unsaved draft,
      // otherwise the same set from the previous session.
      var draft = drafts[key];
      var todayISO = todayStr();
      var todaySess = last && last.date === todayISO ? last : null;
      var prevSess = todaySess ? prev : last;
      var nDone = todaySess ? todaySess.sets.length : 0;
      var exComplete = exDone(ex);
      var strengths = setStrength(mvMap[movementKey(ex.name)], ex.sets);
      var setInputs = '';
      if (!nDone) setInputs += '<div class="set-hint">Tap ✓ after each set — the rest timer starts on its own.' + (strengths ? ' ≈ = reps your recent sessions predict at that weight.' : '') + '</div>';
      if (!nDone && warmupEligible(day, ex)) {
        var w1 = draft && draft.w[0] !== undefined ? parseFloat(draft.w[0]) : (prevSess && prevSess.sets[0] ? prevSess.sets[0].weight : NaN);
        var wuIn = warmupInner(day, ex, w1);
        setInputs += '<div class="wu" id="wu-' + key + '"' + (wuIn ? '' : ' hidden') + '>' + wuIn + '</div>';
      }
      setInputs += '<div class="set-head"><span>Set</span><span>kg</span><span>Reps</span><span></span></div>';
      for (var i = 1; i <= ex.sets; i++) {
        var isDone = i <= nDone;
        var isNext = i === nDone + 1;
        var src = isDone ? todaySess.sets[i - 1] : (prevSess && prevSess.sets[i - 1]) || null;
        var pw = src && src.weight != null ? src.weight : '';
        var pr = src && src.reps != null ? src.reps : '';
        if (!isDone && draft && draft.w[i - 1] !== undefined) pw = draft.w[i - 1];
        if (!isDone && draft && draft.r[i - 1] !== undefined) pr = draft.r[i - 1];
        var pop = justChecked && justChecked.key === key && justChecked.i === i;
        var doneAttr = isDone ? ' data-done="' + i + '"' : '';
        var E = strengths ? strengths[i - 1] : null;
        var tgt = '';
        if (E && isDone && src && src.reps && src.weight > 0) {
          var want = predReps(E, src.weight);
          if (want != null && want >= 1 && want <= 30) {
            var diffR = src.reps - Math.round(want);
            tgt = '<span class="tgt ' + (diffR > 0 ? 'up' : diffR < 0 ? 'down' : '') + '" title="Target ≈' + Math.round(want) + '">' + (diffR > 0 ? '+' + diffR : diffR < 0 ? '−' + (-diffR) : '=') + '</span>';
          }
        } else if (E && !isDone) {
          tgt = '<span class="tgt" data-e="' + E.toFixed(2) + '">' + fmtTarget(predReps(E, parseFloat(pw))) + '</span>';
        }
        setInputs +=
          '<div class="set-row' + (isDone ? ' done' : '') + (isNext ? ' next' : '') + (pop ? ' pop' : '') + '">' +
            '<div class="set-label">' + i + '</div>' +
            '<input type="number" inputmode="decimal" step="0.5" min="0" placeholder="0 = BW" value="' + esc(pw) + '" id="w-' + key + '-' + i + '" data-draft="' + key + '" data-setcount="' + ex.sets + '"' + doneAttr + '>' +
            '<div class="rep-cell"><input type="number" inputmode="numeric" step="1" min="0" placeholder="—" value="' + esc(pr) + '" id="r-' + key + '-' + i + '" data-draft="' + key + '" data-setcount="' + ex.sets + '"' + doneAttr + '>' + tgt + '</div>' +
            '<button class="set-check' + (isNext ? ' next' : '') + '" data-check="' + key + '" data-i="' + i + '" aria-label="Set ' + i + ' done"' +
              ((isDone && i !== nDone) || (!isDone && !isNext) ? ' disabled' : '') + '>' + CHECK + '</button>' +
          '</div>';
        if (isNext && !exComplete) {
          var ws = weightStep(ex);
          setInputs += '<div class="step-row"><span></span>' +
            '<div class="step-pair">' + (bwOnly ? '' : stepBtn(key, i, 'w', -ws) + stepBtn(key, i, 'w', ws)) + '</div>' +
            '<div class="step-pair">' + stepBtn(key, i, 'r', -1) + stepBtn(key, i, 'r', 1) + '</div><span></span></div>';
        }
      }
      setInputs +=
        '<label class="easy-check" style="width:auto;margin:2px 0 10px;">' +
          '<input type="checkbox" id="easy-' + key + '" data-draft="' + key + '" data-setcount="' + ex.sets + '"' + ((draft && draft.easy) || (todaySess && todaySess.easy) ? ' checked' : '') + '> too easy, add weight next time' +
        '</label>';

      var statsHtml = '';
      if (hist.length) {
        var lastVol = last ? volumeOf(last) : null;
        statsHtml = '<div class="stats">' +
          '<div class="stat">Best weight<b>' + (best.weight ? best.weight + ' kg' : '—') + '</b></div>' +
          '<div class="stat">Est. 1RM<b>' + (best.e1rm ? round1(best.e1rm) + ' kg' : '—') + '</b></div>' +
          '<div class="stat">Last volume<b>' + (lastVol ? round1(lastVol) + ' kg' : '—') + '</b></div>' +
        '</div>';
      }

      var sessionsHtml = hist.slice().reverse().map(function(h) {
        var chips = h.sets.map(function(s, idx) {
          var reps = (s.reps && s.reps > 0) ? ' × ' + s.reps : '';
          return '<span class="set-chip">S' + (idx + 1) + ': ' + fmtW(s.weight) + reps + '</span>';
        }).join('');
        var vol = volumeOf(h);
        var volTxt = vol ? ' · ' + round1(vol) + 'kg vol' : '';
        // logged on the wrong one of main/alternatives: move it across from the exercise menu
        var mv = vars.length > 1
          ? '<span class="mv" data-mv-main="' + mainId + '" data-mv-from="' + key + '" data-mv-date="' + h.date + '">Move…</span>'
          : '';
        return '<div class="session" id="sess-' + key + '-' + h.date + '">' +
            '<div class="session-head">' +
              '<span>' + fmtDate(h.date) + (h.easy ? ' <span style="color:#7FBF7F;">↑ easy</span>' : '') + volTxt + '</span>' +
              '<span>' + mv + '<span class="del" data-del-key="' + key + '" data-del-date="' + h.date + '">Delete</span></span>' +
            '</div>' +
            '<div class="session-sets">' + chips + '</div>' +
          '</div>';
      }).join('') || '<div class="hist-row" style="color:#5C5A52;">No entries yet</div>';

      var metaExtra = exComplete ? '<span class="done-chip">✓ Today</span>'
        : nDone ? '<span class="sets-chip">' + nDone + ' / ' + ex.sets + ' sets</span>' : '';
      var inRun = !!runs[exIdx];
      var ssLabel = inRun ? esc(ex.ss) + (day.exercises.slice(0, exIdx).filter(function(e) { return e.ss === ex.ss; }).length + 1) : '';
      models.push({ ex: ex, key: key, idx: exIdx, vars: vars, mainId: mainId, hist: hist, last: last, lastLabel: lastLabel,
        deltaHtml: deltaHtml, hint: hint, prHtml: prHtml, isPr: isPr, best: best, setInputs: setInputs, statsHtml: statsHtml,
        sessionsHtml: sessionsHtml, exComplete: exComplete, nDone: nDone, draft: draft, todaySess: todaySess,
        run: runs[exIdx] || '', ssLabel: ssLabel, metaExtra: metaExtra });
    });
    justChecked = null;

    html = focusKey ? focusHtml(day, models) : listHtml(day, models, prog, sp, complete);
    document.getElementById('gymlog').classList.toggle('focus-on', !!focusKey);
    root.innerHTML = html;
    paintSessClock();
    paintSticky();

    root.querySelectorAll('[data-open]').forEach(function(el) {
      el.addEventListener('click', function() {
        listScroll = window.scrollY;
        focusKey = el.getAttribute('data-open');
        render();
        window.scrollTo(0, 0);
      });
    });
    root.querySelectorAll('[data-back]').forEach(function(el) {
      el.addEventListener('click', function() {
        var from = focusKey;
        focusKey = null;
        render();
        var row = from && document.querySelector('[data-card="' + from + '"]');
        if (row) row.scrollIntoView({ block: 'center' });
        else window.scrollTo(0, listScroll);
      });
    });
    root.querySelectorAll('[data-start]').forEach(function(el) {
      el.addEventListener('click', function() {
        var next = day.exercises.find(function(e) { return !exDone(e); }) || day.exercises[0];
        if (!next) return;
        focusKey = next.id;
        render();
        window.scrollTo(0, 0);
      });
    });
    root.querySelectorAll('[data-daypick]').forEach(function(el) {
      el.addEventListener('click', function(e) { e.stopPropagation(); openDayPicker(); });
    });
    root.querySelectorAll('[data-wd]').forEach(function(el) {
      el.addEventListener('click', function() {
        var d = el.getAttribute('data-wd-day');
        var date = el.getAttribute('data-wd');
        if (el.classList.contains('done') && date !== todayStr()) { showSummary(sessionForDate(date), date); return; }
        if (d && d !== activeDay) { activeDay = d; focusKey = null; render(); }
      });
    });

    root.querySelectorAll('[data-step]').forEach(function(b) {
      b.addEventListener('click', function(e) {
        e.stopPropagation();
        stepValue(b.getAttribute('data-step'), parseInt(b.getAttribute('data-i'), 10), b.getAttribute('data-f'), parseFloat(b.getAttribute('data-d')));
      });
    });

    root.querySelectorAll('[data-toggle]').forEach(function(el) {
      el.addEventListener('click', function() {
        var key = el.getAttribute('data-toggle');
        openCards[key] = !openCards[key];
        var h = document.getElementById('hist-' + key);
        h.classList.toggle('open', openCards[key]);
        root.querySelectorAll('[data-toggle="' + key + '"].toggle').forEach(function(t) {
          t.classList.toggle('open', openCards[key]);
          var hasHist = (entries[key] || []).length > 0;
          t.querySelector('span').textContent = openCards[key] ? 'Close' : (hasHist ? 'Log · history' : 'Log');
        });
      });
    });

    root.querySelectorAll('[data-draft]').forEach(function(inp) {
      var ev = inp.type === 'checkbox' ? 'change' : 'input';
      inp.addEventListener(ev, function() {
        var key = inp.getAttribute('data-draft');
        captureDraft(key, parseInt(inp.getAttribute('data-setcount'), 10));
        // weight changed on an open row: refresh its rep target
        if (inp.id.indexOf('w-') === 0) {
          var t = inp.closest('.set-row').querySelector('.tgt[data-e]');
          if (t) t.textContent = fmtTarget(predReps(parseFloat(t.getAttribute('data-e')), parseFloat(inp.value)));
          var wu = document.getElementById('wu-' + key);
          if (wu && inp.id === 'w-' + key + '-1') {
            var wex = day.exercises.find(function(e) { return e.id === key; });
            var inner = warmupInner(day, wex, parseFloat(inp.value));
            wu.innerHTML = inner;
            wu.hidden = !inner;
          }
        }
        var ts = todaySession(key);
        if (inp.type === 'checkbox' && ts) { ts.easy = inp.checked; saveEntries(); return; }
        var note = document.getElementById('draft-' + key);
        if (note && !ts) note.hidden = false;
      });
    });

    // Fixing a value on a set that's already checked updates today's session straight away.
    root.querySelectorAll('input[data-done]').forEach(function(inp) {
      inp.addEventListener('change', function() {
        var key = inp.getAttribute('data-draft');
        var i = parseInt(inp.getAttribute('data-done'), 10);
        var ts = todaySession(key);
        if (!ts || !ts.sets[i - 1]) return;
        var row = readRow(key, i);
        if (!row.ok) { render(); return; }
        ts.sets[i - 1].weight = row.set.weight;
        ts.sets[i - 1].reps = row.set.reps;
        saveEntries();
      });
    });

    root.querySelectorAll('[data-check]').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var key = btn.getAttribute('data-check');
        var i = parseInt(btn.getAttribute('data-i'), 10);
        var ts = todaySession(key);
        if (ts && i <= ts.sets.length) uncheckSet(key, i);
        else checkSet(key, i);
      });
    });

    var sumLine = root.querySelector('[data-summary]');
    if (sumLine) sumLine.addEventListener('click', function() { showSummary(day); });

    root.querySelectorAll('[data-pp-toggle]').forEach(function(h) {
      h.addEventListener('click', function() {
        var kind = h.getAttribute('data-pp-toggle');
        ppOpen[kind] = !h.parentNode.querySelector('.pp-list');
        renderLog();
      });
    });
    root.querySelectorAll('[data-pp]').forEach(function(cb) {
      cb.addEventListener('change', function() {
        var kind = cb.getAttribute('data-pp'), item = cb.getAttribute('data-item'), d = todayStr();
        if (!prepost[d]) prepost[d] = {};
        var arr = (prepost[d][kind] || []).filter(function(x) { return x !== item; });
        if (cb.checked) arr.push(item);
        prepost[d][kind] = arr;
        savePrepost();
        var c = ppCount(day, d, kind);
        if (c.done === c.total) ppOpen[kind] = false;
        renderLog();
      });
    });

    root.querySelectorAll('[data-pt]').forEach(function(g) {
      g.addEventListener('click', function(e) {
        e.stopPropagation();
        var key = g.getAttribute('data-pt');
        var date = g.getAttribute('data-date');
        g.parentNode.querySelectorAll('.pt').forEach(function(o) {
          o.classList.toggle('sel', o === g);
        });
        document.getElementById('chart-lbl-' + key).textContent = fmtDate(date);
        document.getElementById('chart-val-' + key).textContent = g.getAttribute('data-v');
        root.querySelectorAll('[id^="sess-' + key + '-"]').forEach(function(s) { s.classList.remove('hl'); });
        var sess = document.getElementById('sess-' + key + '-' + date);
        if (sess) { sess.classList.add('hl'); sess.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
      });
    });

    root.querySelectorAll('[data-log]').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var key = btn.getAttribute('data-log');
        var setCount = parseInt(btn.getAttribute('data-setcount'), 10);
        var sets = [];
        for (var i = 1; i <= setCount; i++) {
          var wi = document.getElementById('w-' + key + '-' + i);
          var ri = document.getElementById('r-' + key + '-' + i);
          var w = parseFloat(wi.value);
          var r = parseInt(ri.value, 10);
          var hasW = isFinite(w) && w > 0;
          var hasR = isFinite(r) && r > 0;
          wi.style.borderColor = '';
          // A set counts if it has a load, or reps alone (bodyweight, logged as 0 kg).
          if (hasW || hasR) sets.push({ weight: hasW ? w : 0, reps: hasR ? r : null });
        }
        if (sets.length === 0) {
          document.getElementById('w-' + key + '-1').style.borderColor = '#D97757';
          return;
        }
        var snap = snapshot(key);
        var easy = document.getElementById('easy-' + key).checked;
        if (!entries[key]) entries[key] = [];
        var existing = todaySession(key);
        var now = Date.now();
        // keep the times of sets that were checked off one by one
        sets.forEach(function(s, j) { s.at = existing && existing.sets[j] && existing.sets[j].at ? existing.sets[j].at : now; });
        if (existing) { existing.sets = sets; existing.easy = easy; existing.complete = true; }
        else entries[key].push({ date: todayStr(), sets: sets, easy: easy, complete: true });
        saveEntries();
        clearDraft(key);
        afterSave(key, snap, { rest: false });
      });
    });

    root.querySelectorAll('[data-pick]').forEach(function(b) {
      b.addEventListener('click', function(e) {
        e.stopPropagation();
        openExPicker(b.getAttribute('data-pick'));
      });
    });

    root.querySelectorAll('[data-mv-from]').forEach(function(m) {
      m.addEventListener('click', function(e) {
        e.stopPropagation();
        openExPicker(m.getAttribute('data-mv-main'), { from: m.getAttribute('data-mv-from'), date: m.getAttribute('data-mv-date') });
      });
    });

    root.querySelectorAll('[data-del-key]').forEach(function(del) {
      del.addEventListener('click', function(e) {
        e.stopPropagation();
        var key = del.getAttribute('data-del-key');
        var date = del.getAttribute('data-del-date');
        if (!confirm('Delete this entry?')) return;
        entries[key] = (entries[key] || []).filter(function(h) { return h.date !== date; });
        saveEntries();
        render();
      });
    });

    root.querySelectorAll('[data-timer]').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var key = btn.getAttribute('data-timer');
        var restSec = parseInt(btn.getAttribute('data-rest'), 10);
        if (timer && timer.key === key && timerRemaining() > 0) stopTimer();
        else startTimer(key, restSec, btn.getAttribute('data-name'));
      });
    });

    ensureTicker();
    paintTimers();
  }

  // ---------- routine editor ----------
  function renderEdit() {
    var root = document.getElementById('view');
    var day = routine.find(function(d) { return d.id === activeDay; }) || routine[0];
    var plan = activePlan();
    var cyc = plan.cycle || {};

    var html =
      '<div class="card" style="margin-top:14px;">' +
        '<label class="hint">Active routine</label>' +
        '<select id="plan-select" style="margin-top:6px;">' +
          store.list.map(function(p) {
            return '<option value="' + p.id + '"' + (p.id === plan.id ? ' selected' : '') + '>' + esc(p.name) + '</option>';
          }).join('') +
        '</select>' +
        '<div class="ed-grid">' +
          '<label style="flex:2;">Name<input id="plan-name" value="' + esc(plan.name) + '" style="text-align:left;"></label>' +
        '</div>' +
        '<div class="ed-grid">' +
          '<label style="flex:2;">Cycle start<input type="date" id="cycle-start" value="' + (cyc.start || '') + '"></label>' +
          '<label>Weeks<input type="number" min="1" max="52" id="cycle-weeks" value="' + (cyc.weeks || '') + '"></label>' +
        '</div>' +
        '<label class="hint" style="display:block;margin-top:10px;">Rest days <span style="color:#5C5A52;">· used by the week strip on the Workout screen</span></label>' +
        '<div class="rest-chips">' + [1, 2, 3, 4, 5, 6, 0].map(function(d) {
          var on = restDaysOf(plan).indexOf(d) >= 0;
          return '<button class="rd' + (on ? ' on' : '') + '" data-rd="' + d + '">' + ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][d] + '</button>';
        }).join('') + '</div>' +
        '<div class="ed-actions">' +
          '<button class="ghost mini" id="plan-new">New from template</button>' +
          '<button class="ghost mini" id="plan-dup">Duplicate</button>' +
          '<button class="danger mini" id="plan-del"' + (store.list.length < 2 ? ' disabled' : '') + '>Delete routine</button>' +
        '</div>' +
      '</div>' +
      tabsHtml();

    if (day) {
      activeDay = day.id;
      html +=
        '<div class="card">' +
          '<label class="hint">Day name</label>' +
          '<input id="day-label" value="' + esc(day.label) + '" style="margin-top:6px;">' +
          '<p class="hint" style="margin:6px 0 0;">≈' + estimateMin(day) + ' min per session · same letter in Superset = done alternately</p>' +
          '<div class="ed-actions">' +
            '<button class="ghost mini" id="day-save">Save name</button>' +
            '<button class="danger mini" id="day-del">Delete day</button>' +
          '</div>' +
        '</div>';

      day.exercises.forEach(function(ex, i) {
        html +=
          '<div class="ed-ex">' +
            '<input data-f="name" data-i="' + i + '" value="' + esc(ex.name) + '">' +
            '<div class="ed-grid">' +
              '<label>Sets<input type="number" min="1" max="12" data-f="sets" data-i="' + i + '" value="' + ex.sets + '"></label>' +
              '<label>Rep min<input type="number" min="1" data-f="repMin" data-i="' + i + '" value="' + ex.repMin + '"></label>' +
              '<label>Rep max<input type="number" min="1" data-f="repMax" data-i="' + i + '" value="' + ex.repMax + '"></label>' +
              '<label>Rest sec<input type="number" min="0" step="15" data-f="restSec" data-i="' + i + '" value="' + ex.restSec + '"></label>' +
            '</div>' +
            '<div class="ed-grid">' +
              '<label style="flex:2;">Muscle<select data-f="muscle" data-i="' + i + '">' +
                MUSCLES.map(function(m) { return '<option' + (m === ex.muscle ? ' selected' : '') + '>' + m + '</option>'; }).join('') +
              '</select></label>' +
              '<label>Superset<select data-f="ss" data-i="' + i + '">' +
                ['', 'A', 'B', 'C', 'D'].map(function(l) { return '<option value="' + l + '"' + ((ex.ss || '') === l ? ' selected' : '') + '>' + (l || '—') + '</option>'; }).join('') +
              '</select></label>' +
              '<label class="prio-check"><input type="checkbox" data-f="priority" data-i="' + i + '"' + (ex.priority ? ' checked' : '') + '> Priority</label>' +
            '</div>' +
            (ex.alts || []).map(function(a, k) {
              return '<div class="ed-alt">' +
                  '<div class="ed-alt-h"><span>Alternative ' + (k + 1) + '</span><button class="ghost mini" data-alt-rm="' + i + '" data-a="' + k + '">Remove</button></div>' +
                  '<input data-af="name" data-i="' + i + '" data-a="' + k + '" value="' + esc(a.name) + '">' +
                  '<div class="ed-grid">' +
                    '<label>Sets<input type="number" min="1" max="12" data-af="sets" data-i="' + i + '" data-a="' + k + '" value="' + a.sets + '"></label>' +
                    '<label>Rep min<input type="number" min="1" data-af="repMin" data-i="' + i + '" data-a="' + k + '" value="' + a.repMin + '"></label>' +
                    '<label>Rep max<input type="number" min="1" data-af="repMax" data-i="' + i + '" data-a="' + k + '" value="' + a.repMax + '"></label>' +
                    '<label>Rest sec<input type="number" min="0" step="15" data-af="restSec" data-i="' + i + '" data-a="' + k + '" value="' + a.restSec + '"></label>' +
                  '</div>' +
                '</div>';
            }).join('') +
            '<div class="ed-actions">' +
              '<button class="ghost mini" data-alt-add="' + i + '">+ Alternative</button>' +
              '<button class="ghost mini" data-move="' + i + '" data-dir="-1"' + (i === 0 ? ' disabled' : '') + '>↑</button>' +
              '<button class="ghost mini" data-move="' + i + '" data-dir="1"' + (i === day.exercises.length - 1 ? ' disabled' : '') + '>↓</button>' +
              '<button class="danger mini" data-rm="' + i + '">Delete</button>' +
            '</div>' +
          '</div>';
      });

      html +=
        '<button id="add-ex" style="width:100%;margin-top:6px;">+ Add exercise</button>';
    }

    html +=
      '<div class="toolbar" style="margin-top:14px;">' +
        '<button class="ghost mini" id="add-day">+ New day</button>' +
        '<button class="ghost mini" id="reset-routine">Reset routine</button>' +
      '</div>' +
      '<p class="hint" style="margin-top:10px;">Field edits are saved as soon as you leave the field. Deleting an exercise keeps its history: recreate it with the same name on the same day and the history comes back. A duplicated routine shares history with the original for every exercise you keep. An alternative has its own history: on the Workout screen, tap the exercise name to pick it for today.</p>';

    root.innerHTML = html;
    bindTabs(root);

    document.getElementById('plan-select').addEventListener('change', function(e) {
      switchPlan(e.target.value);
      render();
    });
    document.getElementById('plan-name').addEventListener('change', function(e) {
      var v = e.target.value.trim();
      if (!v) { e.target.value = plan.name; return; }
      plan.name = v;
      saveRoutine();
      render();
    });
    function saveCycle() {
      var s = document.getElementById('cycle-start').value;
      var w = parseInt(document.getElementById('cycle-weeks').value, 10);
      plan.cycle = (s && w > 0) ? { start: s, weeks: w } : null;
      saveRoutine();
      paintCycle();
    }
    document.getElementById('cycle-start').addEventListener('change', saveCycle);
    document.getElementById('cycle-weeks').addEventListener('change', saveCycle);
    root.querySelectorAll('[data-rd]').forEach(function(b) {
      b.addEventListener('click', function() {
        var d = parseInt(b.getAttribute('data-rd'), 10);
        var cur = restDaysOf(plan).slice();
        var at = cur.indexOf(d);
        if (at >= 0) cur.splice(at, 1); else cur.push(d);
        plan.restDays = cur;
        saveRoutine();
        renderEdit();
      });
    });
    document.getElementById('plan-dup').addEventListener('click', function() {
      var name = prompt('Name for the copy:', plan.name + ' (copy)');
      if (!name || !name.trim()) return;
      // Same exercise ids as the original, so the history carries over.
      var copy = { id: uid('plan'), name: name.trim(), days: JSON.parse(JSON.stringify(routine)), cycle: null, template: plan.template };
      store.list.push(copy);
      switchPlan(copy.id);
      render();
    });
    document.getElementById('plan-new').addEventListener('click', openTemplatePicker);
    document.getElementById('plan-del').addEventListener('click', function() {
      if (store.list.length < 2) return;
      if (!confirm('Delete the routine "' + plan.name + '"? Logged history is kept.')) return;
      store.list = store.list.filter(function(p) { return p.id !== plan.id; });
      switchPlan(store.list[0].id);
      render();
    });

    if (!day) return;

    root.querySelectorAll('[data-f]').forEach(function(inp) {
      inp.addEventListener('change', function() {
        var i = parseInt(inp.getAttribute('data-i'), 10);
        var f = inp.getAttribute('data-f');
        var ex = day.exercises[i];
        if (f === 'name') {
          var v = inp.value.trim();
          if (!v) { inp.value = ex.name; return; }
          ex.name = v;
        } else if (f === 'muscle') {
          ex.muscle = inp.value;
        } else if (f === 'priority') {
          ex.priority = inp.checked;
        } else if (f === 'ss') {
          if (inp.value) ex.ss = inp.value; else delete ex.ss;
        } else {
          var n = parseInt(inp.value, 10);
          if (isNaN(n) || n < 0) { inp.value = ex[f]; return; }
          ex[f] = n;
        }
        if (ex.repMax < ex.repMin) ex.repMax = ex.repMin;
        saveRoutine();
        renderEdit();
      });
    });

    root.querySelectorAll('[data-af]').forEach(function(inp) {
      inp.addEventListener('change', function() {
        var a = day.exercises[parseInt(inp.getAttribute('data-i'), 10)].alts[parseInt(inp.getAttribute('data-a'), 10)];
        var f = inp.getAttribute('data-af');
        if (f === 'name') {
          var v = inp.value.trim();
          if (!v) { inp.value = a.name; return; }
          a.name = v;
        } else {
          var n = parseInt(inp.value, 10);
          if (isNaN(n) || n < 0) { inp.value = a[f]; return; }
          a[f] = n;
        }
        if (a.repMax < a.repMin) a.repMax = a.repMin;
        saveRoutine();
        renderEdit();
      });
    });

    root.querySelectorAll('[data-alt-add]').forEach(function(b) {
      b.addEventListener('click', function() {
        var ex = day.exercises[parseInt(b.getAttribute('data-alt-add'), 10)];
        var name = prompt('Alternative to "' + ex.name + '" (same muscle, for when the station is taken):');
        if (!name || !name.trim()) return;
        name = name.trim();
        (ex.alts = ex.alts || []).push({ id: newExId(name), name: name, sets: ex.sets, repMin: ex.repMin, repMax: ex.repMax, restSec: ex.restSec });
        saveRoutine();
        renderEdit();
      });
    });

    root.querySelectorAll('[data-alt-rm]').forEach(function(b) {
      b.addEventListener('click', function() {
        var ex = day.exercises[parseInt(b.getAttribute('data-alt-rm'), 10)];
        var k = parseInt(b.getAttribute('data-a'), 10);
        if (!confirm('Remove the alternative "' + ex.alts[k].name + '"? Its history is kept.')) return;
        ex.alts.splice(k, 1);
        if (!ex.alts.length) delete ex.alts;
        saveRoutine();
        renderEdit();
      });
    });

    // legacy-style id from the name; a fresh one if any exercise or alternative of the routine already uses it
    function newExId(name) {
      var legacyId = day.id + '_' + name.toLowerCase().replace(/[^a-z0-9]+/g, '_');
      var taken = routine.some(function(d) {
        return d.exercises.some(function(e) {
          return e.id === legacyId || (e.alts || []).some(function(a) { return a.id === legacyId; });
        });
      });
      return taken ? uid('ex') : legacyId;
    }

    document.getElementById('day-save').addEventListener('click', function() {
      var v = document.getElementById('day-label').value.trim();
      if (v) { day.label = v; saveRoutine(); render(); }
    });

    document.getElementById('day-del').addEventListener('click', function() {
      if (routine.length <= 1) { alert('You need to keep at least one day.'); return; }
      if (!confirm('Delete "' + day.label + '"? Exercise history is kept.')) return;
      routine = routine.filter(function(d) { return d.id !== day.id; });
      activeDay = routine[0].id;
      saveRoutine();
      render();
    });

    root.querySelectorAll('[data-move]').forEach(function(b) {
      b.addEventListener('click', function() {
        var i = parseInt(b.getAttribute('data-move'), 10);
        var dir = parseInt(b.getAttribute('data-dir'), 10);
        var j = i + dir;
        if (j < 0 || j >= day.exercises.length) return;
        var tmp = day.exercises[i];
        day.exercises[i] = day.exercises[j];
        day.exercises[j] = tmp;
        saveRoutine();
        renderEdit();
      });
    });

    root.querySelectorAll('[data-rm]').forEach(function(b) {
      b.addEventListener('click', function() {
        var i = parseInt(b.getAttribute('data-rm'), 10);
        if (!confirm('Remove "' + day.exercises[i].name + '" from the routine? Its history is kept.')) return;
        day.exercises.splice(i, 1);
        saveRoutine();
        renderEdit();
      });
    });

    document.getElementById('add-ex').addEventListener('click', function() {
      var name = prompt('New exercise name:');
      if (!name || !name.trim()) return;
      name = name.trim();
      day.exercises.push({
        id: newExId(name),
        name: name, muscle: 'Other', priority: false, sets: 3, repMin: 8, repMax: 12, restSec: 90
      });
      saveRoutine();
      renderEdit();
    });

    document.getElementById('add-day').addEventListener('click', function() {
      var label = prompt('New day name:', 'Day ' + (routine.length + 1));
      if (!label || !label.trim()) return;
      var d = { id: uid('day'), label: label.trim(), exercises: [] };
      routine.push(d);
      activeDay = d.id;
      saveRoutine();
      render();
    });

    document.getElementById('reset-routine').addEventListener('click', function() {
      var tpl = templateOf(plan);
      if (!confirm('Reset "' + plan.name + '" to the default ' + tpl.name + ' routine? Your logged weights are NOT affected.')) return;
      routine = tpl.build();
      activeDay = pickStartDay();
      saveRoutine();
      render();
    });
  }

  function openTemplatePicker() {
    var wrap = document.getElementById('sheet');
    wrap.innerHTML =
      '<div class="sheet-bg" data-close></div>' +
      '<div class="sheet">' +
        '<div class="sheet-grab"></div>' +
        '<div class="ex-name" style="font-size:18px;">New routine from template</div>' +
        '<p class="hint" style="margin:4px 0 14px;">It\'s added next to your current routines — nothing is replaced. Exercises with the same name keep their history.</p>' +
        TEMPLATES.map(function(t) {
          var days = t.build();
          var perDay = days.map(function(d) { return d.exercises.length; });
          return '<button class="tpl-opt" data-tpl="' + t.id + '">' +
            '<b>' + esc(t.name) + '</b>' +
            '<span>' + esc(t.desc) + '</span>' +
            '<small>' + days.length + ' days · ' + perDay.join(' / ') + ' exercises · ' + estimateRange(days) + ' min per session</small>' +
          '</button>';
        }).join('') +
        '<button class="ghost" data-close style="width:100%;margin-top:6px;">Cancel</button>' +
      '</div>';
    wrap.hidden = false;
    document.body.style.overflow = 'hidden';
    wrap.querySelectorAll('[data-close]').forEach(function(el) { el.addEventListener('click', closeSheet); });
    wrap.querySelectorAll('[data-tpl]').forEach(function(el) {
      el.addEventListener('click', function() {
        var t = TEMPLATES.find(function(x) { return x.id === el.getAttribute('data-tpl'); });
        var taken = store.list.map(function(p) { return p.name; });
        var name = t.name, n = 2;
        while (taken.indexOf(name) >= 0) name = t.name + ' ' + n++;
        var p = { id: uid('plan'), name: name, days: t.build(), cycle: null, template: t.id };
        store.list.push(p);
        switchPlan(p.id);
        closeSheet();
        render();
      });
    });
  }

  // ---------- data / backup ----------
  function exportPayload() {
    return {
      app: 'gymlog',
      version: 5,
      exportedAt: new Date().toISOString(),
      routines: store,
      routine: routine,
      entries: entries,
      prepost: prepost
    };
  }

  function weeklyVolumeHtml() {
    var rows = weeklyVolume();
    if (!rows.length) return '';
    return '<div class="card">' +
      '<div class="ex-name">This week — sets per muscle</div>' +
      '<p class="hint" style="margin:2px 0 8px;">Logged since Monday vs planned in “' + esc(activePlan().name) + '”.</p>' +
      rows.map(function(r) {
        var pct = r.planned ? Math.min(100, Math.round(r.done / r.planned * 100)) : 100;
        return '<div class="vol-row">' +
            '<div class="vol-name">' + r.muscle + '</div>' +
            '<div class="vol-track"><div class="vol-fill' + (r.planned && r.done >= r.planned ? ' full' : '') + '" style="width:' + pct + '%"></div></div>' +
            '<div class="vol-num">' + r.done + ' / ' + r.planned + '</div>' +
          '</div>';
      }).join('') +
    '</div>';
  }

  function renderData() {
    var root = document.getElementById('view');
    var keys = Object.keys(entries).filter(function(k) { return (entries[k] || []).length; });
    var totalSessions = 0, allDates = [];
    keys.forEach(function(k) {
      totalSessions += entries[k].length;
      entries[k].forEach(function(s) { allDates.push(s.date); });
    });
    allDates.sort();
    var uniqueDays = allDates.filter(function(d, i) { return allDates.indexOf(d) === i; }).length;
    var bd = daysSinceBackup();
    var backupTxt = bd == null ? 'Never backed up.' : bd === 0 ? 'Last backup: today.' : 'Last backup: ' + bd + (bd === 1 ? ' day' : ' days') + ' ago.';

    root.innerHTML =
      '<div class="stats" style="margin-top:14px;">' +
        '<div class="stat">Exercises tracked<b>' + keys.length + '</b></div>' +
        '<div class="stat">Total sessions<b>' + totalSessions + '</b></div>' +
        '<div class="stat">Gym days<b>' + uniqueDays + '</b></div>' +
      '</div>' +
      consistencyHtml() +
      weeklyVolumeHtml() +
      '<div class="card">' +
        '<div class="ex-name">GitHub sync</div>' +
        '<p class="hint" style="margin:4px 0 10px;">Saves everything to a private GitHub repo after each finished workout and whenever you leave the app with unsaved changes.</p>' +
        (syncOn()
          ? '<p class="hint" style="margin:0 0 10px;">Repo: <b style="color:#B7B4A9;">' + esc(sync.repo) + '</b><br><span id="sync-state"></span></p>' +
            '<button id="sync-now" style="width:100%;">Sync now</button>' +
            '<button class="ghost" id="sync-off" style="width:100%;margin-top:8px;">Disconnect</button>'
          : '<input id="sync-repo" placeholder="owner/repo" value="gianlucagrillo/gymlog-data" autocapitalize="off" autocorrect="off" spellcheck="false">' +
            '<input id="sync-token" type="password" placeholder="Fine-grained token (github_pat_…)" autocapitalize="off" autocorrect="off" spellcheck="false" style="margin-top:8px;">' +
            '<button id="sync-connect" style="width:100%;margin-top:8px;">Connect and sync</button>' +
            '<p class="hint" id="sync-state" style="margin:8px 0 0;"></p>') +
      '</div>' +
      '<div class="card">' +
        '<div class="ex-name">Backup</div>' +
        '<p class="hint" style="margin:4px 0 10px;">Your data lives in this browser only. Download a file every so often: if you switch phone or the browser clears its storage, without a backup it is gone.<br><b style="color:#B7B4A9;">' + backupTxt + '</b></p>' +
        '<button id="do-export" style="width:100%;">Download .json backup</button>' +
        '<button class="ghost" id="do-copy" style="width:100%;margin-top:8px;">Copy to clipboard</button>' +
      '</div>' +
      '<div class="card">' +
        '<div class="ex-name">Restore</div>' +
        '<p class="hint" style="margin:4px 0 10px;">Load a backup file, or paste its contents below and hit Import. This replaces all current data.</p>' +
        '<input type="file" accept="application/json,.json" id="file-in" style="padding:8px;">' +
        '<textarea id="paste-in" placeholder="...or paste the JSON here" style="margin-top:8px;"></textarea>' +
        '<button class="ghost" id="do-import" style="width:100%;margin-top:8px;">Import from pasted text</button>' +
      '</div>' +
      '<div class="card">' +
        '<div class="ex-name" style="color:#D97757;">Danger zone</div>' +
        '<p class="hint" style="margin:4px 0 10px;">Wipes every logged session. Your routine stays.</p>' +
        '<button class="danger" id="do-wipe" style="width:100%;">Delete all history</button>' +
      '</div>';

    root.querySelectorAll('.cal i[data-day]').forEach(function(el) {
      el.addEventListener('click', function() { var d = el.getAttribute('data-day'); showSummary(sessionForDate(d), d); });
    });

    paintSyncState();
    if (syncOn()) {
      document.getElementById('sync-now').addEventListener('click', function() {
        pushSync(true).then(function(ok) { if (ok) renderData(); });
      });
      document.getElementById('sync-off').addEventListener('click', function() {
        if (!confirm('Disconnect from GitHub? The token is removed from this phone; data already on GitHub stays there.')) return;
        sync = {};
        saveSync();
        paintBackupNote();
        renderData();
      });
    } else {
      document.getElementById('sync-connect').addEventListener('click', function() {
        var repo = document.getElementById('sync-repo').value.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\/+$/, '');
        var token = document.getElementById('sync-token').value.trim();
        if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) { alert('Repo must look like owner/name.'); return; }
        if (!token) { alert('Paste the token first.'); return; }
        sync = { repo: repo, token: token, dirty: true };
        saveSync();
        pushSync(false).then(function(ok) {
          if (!ok) { var keep = sync.lastErr || 'you seem to be offline'; sync = {}; saveSync(); alert('Not connected: ' + keep + '.'); }
          paintBackupNote();
          renderData();
        });
      });
    }

    document.getElementById('do-export').addEventListener('click', function() {
      var blob = new Blob([JSON.stringify(exportPayload(), null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'gymlog-backup-' + todayStr() + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
      markBackedUp();
      renderData();
    });

    document.getElementById('do-copy').addEventListener('click', function() {
      var txt = JSON.stringify(exportPayload());
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(function() { markBackedUp(); alert('Backup copied to clipboard.'); },
          function() { document.getElementById('paste-in').value = txt; });
      } else {
        document.getElementById('paste-in').value = txt;
        alert('Copy the text from the box below manually.');
      }
    });

    document.getElementById('file-in').addEventListener('change', function(e) {
      var f = e.target.files && e.target.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function() { applyImport(reader.result); };
      reader.readAsText(f);
    });

    document.getElementById('do-import').addEventListener('click', function() {
      applyImport(document.getElementById('paste-in').value);
    });

    document.getElementById('do-wipe').addEventListener('click', function() {
      if (!confirm('Delete ALL logged history?')) return;
      if (!confirm("Are you sure? This can't be undone without a backup.")) return;
      entries = {};
      saveEntries();
      alert('History deleted.');
      render();
    });
  }

  function applyImport(text) {
    var data;
    try { data = JSON.parse(text); }
    catch (e) { alert('Invalid file: that is not readable JSON.'); return; }

    var newEntries = data && data.entries ? data.entries : data;
    if (!newEntries || typeof newEntries !== 'object' || Array.isArray(newEntries)) {
      alert('Invalid file: no history found inside.');
      return;
    }
    var count = 0;
    for (var k in newEntries) {
      if (!Array.isArray(newEntries[k])) { alert('Invalid file: unexpected history structure.'); return; }
      count += newEntries[k].length;
    }
    if (!confirm('Import ' + count + ' sessions? Your current history will be replaced.')) return;

    // Backups also carry the routine they were made with. An older backup would silently
    // bring back an old routine, so ask before touching the current one.
    var hasRoutines = !!(data && data.routines && Array.isArray(data.routines.list) && data.routines.list.length);
    var hasRoutine = !hasRoutines && !!(data && Array.isArray(data.routine) && data.routine.length);
    var takeRoutine = (hasRoutines || hasRoutine) && confirm(
      'This backup also contains ' + (hasRoutines ? 'your saved routines' : 'the routine you had back then') + '.\n\n' +
      'OK = replace your current routine with it\nCancel = keep your current routine, import only the history');

    entries = newEntries;
    saveEntries();
    if (data && data.prepost && typeof data.prepost === 'object' && !Array.isArray(data.prepost)) {
      prepost = data.prepost;
      savePrepost();
    }
    if (takeRoutine && hasRoutines) {
      // v5 backup: all saved routines
      data.routines.list.forEach(function(p) { fillMeta(p.days); });
      store = data.routines;
      routine = activePlan().days;
      saveRoutine();
      activeDay = pickStartDay();
    } else if (takeRoutine && hasRoutine) {
      // older backup: a single routine replaces the active one
      routine = fillMeta(data.routine);
      saveRoutine();
      activeDay = routine[0].id;
    } else {
      activeDay = pickStartDay();
    }
    alert('Import complete.');
    view = 'log';
    render();
  }

  // ---------- bootstrap ----------
  entries = migrate();
  loadRoutines();
  activeDay = pickStartDay();

  document.getElementById('nav-log').addEventListener('click', function() { if (view === 'log') focusKey = null; view = 'log'; render(); });
  document.getElementById('nav-strength').addEventListener('click', function() { view = 'strength'; render(); });
  document.getElementById('nav-edit').addEventListener('click', function() { view = 'edit'; render(); });
  document.getElementById('nav-data').addEventListener('click', function() { view = 'data'; render(); });
  document.getElementById('backup-note').addEventListener('click', function() { view = 'data'; render(); });
  document.getElementById('timer-stop').addEventListener('click', function(e) { e.stopPropagation(); stopTimer(); });
  document.getElementById('timer-add').addEventListener('click', function(e) { e.stopPropagation(); extendTimer(30); });
  document.querySelector('#timer-bar .timer-bar-inner').addEventListener('click', openTimerFull);
  document.getElementById('tfull-close').addEventListener('click', closeTimerFull);
  document.getElementById('tfull-minus').addEventListener('click', function() { extendTimer(-15); });
  document.getElementById('tfull-plus').addEventListener('click', function() { extendTimer(30); });
  document.getElementById('tfull-stop').addEventListener('click', function() { stopTimer(); closeTimerFull(); });

  // Coming back to the app: refresh the timer and re-take the screen wake lock.
  // Leaving or reopening the app pushes any pending changes.
  document.addEventListener('visibilitychange', function() {
    if (sync.dirty) pushSync();
    if (document.visibilityState !== 'visible') return;
    if (timer && timerRemaining() > 0) { acquireWakeLock(); ensureTicker(); }
    paintTimers();
    paintSessClock();
  });
  window.addEventListener('scroll', paintSticky, { passive: true });
  setInterval(paintSessClock, 15000);
  window.addEventListener('online', function() { if (sync.dirty) pushSync(); });

  render();
  if (sync.dirty) pushSync();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('service-worker.js').catch(function() {});
  });
}
</script>
</body>
</html>

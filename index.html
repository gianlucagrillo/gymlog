    for (var c = 0; c < COLS; c++) {
      var mon = addDays(start, c * 7);
      // label each column holding the 1st of a month; label the first column too unless a 1st is right next to it
      var fom = firstOfMonthCol(c);
      var lblDate = fom || (c === 0 && !firstOfMonthCol(1) && !firstOfMonthCol(2) ? mon : null);
      if (lblDate) {
        months += '<span style="grid-column:' + (c + 1) + '">' + new Date(lblDate + 'T00:00:00').toLocaleDateString('en-GB', { month: 'short' }) + '</span>';
      }
      for (var r = 0; r < 7; r++) {
        var d = addDays(mon, r);
        var n = perDay[d] || 0;
        var cls = d > today ? 'fut' : n >= 17 ? 'l3' : n >= 9 ? 'l2' : n > 0 ? 'l1' : '';
        if (d === today) cls += ' today';
        cells += '<i class="' + cls + '" title="' + fmtDate(d) + (n ? ': ' + n + ' sets' : '') + '"></i>';
      }
    }

    // streak = consecutive full weeks (every routine day trained). The current week
    // only counts once it's full; until then it doesn't break the streak.
    var thisWeek = gymDays(thisMon);
    var w = thisWeek >= target ? thisMon : addDays(thisMon, -7), streak = 0;
    while (gymDays(w) >= target) { streak++; w = addDays(w, -7); }
    var best = 0, run = 0;
    for (var wk = mondayOf(dates[0]); wk <= thisMon; wk = addDays(wk, 7)) {
      if (gymDays(wk) >= target) { run++; best = Math.max(best, run); } else if (wk !== thisMon) run = 0;
    }

    return '<div class="card">' +
      '<div class="ex-name">Consistency</div>' +
      '<p class="hint" style="margin:2px 0 10px;">Gym days over the last ' + COLS + ' weeks. A full week = all ' + target + ' routine days.</p>' +
      '<div class="stats">' +
        '<div class="stat">This week<b>' + thisWeek + ' / ' + target + '</b></div>' +
        '<div class="stat">Full weeks in a row<b>' + streak + '</b></div>' +
        '<div class="stat">Best run<b>' + best + '</b></div>' +
      '</div>' +
      '<div class="cal-months">' + months + '</div>' +
      '<div class="cal">' + cells + '</div>' +
      '<div class="cal-legend">Less <i></i><i class="l1"></i><i class="l2"></i><i class="l3"></i> More</div>' +
    '</div>';
  }

  // ---------- strength model ----------
  // Same-name exercises on different days are one movement for strength purposes.
  function allExercises() {
    var out = [];
    store.list.forEach(function(p) { p.days.forEach(function(d) { d.exercises.forEach(function(e) { out.push(e); }); }); });
    return out;
  }
  function movementKey(name) { return String(name).trim().toLowerCase(); }
  function movements() {
    var map = {};
    var activeIds = {};
    routine.forEach(function(d) { d.exercises.forEach(function(e) { activeIds[e.id] = true; }); });
    allExercises().forEach(function(e) {
      var k = movementKey(e.name);
      var m = map[k] || (map[k] = { key: k, name: e.name, muscle: e.muscle, ids: [], active: false });
      if (m.ids.indexOf(e.id) < 0) m.ids.push(e.id);
      if (activeIds[e.id]) { m.active = true; m.muscle = e.muscle; }
    });
    Object.keys(map).forEach(function(k) {
      var m = map[k], byDate = {};
      m.ids.forEach(function(id) {
        (entries[id] || []).forEach(function(s) {
          var x = byDate[s.date] || (byDate[s.date] = { date: s.date, sets: [] });
          x.sets = x.sets.concat(s.sets);
        });
      });
      m.sessions = Object.keys(byDate).sort().map(function(d) {
        var x = byDate[d];
        x.e = bestOf([x]).e1rm;
        x.top = x.sets.reduce(function(b, s) { return (e1rm(s) || 0) > (b ? e1rm(b) || 0 : -1) ? s : b; }, null);
        return x;
      });
      m.withE = m.sessions.filter(function(s) { return s.e > 0; });
    });
    return map;
  }
  // Current strength = best est. 1RM of the last 3 sessions (optionally only before a date).
  function currentE(m, before) {
    var s = m.withE.filter(function(x) { return !before || x.date < before; }).slice(-3);
    return s.length ? Math.max.apply(null, s.map(function(x) { return x.e; })) : 0;
  }
  // Per set position, so later sets carry the fatigue of the earlier ones.
  function setStrength(m, n) {
    if (!m) return null;
    var past = m.withE.filter(function(s) { return s.date < todayStr(); }).slice(-3);
    if (!past.length) return null;
    var fallback = Math.max.apply(null, past.map(function(s) { return s.e; }));
    var out = [];
    for (var i = 0; i < n; i++) {
      var best = 0;
      past.forEach(function(s) { var e = s.sets[i] ? e1rm(s.sets[i]) : 0; if (e > best) best = e; });
      out.push(best || fallback);
    }
    return out;
  }
  // Inverse Epley: reps you should manage at weight w given an est. 1RM.
  function predReps(E, w) {
    if (!E || !(w > 0)) return null;
    return 30 * (E / w - 1);
  }
  function fmtTarget(r) {
    if (r == null || r > 30) return '';
    return r < 1 ? '<1' : '≈' + Math.round(r);
  }

  // ---------- strength balance ----------
  var PAIRS = [
    { a: ['Chest', 'Front delts'], b: ['Back'], la: 'Push', lb: 'Pull' },
    { a: ['Front delts'], b: ['Rear delts'], la: 'Front delts', lb: 'Rear delts' },
    { a: ['Quads'], b: ['Hamstrings'], la: 'Quads', lb: 'Hamstrings' },
    { a: ['Biceps'], b: ['Triceps'], la: 'Biceps', lb: 'Triceps' }
  ];
  function balanceHtml(mv) {
    var plan = activePlan();
    var since = plan.cycle && plan.cycle.start && plan.cycle.start <= todayStr() ? plan.cycle.start : null;
    var rows = [];
    var build = function(from) {
      rows = [];
      Object.keys(mv).forEach(function(k) {
        var m = mv[k];
        if (!m.active) return;
        var s = m.withE.filter(function(x) { return !from || x.date >= from; });
        if (s.length < 3) return;
        var base = s[0].e;
        var cur = Math.max(s[s.length - 1].e, s[s.length - 2].e);
        rows.push({ name: m.name, muscle: m.muscle, base: base, cur: cur, pct: (cur / base - 1) * 100 });
      });
    };
    build(since);
    if (rows.length < 3 && since) { since = null; build(null); }
    if (!rows.length) {
      return '<div class="card" style="margin-top:14px;"><div class="ex-name">Strength balance</div>' +
        '<p class="hint" style="margin:4px 0 0;">Needs at least 3 sessions with reps on an exercise. Keep logging reps and it fills in.</p></div>';
    }
    var firstDate = null;
    Object.keys(mv).forEach(function(k) { var w = mv[k].withE; if (w.length && (!firstDate || w[0].date < firstDate)) firstDate = w[0].date; });

    var byMuscle = {};
    rows.forEach(function(r) { (byMuscle[r.muscle] = byMuscle[r.muscle] || []).push(r.pct); });
    var mPct = {};
    Object.keys(byMuscle).forEach(function(m) { mPct[m] = avg(byMuscle[m]); });
    var focus = {};
    routine.forEach(function(d) { d.exercises.forEach(function(e) { if (e.priority) focus[e.muscle] = true; }); });
    // side delts are what a shoulder block is about even if the flag sits on the press
    if (focus['Front delts'] || focus['Side delts']) { focus['Side delts'] = true; }

    var scale = Math.max(8, 1.15 * Math.max.apply(null, Object.keys(mPct).map(function(m) { return Math.abs(mPct[m]); })));
    var musclesHtml = MUSCLES.filter(function(m) { return mPct[m] !== undefined; }).map(function(m) {
      var p = mPct[m];
      var w = Math.min(50, Math.abs(p) / scale * 50);
      var style = p >= 0 ? 'left:50%;width:' + w + '%' : 'right:50%;width:' + w + '%';
      return '<div class="bal-row"><div>' + m + (focus[m] ? '<span class="focus-tag">FOCUS</span>' : '') + '</div>' +
        '<div class="bal-track"><div class="bal-fill' + (p < 0 ? ' neg' : focus[m] ? ' focus' : '') + '" style="' + style + '"></div></div>' +
        '<div class="bal-num">' + (p >= 0 ? '+' : '') + Math.round(p) + '%</div></div>';
    }).join('');

    var groupPct = function(list) {
      var v = [];
      rows.forEach(function(r) { if (list.indexOf(r.muscle) >= 0) v.push(r.pct); });
      return v.length ? avg(v) : null;
    };
    var pairsHtml = PAIRS.map(function(p) {
      var a = groupPct(p.a), b = groupPct(p.b);
      if (a == null || b == null) return '';
      var diff = a - b;
      var off = Math.abs(diff) >= 3;
      var left = 50 - Math.max(-15, Math.min(15, diff)) / 15 * 46;
      var verdict = !off ? 'In balance' : (diff > 0 ? p.la : p.lb) + ' ahead by ' + Math.round(Math.abs(diff)) + ' pts';
      return '<div class="pair">' +
        '<div class="pair-head"><span>' + p.la + ' <b>' + (a >= 0 ? '+' : '') + Math.round(a) + '%</b></span><span><b>' + (b >= 0 ? '+' : '') + Math.round(b) + '%</b> ' + p.lb + '</span></div>' +
        '<div class="pair-beam"><div class="pair-dot' + (off ? ' off' : '') + '" style="left:' + left.toFixed(1) + '%"></div></div>' +
        '<div class="pair-verdict' + (off ? ' off' : '') + '">' + verdict + '</div></div>';
    }).join('');

    var mvHtml = rows.slice().sort(function(x, y) { return y.pct - x.pct; }).map(function(r) {
      return '<div class="mv-row"><span>' + esc(r.name) + '</span><span>' + round1(r.base) + ' → ' + round1(r.cur) + ' kg</span>' +
        '<b style="color:' + (r.pct >= 0 ? '#7FBF7F' : '#D97757') + '">' + (r.pct >= 0 ? '+' : '') + Math.round(r.pct) + '%</b></div>';
    }).join('');

    var focusNote = focus['Side delts'] && mPct['Side delts'] !== undefined
      ? '<p class="hint" style="margin:10px 0 0;">Shoulders are the focus of this block, so them pulling ahead is the goal, not an imbalance.</p>' : '';

    return '<div class="card" style="margin-top:14px;">' +
      '<div class="ex-name">Strength balance</div>' +
      '<p class="hint" style="margin:2px 0 10px;">How much each muscle\'s est. 1RM has grown since ' + fmtDate(since || firstDate) +
        (since ? ' (cycle start)' : '') + '. It compares progress, not kilos — dumbbells and machines can\'t be compared in kg.</p>' +
      musclesHtml + focusNote +
      (pairsHtml ? '<div style="margin-top:12px;">' + pairsHtml + '</div>' : '') +
      '<details class="mv"><summary>Per exercise</summary>' + mvHtml + '</details>' +
    '</div>';
  }

  // ---------- rep predictor ----------
  var predState = null;
  function predictorHtml(list) {
    var opts = function(sel) {
      return list.map(function(m) { return '<option value="' + esc(m.key) + '"' + (m.key === sel ? ' selected' : '') + '>' + esc(m.name) + '</option>'; }).join('');
    };
    return '<div class="card">' +
      '<div class="ex-name">Rep predictor</div>' +
      '<p class="hint" style="margin:2px 0 0;">Uses the strength ratio between two exercises in your own logs.</p>' +
      '<label class="pl">If I do</label>' +
      '<select id="pa">' + opts(predState.a) + '</select>' +
      '<div class="pgrid">' +
        '<div class="pfield"><input type="number" inputmode="decimal" step="0.5" id="pa-w" value="' + predState.wa + '"><span>kg</span></div>' +
        '<div class="pfield"><input type="number" inputmode="numeric" step="1" id="pa-r" value="' + predState.ra + '"><span>reps</span></div>' +
      '</div>' +
      '<label class="pl">then on</label>' +
      '<select id="pb">' + opts(predState.b) + '</select>' +
      '<div class="pgrid">' +
        '<div class="pfield"><input type="number" inputmode="decimal" step="0.5" id="pb-w" value="' + predState.wb + '"><span>kg</span></div>' +
        '<div></div>' +
      '</div>' +
      '<div class="presult" id="pres"></div>' +
    '</div>';
  }
  function topOf(m) {
    var last = m.withE[m.withE.length - 1];
    return last && last.top ? last.top : { weight: 0, reps: 0 };
  }
  function paintPrediction(mv) {
    var mA = mv[predState.a], mB = mv[predState.b];
    var out = document.getElementById('pres');
    var wa = parseFloat(predState.wa), ra = parseInt(predState.ra, 10), wb = parseFloat(predState.wb);
    if (!mA || !mB || !(wa > 0) || !(ra > 0) || !(wb > 0)) {
      out.innerHTML = '<div class="sub">Fill in weight and reps.</div>';
      return;
    }
    var cA = currentE(mA), cB = currentE(mB);
    var ratio = cB / cA;
    var eA = wa * (1 + ra / 30);
    var eB = eA * ratio;
    var reps = predReps(eB, wb);

    var cutoff = addDays(todayStr(), -42);
    var recent = function(m) { return m.withE.filter(function(s) { return s.date >= cutoff; }).length; };
    var n = Math.min(recent(mA), recent(mB));
    var lastA = mA.withE[mA.withE.length - 1].date, lastB = mB.withE[mB.withE.length - 1].date;
    var gap = Math.abs((new Date(lastA) - new Date(lastB)) / 86400000);
    var level = n >= 4 && gap <= 14 ? 'good' : n >= 2 ? 'fair' : 'low';
    var levelTxt = { good: 'Good data', fair: 'Limited data', low: 'Very little data' }[level];

    var big, sub;
    if (reps < 1) { big = '<1<small> rep</small>'; sub = 'Too heavy — try a lower weight.'; }
    else if (reps > 30) { big = '30+<small> reps</small>'; sub = 'Too light to predict — try a heavier weight.'; }
    else { big = '≈' + Math.round(reps) + '<small> reps</small>'; sub = 'at ' + wb + ' kg on ' + esc(mB.name); }
    var notes = [];
    if (ra > 12 || (reps > 12 && reps <= 30)) notes.push('Above ~12 reps the estimate gets less precise.');
    if (gap > 21) notes.push('The two exercises were last logged ' + Math.round(gap) + ' days apart.');

    out.innerHTML =
      '<div class="big">' + big + '</div>' +
      '<div class="sub">' + sub + '</div>' +
      '<span class="conf ' + level + '">' + levelTxt + '</span>' +
      '<div class="why">' + wa + ' × ' + ra + ' → est. 1RM ' + round1(eA) + ' kg on ' + esc(mA.name) + '.<br>' +
        'Your current ratio ' + esc(mB.name) + ' / ' + esc(mA.name) + ' = ' + ratio.toFixed(2) +
        ' (' + round1(cB) + ' / ' + round1(cA) + ' kg) → ' + round1(eB) + ' kg.' +
        (notes.length ? '<br>' + notes.join(' ') : '') + '</div>';
  }

  function renderStrength() {
    var root = document.getElementById('view');
    var mv = movements();
    var list = Object.keys(mv).map(function(k) { return mv[k]; })
      .filter(function(m) { return m.withE.length; })
      .sort(function(x, y) { return (y.active - x.active) || x.name.localeCompare(y.name); });
    if (!list.length) {
      root.innerHTML = '<div class="card" style="margin-top:14px;"><div class="ex-name">Strength</div>' +
        '<p class="hint" style="margin:4px 0 0;">Log a few sessions with weight and reps and this page shows how your muscles progress against each other, plus a rep predictor between exercises.</p></div>';
      return;
    }
    if (!predState || !mv[predState.a] || !mv[predState.b] || !mv[predState.a].withE.length || !mv[predState.b].withE.length) {
      // start from the block's priority exercise, compared with the best-documented other one
      var prioKeys = {};
      routine.forEach(function(d) { d.exercises.forEach(function(e) { if (e.priority) prioKeys[movementKey(e.name)] = true; }); });
      var byData = list.slice().sort(function(x, y) {
        return (!!prioKeys[y.key] - !!prioKeys[x.key]) || (y.active - x.active) || (y.withE.length - x.withE.length);
      });
      var a = byData[0];
      var b = byData.filter(function(m) { return m !== a && !prioKeys[m.key]; })[0] || byData[1] || a;
      predState = { a: a.key, b: b.key, wa: topOf(a).weight, ra: topOf(a).reps, wb: topOf(b).weight };
    }
    root.innerHTML = balanceHtml(mv) + predictorHtml(list);

    var sync = function() {
      predState.wa = document.getElementById('pa-w').value;
      predState.ra = document.getElementById('pa-r').value;
      predState.wb = document.getElementById('pb-w').value;
      paintPrediction(mv);
    };
    document.getElementById('pa').addEventListener('change', function(e) {
      predState.a = e.target.value;
      var t = topOf(mv[predState.a]);
      document.getElementById('pa-w').value = t.weight;
      document.getElementById('pa-r').value = t.reps;
      sync();
    });
    document.getElementById('pb').addEventListener('change', function(e) {
      predState.b = e.target.value;
      document.getElementById('pb-w').value = topOf(mv[predState.b]).weight;
      sync();
    });
    ['pa-w', 'pa-r', 'pb-w'].forEach(function(id) { document.getElementById(id).addEventListener('input', sync); });
    paintPrediction(mv);
  }

  // ---------- rest timer (clock-anchored, survives re-renders) ----------
  var timer = readJSON(TIMER_KEY, null); // { key, endAt, restSec }
  // A rest that ran out ages ago belongs to a past session: don't resurrect it on launch.
  if (timer && (!timer.endAt || timer.endAt < Date.now() - 10 * 60 * 1000)) {
    timer = null;
    localStorage.removeItem(TIMER_KEY);
  }
  var ticker = null;
  var wakeLock = null;

  // Keep the screen on while resting: a locked phone suspends JS, so the
  // end-of-rest vibration/beep would never fire.
  function acquireWakeLock() {
    try {
      if (!('wakeLock' in navigator) || wakeLock || document.visibilityState !== 'visible') return;
      navigator.wakeLock.request('screen').then(function(l) {
        wakeLock = l;
        l.addEventListener('release', function() { wakeLock = null; });
      }).catch(function() {});
    } catch (e) {}
  }
  function releaseWakeLock() {
    try { if (wakeLock) wakeLock.release(); } catch (e) {}
    wakeLock = null;
  }

  function timerRemaining() {
    if (!timer) return 0;
    return Math.max(0, Math.ceil((timer.endAt - Date.now()) / 1000));
  }
  function startTimer(key, restSec, name) {
    timer = { key: key, name: name || '', endAt: Date.now() + restSec * 1000, restSec: restSec, alerted: false };
    localStorage.setItem(TIMER_KEY, JSON.stringify(timer));
    acquireWakeLock();
    ensureTicker();
    paintTimers();
  }
  function extendTimer(sec) {
    if (!timer) return;
    var base = Math.max(timer.endAt, Date.now());
    timer.endAt = Math.max(Date.now() + 1000, base + sec * 1000);
    timer.restSec = Math.max(1, timer.restSec + sec);
    if (sec > 0) timer.alerted = false;
    localStorage.setItem(TIMER_KEY, JSON.stringify(timer));
    acquireWakeLock();
    ensureTicker();
    paintTimers();
  }

  var tfullOpen = false;
  var RING_C = 2 * Math.PI * 116;
  function openTimerFull() {
    if (!timer) return;
    tfullOpen = true;
    document.getElementById('tfull').hidden = false;
    document.body.style.overflow = 'hidden';
    paintTimers();
  }
  function closeTimerFull() {
    tfullOpen = false;
    document.getElementById('tfull').hidden = true;
    document.body.style.overflow = '';
  }
  // What comes after this rest: the next set of the same exercise, or the next exercise of the day.
  function nextUpHtml() {
    var f = timer && findEx(timer.key);
    if (!f) return '';
    var ts = todaySession(f.ex.id);
    var n = ts ? ts.sets.length : 0;
    if (n < f.ex.sets) {
      var i = n + 1;
      var d = drafts[f.ex.id];
      var prior = sortedHist(f.ex.id).filter(function(s) { return s.date < todayStr(); });
      var p = prior.length ? prior[prior.length - 1].sets[i - 1] : null;
      var w = d && d.w[i - 1] ? parseFloat(d.w[i - 1]) : p ? p.weight : null;
      var r = d && d.r[i - 1] ? parseInt(d.r[i - 1], 10) : p ? p.reps : null;
      var val = (w == null && !r) ? f.ex.repMin + '–' + f.ex.repMax + ' reps' : fmtSet({ weight: w || 0, reps: r || null });
      return '<small>Next · set ' + i + ' of ' + f.ex.sets + '</small><b>' + esc(val) + '</b><span>' + esc(f.ex.name) + '</span>';
    }
    var next = f.day.exercises.find(function(e) { return !exDone(e); });
    if (!next) return '<small>All done</small><b>Workout complete</b>';
    return '<small>Next exercise</small><b>' + esc(next.name) + '</b><span>' + metaOf(next) + ' · rest ' + fmtRest(next.restSec) + '</span>';
  }
  function stopTimer() {
    timer = null;
    localStorage.removeItem(TIMER_KEY);
    releaseWakeLock();
    paintTimers();
  }
  function ensureTicker() {
    if (ticker) return;
    ticker = setInterval(paintTimers, 250);
  }
  function stopTicker() {
    if (ticker) { clearInterval(ticker); ticker = null; }
  }
  function beep() {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      var ctx = new Ctx(), o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 880; g.gain.value = 0.15;
      o.start();
      setTimeout(function() { o.stop(); ctx.close(); }, 350);
    } catch (e) {}
  }
  function paintTimers() {
    var btns = document.querySelectorAll('[data-timer]');
    var remaining = timerRemaining();
    if (timer && remaining <= 0 && !timer.alerted) {
      timer.alerted = true;
      // Only alert if the rest ended just now, not when reopening the app much later.
      if (Date.now() - timer.endAt < 15000) {
        if (navigator.vibrate) navigator.vibrate([250, 100, 250]);
        beep();
      }
      releaseWakeLock();
    }
    var CLOCK_ICO = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>';
    btns.forEach(function(btn) {
      var key = btn.getAttribute('data-timer');
      btn.classList.remove('running', 'done');
      if (timer && timer.key === key) {
        if (remaining > 0) {
          btn.innerHTML = CLOCK_ICO + fmtClock(remaining);
          btn.classList.add('running');
        } else {
          btn.innerHTML = CLOCK_ICO + 'Rest done';
          btn.classList.add('done');
        }
      } else {
        btn.innerHTML = CLOCK_ICO + 'Rest ' + fmtRest(parseInt(btn.getAttribute('data-rest'), 10));
      }
    });

    // Floating bar: visible from anywhere in the app while a rest is running or just ended.
    var bar = document.getElementById('timer-bar');
    var app = document.getElementById('gymlog');
    var showBar = !!timer && (remaining > 0 || Date.now() - timer.endAt < 60000);
    var pct = timer && timer.restSec ? Math.max(0, Math.min(100, (1 - remaining / timer.restSec) * 100)) : 100;
    bar.hidden = !showBar;
    app.classList.toggle('timer-on', showBar);
    if (showBar) {
      bar.classList.toggle('done', remaining <= 0);
      document.getElementById('timer-clock').textContent = remaining > 0 ? fmtClock(remaining) : '0:00';
      document.getElementById('timer-name').innerHTML = '<b>' + esc(timer.name || 'Rest') + '</b>' +
        '<small>' + (remaining > 0 ? 'Resting · tap to expand' : 'Rest done — next set') + '</small>';
      document.getElementById('timer-progress').style.width = pct + '%';
    }

    if (tfullOpen && !showBar) closeTimerFull();
    if (tfullOpen && showBar) {
      var tf = document.getElementById('tfull');
      tf.classList.toggle('done', remaining <= 0);
      document.getElementById('tfull-name').textContent = timer.name || 'Rest';
      document.getElementById('tfull-clock').textContent = remaining > 0 ? fmtClock(remaining) : 'Go';
      document.getElementById('tfull-sub').textContent = remaining > 0 ? 'Rest' : 'Rest done';
      document.getElementById('tfull-prg').style.strokeDashoffset = (RING_C * pct / 100).toFixed(1);
      document.getElementById('tfull-next').innerHTML = nextUpHtml();
      document.getElementById('tfull-stop').textContent = remaining > 0 ? 'Skip' : 'Done';
    }
    // Nothing left to count down: stop ticking instead of spinning forever.
    // While the "done" bar is still shown, keep a slow tick so it hides itself after a minute.
    if (!timer || remaining <= 0) {
      stopTicker();
      if (showBar) setTimeout(paintTimers, 5000);
    }
  }

  // ---------- render ----------
  function render() {
    document.getElementById('nav-log').classList.toggle('active', view === 'log');
    document.getElementById('nav-strength').classList.toggle('active', view === 'strength');
    document.getElementById('nav-edit').classList.toggle('active', view === 'edit');
    document.getElementById('nav-data').classList.toggle('active', view === 'data');
    var sub = document.getElementById('subtitle');
    sub.textContent = view === 'log'
      ? (store.list.length > 1 ? activePlan().name : 'Tap an exercise to log it')
      : view === 'strength' ? 'Muscle balance & rep predictor'
      : view === 'edit' ? 'Add, edit or reorder your exercises'
      : 'Backup, restore and stats';
    if (view === 'log') renderLog();
    else if (view === 'strength') renderStrength();
    else if (view === 'edit') renderEdit();
    else renderData();
    paintBackupNote();
    paintCycle();
    paintTimers();
  }

  function tabsHtml() {
    return '<div class="tabs">' + routine.map(function(d) {
      var p = view === 'log' ? dayProgress(d) : { done: 0, started: 0, total: 1 };
      var mark = p.done >= p.total ? '<span class="tab-check">✓</span>' : p.started ? '<span class="tab-dot"></span>' : '';
      return '<div class="tab ' + (d.id === activeDay ? 'active' : '') + '" data-day="' + d.id + '">' + esc(d.label) + mark + '</div>';
    }).join('') + '</div>';
  }

  function bindTabs(root) {
    root.querySelectorAll('[data-day]').forEach(function(t) {
      t.addEventListener('click', function() {
        activeDay = t.getAttribute('data-day');
        render();
      });
    });
  }

  function renderLog() {
    var root = document.getElementById('view');
    var day = routine.find(function(d) { return d.id === activeDay; }) || routine[0];
    if (!day) { root.innerHTML = '<p class="hint">No days in your routine. Open “Routine” and add one.</p>'; return; }
    activeDay = day.id;

    var html = tabsHtml();
    var mvMap = movements();
    var prog = dayProgress(day);
    if (prog.total && prog.done >= prog.total) {
      html += '<div class="today-line complete" data-summary="1"><span>✓ Workout complete · view summary ›</span></div>';
    } else if (prog.started) {
      html += '<div class="today-line"><span>' + prog.done + ' of ' + prog.total + ' done today</span>' +
        '<div class="today-track"><div class="today-fill" style="width:' + Math.round(prog.done / prog.total * 100) + '%"></div></div></div>';
    }

    day.exercises.forEach(function(ex) {
      var key = ex.id;
      var hist = sortedHist(key);
      var last = hist[hist.length - 1];
      var prev = hist[hist.length - 2];

      var lastWeights = last ? last.sets.map(function(s) { return s.weight; }) : [];
      var lastLabel = lastWeights.length
        ? (lastWeights.every(function(w) { return w === lastWeights[0]; })
            ? fmtW(lastWeights[0])
            : (lastWeights.every(function(w) { return w === 0; }) ? 'BW' : lastWeights.join('/') + 'kg'))
        : '—';

      // --- delta vs last: kept exactly as in the original version, do not refactor ---
      var deltaHtml = '';
      if (last && prev) {
        var diff = Math.round((avg(lastWeights) - avg(prev.sets.map(function(s) { return s.weight; }))) * 10) / 10;
        var cls = diff > 0 ? 'up' : diff < 0 ? 'down' : 'flat';
        var sign = diff > 0 ? '+' : '';
        deltaHtml = '<div class="delta ' + cls + '">' + sign + diff + 'kg vs last</div>';
      }
      // --- end of untouched block ---

      // judge progression on the last finished session, not on today's half-done one
      var hintSess = last && last.date === todayStr() && !exDone(ex) ? prev : last;
      var hint = progressionHint(ex, hintSess);
      var hintHtml = hint ? '<div class="easy-note">' + hint + '</div>' : '';

      var best = bestOf(hist);
      var isPr = !!(last && best.e1rmDate && best.e1rmDate === last.date && hist.length > 1);
      var prHtml = isPr ? ' <span class="pr-badge">PR</span>' : '';

      // Bodyweight exercises have no load to chart, so the sparkline tracks total reps instead.
      var allW = [];
      hist.forEach(function(h) { h.sets.forEach(function(s) { allW.push(s.weight); }); });
      var bwOnly = allW.length > 0 && allW.every(function(w) { return w === 0; });
      var metric = function(h) {
        return bwOnly ? totalReps(h) : round1(avg(h.sets.map(function(s) { return s.weight; })));
      };
      var maxM = Math.max.apply(null, hist.map(metric).concat([1]));
      var sparkBars = hist.slice(-8).map(function(h) {
        var a = metric(h);
        return '<div class="bar" style="height:' + Math.max(4, (a / maxM) * 28) + 'px" title="' + fmtDate(h.date) + ': ' + a + (bwOnly ? ' reps' : 'kg') + '"></div>';
      }).join('');

      // Rows: done sets show today's logged values; the rest show the unsaved draft,
      // otherwise the same set from the previous session.
      var draft = drafts[key];
      var todayISO = todayStr();
      var todaySess = last && last.date === todayISO ? last : null;
      var prevSess = todaySess ? prev : last;
      var nDone = todaySess ? todaySess.sets.length : 0;
      var exComplete = exDone(ex);
      var strengths = setStrength(mvMap[movementKey(ex.name)], ex.sets);
      var setInputs = '<div class="set-head"><span>Set</span><span>kg</span><span>Reps</span><span></span></div>';
      if (!nDone) setInputs += '<div class="set-hint">Tap ✓ after each set — the rest timer starts on its own.' + (strengths ? ' ≈ = reps your recent sessions predict at that weight.' : '') + '</div>';
      for (var i = 1; i <= ex.sets; i++) {
        var isDone = i <= nDone;
        var isNext = i === nDone + 1;
        var src = isDone ? todaySess.sets[i - 1] : (prevSess && prevSess.sets[i - 1]) || null;
        var pw = src && src.weight != null ? src.weight : '';
        var pr = src && src.reps != null ? src.reps : '';
        if (!isDone && draft && draft.w[i - 1] !== undefined) pw = draft.w[i - 1];
        if (!isDone && draft && draft.r[i - 1] !== undefined) pr = draft.r[i - 1];
        var pop = justChecked && justChecked.key === key && justChecked.i === i;
        var doneAttr = isDone ? ' data-done="' + i + '"' : '';
        var E = strengths ? strengths[i - 1] : null;
        var tgt = '';
        if (E && isDone && src && src.reps && src.weight > 0) {
          var want = predReps(E, src.weight);
          if (want != null && want >= 1 && want <= 30) {
            var diffR = src.reps - Math.round(want);
            tgt = '<span class="tgt ' + (diffR > 0 ? 'up' : diffR < 0 ? 'down' : '') + '" title="Target ≈' + Math.round(want) + '">' + (diffR > 0 ? '+' + diffR : diffR < 0 ? '−' + (-diffR) : '=') + '</span>';
          }
        } else if (E && !isDone) {
          tgt = '<span class="tgt" data-e="' + E.toFixed(2) + '">' + fmtTarget(predReps(E, parseFloat(pw))) + '</span>';
        }
        setInputs +=
          '<div class="set-row' + (isDone ? ' done' : '') + (isNext ? ' next' : '') + (pop ? ' pop' : '') + '">' +
            '<div class="set-label">' + i + '</div>' +
            '<input type="number" inputmode="decimal" step="0.5" min="0" placeholder="0 = BW" value="' + esc(pw) + '" id="w-' + key + '-' + i + '" data-draft="' + key + '" data-setcount="' + ex.sets + '"' + doneAttr + '>' +
            '<div class="rep-cell"><input type="number" inputmode="numeric" step="1" min="0" placeholder="—" value="' + esc(pr) + '" id="r-' + key + '-' + i + '" data-draft="' + key + '" data-setcount="' + ex.sets + '"' + doneAttr + '>' + tgt + '</div>' +
            '<button class="set-check' + (isNext ? ' next' : '') + '" data-check="' + key + '" data-i="' + i + '" aria-label="Set ' + i + ' done"' +
              ((isDone && i !== nDone) || (!isDone && !isNext) ? ' disabled' : '') + '>' + CHECK + '</button>' +
          '</div>';
      }
      setInputs +=
        '<label class="easy-check" style="width:auto;margin:2px 0 10px;">' +
          '<input type="checkbox" id="easy-' + key + '" data-draft="' + key + '" data-setcount="' + ex.sets + '"' + ((draft && draft.easy) || (todaySess && todaySess.easy) ? ' checked' : '') + '> too easy, add weight next time' +
        '</label>';

      var statsHtml = '';
      if (hist.length) {
        var lastVol = last ? volumeOf(last) : null;
        statsHtml = '<div class="stats">' +
          '<div class="stat">Best weight<b>' + (best.weight ? best.weight + ' kg' : '—') + '</b></div>' +
          '<div class="stat">Est. 1RM<b>' + (best.e1rm ? round1(best.e1rm) + ' kg' : '—') + '</b></div>' +
          '<div class="stat">Last volume<b>' + (lastVol ? round1(lastVol) + ' kg' : '—') + '</b></div>' +
        '</div>';
      }

      var sessionsHtml = hist.slice().reverse().map(function(h) {
        var chips = h.sets.map(function(s, idx) {
          var reps = (s.reps && s.reps > 0) ? ' × ' + s.reps : '';
          return '<span class="set-chip">S' + (idx + 1) + ': ' + fmtW(s.weight) + reps + '</span>';
        }).join('');
        var vol = volumeOf(h);
        var volTxt = vol ? ' · ' + round1(vol) + 'kg vol' : '';
        return '<div class="session" id="sess-' + key + '-' + h.date + '">' +
            '<div class="session-head">' +
              '<span>' + fmtDate(h.date) + (h.easy ? ' <span style="color:#7FBF7F;">↑ easy</span>' : '') + volTxt + '</span>' +
              '<span class="del" data-del-key="' + key + '" data-del-date="' + h.date + '">Delete</span>' +
            '</div>' +
            '<div class="session-sets">' + chips + '</div>' +
          '</div>';
      }).join('') || '<div class="hist-row" style="color:#5C5A52;">No entries yet</div>';

      var isOpen = !!openCards[key] || (!!draft && !exComplete);
      if (isOpen) openCards[key] = true;
      var metaExtra = exComplete ? '<span class="done-chip">✓ Today</span>'
        : nDone ? '<span class="sets-chip">' + nDone + ' / ' + ex.sets + ' sets</span>' : '';

      html +=
        '<div class="card' + (ex.priority ? ' priority' : '') + (exComplete ? ' logged' : nDone ? ' active' : '') + '" data-card="' + key + '">' +
          '<div class="row" style="justify-content:space-between;align-items:flex-start;cursor:pointer;" data-toggle="' + key + '">' +
            '<div style="min-width:0;">' +
              '<div class="ex-name">' + esc(ex.name) + (ex.priority ? '<span class="prio-tag">PRIORITY</span>' : '') + prHtml + '</div>' +
              '<div class="ex-meta"><span>' + metaOf(ex) + '</span>' + metaExtra + '</div>' +
            '</div>' +
            '<div>' +
              '<div class="weight-badge' + (last ? '' : ' empty') + '">' + lastLabel + '</div>' +
              deltaHtml +
              hintHtml +
            '</div>' +
          '</div>' +
          (hist.length >= 2 ? '<div class="spark">' + sparkBars + '</div>' : '') +
          '<div class="card-foot">' +
            '<button class="ghost timer-btn" data-timer="' + key + '" data-rest="' + ex.restSec + '" data-name="' + esc(ex.name) + '"></button>' +
            '<div class="toggle' + (isOpen ? ' open' : '') + '" data-toggle="' + key + '"><span>' + (isOpen ? 'Close' : (hist.length ? 'Log · history' : 'Log')) + '</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></div>' +
          '</div>' +
          '<div class="history' + (isOpen ? ' open' : '') + '" id="hist-' + key + '">' +
            setInputs +
            '<button class="ghost" data-log="' + key + '" data-setcount="' + ex.sets + '" style="width:100%;margin-top:4px;">' + (exComplete ? 'Update today’s session' : 'Log all sets at once') + '</button>' +
            '<div class="draft-note" id="draft-' + key + '"' + (draft && !todaySess ? '' : ' hidden') + '>Not saved yet — tap ✓ or Log all sets</div>' +
            (hist.length ? '<div style="margin-top:14px;padding-top:12px;border-top:1px solid #2A2E34;">' + chartHtml(key, hist) + statsHtml + sessionsHtml + '</div>' : '') +
          '</div>' +
        '</div>';
    });
    justChecked = null;

    root.innerHTML = html;
    bindTabs(root);

    root.querySelectorAll('[data-toggle]').forEach(function(el) {
      el.addEventListener('click', function() {
        var key = el.getAttribute('data-toggle');
        openCards[key] = !openCards[key];
        var h = document.getElementById('hist-' + key);
        h.classList.toggle('open', openCards[key]);
        root.querySelectorAll('[data-toggle="' + key + '"].toggle').forEach(function(t) {
          t.classList.toggle('open', openCards[key]);
          var hasHist = (entries[key] || []).length > 0;
          t.querySelector('span').textContent = openCards[key] ? 'Close' : (hasHist ? 'Log · history' : 'Log');
        });
      });
    });

    root.querySelectorAll('[data-draft]').forEach(function(inp) {
      var ev = inp.type === 'checkbox' ? 'change' : 'input';
      inp.addEventListener(ev, function() {
        var key = inp.getAttribute('data-draft');
        captureDraft(key, parseInt(inp.getAttribute('data-setcount'), 10));
        // weight changed on an open row: refresh its rep target
        if (inp.id.indexOf('w-') === 0) {
          var t = inp.closest('.set-row').querySelector('.tgt[data-e]');
          if (t) t.textContent = fmtTarget(predReps(parseFloat(t.getAttribute('data-e')), parseFloat(inp.value)));
        }
        var ts = todaySession(key);
        if (inp.type === 'checkbox' && ts) { ts.easy = inp.checked; saveEntries(); return; }
        var note = document.getElementById('draft-' + key);
        if (note && !ts) note.hidden = false;
      });
    });

    // Fixing a value on a set that's already checked updates today's session straight away.
    root.querySelectorAll('input[data-done]').forEach(function(inp) {
      inp.addEventListener('change', function() {
        var key = inp.getAttribute('data-draft');
        var i = parseInt(inp.getAttribute('data-done'), 10);
        var ts = todaySession(key);
        if (!ts || !ts.sets[i - 1]) return;
        var row = readRow(key, i);
        if (!row.ok) { render(); return; }
        ts.sets[i - 1].weight = row.set.weight;
        ts.sets[i - 1].reps = row.set.reps;
        saveEntries();
      });
    });

    root.querySelectorAll('[data-check]').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var key = btn.getAttribute('data-check');
        var i = parseInt(btn.getAttribute('data-i'), 10);
        var ts = todaySession(key);
        if (ts && i <= ts.sets.length) uncheckSet(key, i);
        else checkSet(key, i);
      });
    });

    var sumLine = root.querySelector('[data-summary]');
    if (sumLine) sumLine.addEventListener('click', function() { showSummary(day); });

    root.querySelectorAll('[data-pt]').forEach(function(g) {
      g.addEventListener('click', function(e) {
        e.stopPropagation();
        var key = g.getAttribute('data-pt');
        var date = g.getAttribute('data-date');
        g.parentNode.querySelectorAll('.pt').forEach(function(o) {
          o.classList.toggle('sel', o === g);
        });
        document.getElementById('chart-lbl-' + key).textContent = fmtDate(date);
        document.getElementById('chart-val-' + key).textContent = g.getAttribute('data-v');
        root.querySelectorAll('[id^="sess-' + key + '-"]').forEach(function(s) { s.classList.remove('hl'); });
        var sess = document.getElementById('sess-' + key + '-' + date);
        if (sess) { sess.classList.add('hl'); sess.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
      });
    });

    root.querySelectorAll('[data-log]').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var key = btn.getAttribute('data-log');
        var setCount = parseInt(btn.getAttribute('data-setcount'), 10);
        var sets = [];
        for (var i = 1; i <= setCount; i++) {
          var wi = document.getElementById('w-' + key + '-' + i);
          var ri = document.getElementById('r-' + key + '-' + i);
          var w = parseFloat(wi.value);
          var r = parseInt(ri.value, 10);
          var hasW = isFinite(w) && w > 0;
          var hasR = isFinite(r) && r > 0;
          wi.style.borderColor = '';
          // A set counts if it has a load, or reps alone (bodyweight, logged as 0 kg).
          if (hasW || hasR) sets.push({ weight: hasW ? w : 0, reps: hasR ? r : null });
        }
        if (sets.length === 0) {
          document.getElementById('w-' + key + '-1').style.borderColor = '#D97757';
          return;
        }
        var snap = snapshot(key);
        var easy = document.getElementById('easy-' + key).checked;
        if (!entries[key]) entries[key] = [];
        var existing = todaySession(key);
        var now = Date.now();
        // keep the times of sets that were checked off one by one
        sets.forEach(function(s, j) { s.at = existing && existing.sets[j] && existing.sets[j].at ? existing.sets[j].at : now; });
        if (existing) { existing.sets = sets; existing.easy = easy; existing.complete = true; }
        else entries[key].push({ date: todayStr(), sets: sets, easy: easy, complete: true });
        saveEntries();
        clearDraft(key);
        afterSave(key, snap, { rest: false });
      });
    });

    root.querySelectorAll('[data-del-key]').forEach(function(del) {
      del.addEventListener('click', function(e) {
        e.stopPropagation();
        var key = del.getAttribute('data-del-key');
        var date = del.getAttribute('data-del-date');
        if (!confirm('Delete this entry?')) return;
        entries[key] = (entries[key] || []).filter(function(h) { return h.date !== date; });
        saveEntries();
        render();
      });
    });

    root.querySelectorAll('[data-timer]').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var key = btn.getAttribute('data-timer');
        var restSec = parseInt(btn.getAttribute('data-rest'), 10);
        if (timer && timer.key === key && timerRemaining() > 0) stopTimer();
        else startTimer(key, restSec, btn.getAttribute('data-name'));
      });
    });

    ensureTicker();
    paintTimers();
  }

  // ---------- routine editor ----------
  function renderEdit() {
    var root = document.getElementById('view');
    var day = routine.find(function(d) { return d.id === activeDay; }) || routine[0];
    var plan = activePlan();
    var cyc = plan.cycle || {};

    var html =
      '<div class="card" style="margin-top:14px;">' +
        '<label class="hint">Active routine</label>' +
        '<select id="plan-select" style="margin-top:6px;">' +
          store.list.map(function(p) {
            return '<option value="' + p.id + '"' + (p.id === plan.id ? ' selected' : '') + '>' + esc(p.name) + '</option>';
          }).join('') +
        '</select>' +
        '<div class="ed-grid">' +
          '<label style="flex:2;">Name<input id="plan-name" value="' + esc(plan.name) + '" style="text-align:left;"></label>' +
        '</div>' +
        '<div class="ed-grid">' +
          '<label style="flex:2;">Cycle start<input type="date" id="cycle-start" value="' + (cyc.start || '') + '"></label>' +
          '<label>Weeks<input type="number" min="1" max="52" id="cycle-weeks" value="' + (cyc.weeks || '') + '"></label>' +
        '</div>' +
        '<div class="ed-actions">' +
          '<button class="ghost mini" id="plan-dup">Duplicate</button>' +
          '<button class="danger mini" id="plan-del"' + (store.list.length < 2 ? ' disabled' : '') + '>Delete routine</button>' +
        '</div>' +
      '</div>' +
      tabsHtml();

    if (day) {
      activeDay = day.id;
      html +=
        '<div class="card">' +
          '<label class="hint">Day name</label>' +
          '<input id="day-label" value="' + esc(day.label) + '" style="margin-top:6px;">' +
          '<div class="ed-actions">' +
            '<button class="ghost mini" id="day-save">Save name</button>' +
            '<button class="danger mini" id="day-del">Delete day</button>' +
          '</div>' +
        '</div>';

      day.exercises.forEach(function(ex, i) {
        html +=
          '<div class="ed-ex">' +
            '<input data-f="name" data-i="' + i + '" value="' + esc(ex.name) + '">' +
            '<div class="ed-grid">' +
              '<label>Sets<input type="number" min="1" max="12" data-f="sets" data-i="' + i + '" value="' + ex.sets + '"></label>' +
              '<label>Rep min<input type="number" min="1" data-f="repMin" data-i="' + i + '" value="' + ex.repMin + '"></label>' +
              '<label>Rep max<input type="number" min="1" data-f="repMax" data-i="' + i + '" value="' + ex.repMax + '"></label>' +
              '<label>Rest sec<input type="number" min="0" step="15" data-f="restSec" data-i="' + i + '" value="' + ex.restSec + '"></label>' +
            '</div>' +
            '<div class="ed-grid">' +
              '<label style="flex:2;">Muscle<select data-f="muscle" data-i="' + i + '">' +
                MUSCLES.map(function(m) { return '<option' + (m === ex.muscle ? ' selected' : '') + '>' + m + '</option>'; }).join('') +
              '</select></label>' +
              '<label class="prio-check"><input type="checkbox" data-f="priority" data-i="' + i + '"' + (ex.priority ? ' checked' : '') + '> Priority</label>' +
            '</div>' +
            '<div class="ed-actions">' +
              '<button class="ghost mini" data-move="' + i + '" data-dir="-1"' + (i === 0 ? ' disabled' : '') + '>↑</button>' +
              '<button class="ghost mini" data-move="' + i + '" data-dir="1"' + (i === day.exercises.length - 1 ? ' disabled' : '') + '>↓</button>' +
              '<button class="danger mini" data-rm="' + i + '">Delete</button>' +
            '</div>' +
          '</div>';
      });

      html +=
        '<button id="add-ex" style="width:100%;margin-top:6px;">+ Add exercise</button>';
    }

    html +=
      '<div class="toolbar" style="margin-top:14px;">' +
        '<button class="ghost mini" id="add-day">+ New day</button>' +
        '<button class="ghost mini" id="reset-routine">Reset routine</button>' +
      '</div>' +
      '<p class="hint" style="margin-top:10px;">Field edits are saved as soon as you leave the field. Deleting an exercise keeps its history: recreate it with the same name on the same day and the history comes back. A duplicated routine shares history with the original for every exercise you keep.</p>';

    root.innerHTML = html;
    bindTabs(root);

    document.getElementById('plan-select').addEventListener('change', function(e) {
      switchPlan(e.target.value);
      render();
    });
    document.getElementById('plan-name').addEventListener('change', function(e) {
      var v = e.target.value.trim();
      if (!v) { e.target.value = plan.name; return; }
      plan.name = v;
      saveRoutine();
      render();
    });
    function saveCycle() {
      var s = document.getElementById('cycle-start').value;
      var w = parseInt(document.getElementById('cycle-weeks').value, 10);
      plan.cycle = (s && w > 0) ? { start: s, weeks: w } : null;
      saveRoutine();
      paintCycle();
    }
    document.getElementById('cycle-start').addEventListener('change', saveCycle);
    document.getElementById('cycle-weeks').addEventListener('change', saveCycle);
    document.getElementById('plan-dup').addEventListener('click', function() {
      var name = prompt('Name for the copy:', plan.name + ' (copy)');
      if (!name || !name.trim()) return;
      // Same exercise ids as the original, so the history carries over.
      var copy = { id: uid('plan'), name: name.trim(), days: JSON.parse(JSON.stringify(routine)), cycle: null };
      store.list.push(copy);
      switchPlan(copy.id);
      render();
    });
    document.getElementById('plan-del').addEventListener('click', function() {
      if (store.list.length < 2) return;
      if (!confirm('Delete the routine "' + plan.name + '"? Logged history is kept.')) return;
      store.list = store.list.filter(function(p) { return p.id !== plan.id; });
      switchPlan(store.list[0].id);
      render();
    });

    if (!day) return;

    root.querySelectorAll('[data-f]').forEach(function(inp) {
      inp.addEventListener('change', function() {
        var i = parseInt(inp.getAttribute('data-i'), 10);
        var f = inp.getAttribute('data-f');
        var ex = day.exercises[i];
        if (f === 'name') {
          var v = inp.value.trim();
          if (!v) { inp.value = ex.name; return; }
          ex.name = v;
        } else if (f === 'muscle') {
          ex.muscle = inp.value;
        } else if (f === 'priority') {
          ex.priority = inp.checked;
        } else {
          var n = parseInt(inp.value, 10);
          if (isNaN(n) || n < 0) { inp.value = ex[f]; return; }
          ex[f] = n;
        }
        if (ex.repMax < ex.repMin) ex.repMax = ex.repMin;
        saveRoutine();
        renderEdit();
      });
    });

    document.getElementById('day-save').addEventListener('click', function() {
      var v = document.getElementById('day-label').value.trim();
      if (v) { day.label = v; saveRoutine(); render(); }
    });

    document.getElementById('day-del').addEventListener('click', function() {
      if (routine.length <= 1) { alert('You need to keep at least one day.'); return; }
      if (!confirm('Delete "' + day.label + '"? Exercise history is kept.')) return;
      routine = routine.filter(function(d) { return d.id !== day.id; });
      activeDay = routine[0].id;
      saveRoutine();
      render();
    });

    root.querySelectorAll('[data-move]').forEach(function(b) {
      b.addEventListener('click', function() {
        var i = parseInt(b.getAttribute('data-move'), 10);
        var dir = parseInt(b.getAttribute('data-dir'), 10);
        var j = i + dir;
        if (j < 0 || j >= day.exercises.length) return;
        var tmp = day.exercises[i];
        day.exercises[i] = day.exercises[j];
        day.exercises[j] = tmp;
        saveRoutine();
        renderEdit();
      });
    });

    root.querySelectorAll('[data-rm]').forEach(function(b) {
      b.addEventListener('click', function() {
        var i = parseInt(b.getAttribute('data-rm'), 10);
        if (!confirm('Remove "' + day.exercises[i].name + '" from the routine? Its history is kept.')) return;
        day.exercises.splice(i, 1);
        saveRoutine();
        renderEdit();
      });
    });

    document.getElementById('add-ex').addEventListener('click', function() {
      var name = prompt('New exercise name:');
      if (!name || !name.trim()) return;
      name = name.trim();
      var legacyId = day.id + '_' + name.toLowerCase().replace(/[^a-z0-9]+/g, '_');
      var taken = routine.some(function(d) {
        return d.exercises.some(function(e) { return e.id === legacyId; });
      });
      day.exercises.push({
        id: taken ? uid('ex') : legacyId,
        name: name, muscle: 'Other', priority: false, sets: 3, repMin: 8, repMax: 12, restSec: 90
      });
      saveRoutine();
      renderEdit();
    });

    document.getElementById('add-day').addEventListener('click', function() {
      var label = prompt('New day name:', 'Day ' + (routine.length + 1));
      if (!label || !label.trim()) return;
      var d = { id: uid('day'), label: label.trim(), exercises: [] };
      routine.push(d);
      activeDay = d.id;
      saveRoutine();
      render();
    });

    document.getElementById('reset-routine').addEventListener('click', function() {
      if (!confirm('Reset "' + plan.name + '" to the default shoulder specialization routine? Your logged weights are NOT affected.')) return;
      routine = defaultRoutine();
      activeDay = routine[0].id;
      saveRoutine();
      render();
    });
  }

  // ---------- data / backup ----------
  function exportPayload() {
    return {
      app: 'gymlog',
      version: 5,
      exportedAt: new Date().toISOString(),
      routines: store,
      routine: routine,
      entries: entries
    };
  }

  function weeklyVolumeHtml() {
    var rows = weeklyVolume();
    if (!rows.length) return '';
    return '<div class="card">' +
      '<div class="ex-name">This week — sets per muscle</div>' +
      '<p class="hint" style="margin:2px 0 8px;">Logged since Monday vs planned in “' + esc(activePlan().name) + '”.</p>' +
      rows.map(function(r) {
        var pct = r.planned ? Math.min(100, Math.round(r.done / r.planned * 100)) : 100;
        return '<div class="vol-row">' +
            '<div class="vol-name">' + r.muscle + '</div>' +
            '<div class="vol-track"><div class="vol-fill' + (r.planned && r.done >= r.planned ? ' full' : '') + '" style="width:' + pct + '%"></div></div>' +
            '<div class="vol-num">' + r.done + ' / ' + r.planned + '</div>' +
          '</div>';
      }).join('') +
    '</div>';
  }

  function renderData() {
    var root = document.getElementById('view');
    var keys = Object.keys(entries).filter(function(k) { return (entries[k] || []).length; });
    var totalSessions = 0, allDates = [];
    keys.forEach(function(k) {
      totalSessions += entries[k].length;
      entries[k].forEach(function(s) { allDates.push(s.date); });
    });
    allDates.sort();
    var uniqueDays = allDates.filter(function(d, i) { return allDates.indexOf(d) === i; }).length;
    var bd = daysSinceBackup();
    var backupTxt = bd == null ? 'Never backed up.' : bd === 0 ? 'Last backup: today.' : 'Last backup: ' + bd + (bd === 1 ? ' day' : ' days') + ' ago.';

    root.innerHTML =
      '<div class="stats" style="margin-top:14px;">' +
        '<div class="stat">Exercises tracked<b>' + keys.length + '</b></div>' +
        '<div class="stat">Total sessions<b>' + totalSessions + '</b></div>' +
        '<div class="stat">Gym days<b>' + uniqueDays + '</b></div>' +
      '</div>' +
      consistencyHtml() +
      weeklyVolumeHtml() +
      '<div class="card">' +
        '<div class="ex-name">Backup</div>' +
        '<p class="hint" style="margin:4px 0 10px;">Your data lives in this browser only. Download a file every so often: if you switch phone or the browser clears its storage, without a backup it is gone.<br><b style="color:#B7B4A9;">' + backupTxt + '</b></p>' +
        '<button id="do-export" style="width:100%;">Download .json backup</button>' +
        '<button class="ghost" id="do-copy" style="width:100%;margin-top:8px;">Copy to clipboard</button>' +
      '</div>' +
      '<div class="card">' +
        '<div class="ex-name">Restore</div>' +
        '<p class="hint" style="margin:4px 0 10px;">Load a backup file, or paste its contents below and hit Import. This replaces all current data.</p>' +
        '<input type="file" accept="application/json,.json" id="file-in" style="padding:8px;">' +
        '<textarea id="paste-in" placeholder="...or paste the JSON here" style="margin-top:8px;"></textarea>' +
        '<button class="ghost" id="do-import" style="width:100%;margin-top:8px;">Import from pasted text</button>' +
      '</div>' +
      '<div class="card">' +
        '<div class="ex-name" style="color:#D97757;">Danger zone</div>' +
        '<p class="hint" style="margin:4px 0 10px;">Wipes every logged session. Your routine stays.</p>' +
        '<button class="danger" id="do-wipe" style="width:100%;">Delete all history</button>' +
      '</div>';

    document.getElementById('do-export').addEventListener('click', function() {
      var blob = new Blob([JSON.stringify(exportPayload(), null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'gymlog-backup-' + todayStr() + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
      markBackedUp();
      renderData();
    });

    document.getElementById('do-copy').addEventListener('click', function() {
      var txt = JSON.stringify(exportPayload());
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(function() { markBackedUp(); alert('Backup copied to clipboard.'); },
          function() { document.getElementById('paste-in').value = txt; });
      } else {
        document.getElementById('paste-in').value = txt;
        alert('Copy the text from the box below manually.');
      }
    });

    document.getElementById('file-in').addEventListener('change', function(e) {
      var f = e.target.files && e.target.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function() { applyImport(reader.result); };
      reader.readAsText(f);
    });

    document.getElementById('do-import').addEventListener('click', function() {
      applyImport(document.getElementById('paste-in').value);
    });

    document.getElementById('do-wipe').addEventListener('click', function() {
      if (!confirm('Delete ALL logged history?')) return;
      if (!confirm("Are you sure? This can't be undone without a backup.")) return;
      entries = {};
      saveEntries();
      alert('History deleted.');
      render();
    });
  }

  function applyImport(text) {
    var data;
    try { data = JSON.parse(text); }
    catch (e) { alert('Invalid file: that is not readable JSON.'); return; }

    var newEntries = data && data.entries ? data.entries : data;
    if (!newEntries || typeof newEntries !== 'object' || Array.isArray(newEntries)) {
      alert('Invalid file: no history found inside.');
      return;
    }
    var count = 0;
    for (var k in newEntries) {
      if (!Array.isArray(newEntries[k])) { alert('Invalid file: unexpected history structure.'); return; }
      count += newEntries[k].length;
    }
    if (!confirm('Import ' + count + ' sessions? Your current data will be replaced.')) return;

    entries = newEntries;
    saveEntries();
    if (data && data.routines && Array.isArray(data.routines.list) && data.routines.list.length) {
      // v5 backup: all saved routines
      data.routines.list.forEach(function(p) { fillMeta(p.days); });
      store = data.routines;
      routine = activePlan().days;
      saveRoutine();
      activeDay = pickStartDay();
    } else if (data && Array.isArray(data.routine) && data.routine.length) {
      // older backup: a single routine replaces the active one
      routine = fillMeta(data.routine);
      saveRoutine();
      activeDay = routine[0].id;
    }
    alert('Import complete.');
    view = 'log';
    render();
  }

  // ---------- bootstrap ----------
  entries = migrate();
  loadRoutines();
  activeDay = pickStartDay();

  document.getElementById('nav-log').addEventListener('click', function() { view = 'log'; render(); });
  document.getElementById('nav-strength').addEventListener('click', function() { view = 'strength'; render(); });
  document.getElementById('nav-edit').addEventListener('click', function() { view = 'edit'; render(); });
  document.getElementById('nav-data').addEventListener('click', function() { view = 'data'; render(); });
  document.getElementById('backup-note').addEventListener('click', function() { view = 'data'; render(); });
  document.getElementById('timer-stop').addEventListener('click', function(e) { e.stopPropagation(); stopTimer(); });
  document.getElementById('timer-add').addEventListener('click', function(e) { e.stopPropagation(); extendTimer(30); });
  document.querySelector('#timer-bar .timer-bar-inner').addEventListener('click', openTimerFull);
  document.getElementById('tfull-close').addEventListener('click', closeTimerFull);
  document.getElementById('tfull-minus').addEventListener('click', function() { extendTimer(-15); });
  document.getElementById('tfull-plus').addEventListener('click', function() { extendTimer(30); });
  document.getElementById('tfull-stop').addEventListener('click', function() { stopTimer(); closeTimerFull(); });

  // Coming back to the app: refresh the timer and re-take the screen wake lock.
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState !== 'visible') return;
    if (timer && timerRemaining() > 0) { acquireWakeLock(); ensureTicker(); }
    paintTimers();
  });

  render();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('service-worker.js').catch(function() {});
  });
}
</script>
</body>
</html>

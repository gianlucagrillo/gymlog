<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gym log</title>
<meta name="theme-color" content="#16181B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym log">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
  html, body { margin: 0; padding: 0; background: #131518; min-height: 100vh; }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); padding-top: max(8px, env(safe-area-inset-top)); -webkit-tap-highlight-color: transparent; }
  /* keeps content scrolling under the sticky day bar from showing through a translucent status bar */
  body::before { content: ''; position: fixed; left: 0; right: 0; top: 0; height: env(safe-area-inset-top, 0px); background: #131518; z-index: 30; }

  #gymlog * { box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }
  #gymlog h1, #gymlog .num, #gymlog .weight-badge, #gymlog .timer-clock, #gymlog .stat b, #gymlog .vol-num { font-family: 'Barlow Condensed', 'Inter', sans-serif; }
  #gymlog { color: #EDEBE3; max-width: 520px; margin: 0 auto; padding: 8px 14px calc(96px + env(safe-area-inset-bottom)); }
  #gymlog.timer-on { padding-bottom: calc(160px + env(safe-area-inset-bottom)); }
  #gymlog select, #gymlog input, #gymlog textarea { background: #21242A; border: 1px solid #3A3E46; color: #EDEBE3; border-radius: 8px; padding: 10px 12px; font-size: 15px; width: 100%; }
  #gymlog select:focus, #gymlog input:focus, #gymlog textarea:focus { outline: none; border-color: #E8A33D; }
  #gymlog button { background: #E8A33D; color: #16181B; border: none; border-radius: 8px; padding: 11px 16px; font-weight: 600; font-size: 14px; cursor: pointer; }
  #gymlog button:active { transform: scale(0.98); }
  #gymlog button:disabled { opacity: .35; cursor: default; }
  #gymlog button.ghost { background: transparent; border: 1px solid #3A3E46; color: #B7B4A9; }
  #gymlog button.danger { background: transparent; border: 1px solid #D97757; color: #D97757; }
  #gymlog button.mini { padding: 6px 10px; font-size: 12px; }
  #gymlog .card { background: #1C1F23; border: 1px solid #2A2E34; border-radius: 14px; padding: 14px 16px 12px; margin-bottom: 10px; }
  #gymlog .row { display: flex; gap: 10px; align-items: center; }
  #gymlog .ex-name { font-weight: 600; font-size: 15px; line-height: 1.3; }
  #gymlog .ex-meta { color: #8C8A82; font-size: 12px; margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
  #gymlog .weight-badge { font-size: 28px; font-weight: 700; color: #E8A33D; min-width: 64px; text-align: right; line-height: 1; white-space: nowrap; }
  #gymlog .weight-badge.empty { color: #3A3E46; }
  #gymlog .delta { font-size: 12px; margin-top: 2px; text-align: right; white-space: nowrap; }
  #gymlog .delta.up { color: #7FBF7F; }
  #gymlog .delta.down { color: #D97757; }
  #gymlog .delta.flat { color: #8C8A82; }
  #gymlog .history { margin-top: 12px; padding-top: 12px; border-top: 1px solid #2A2E34; display: none; }
  #gymlog .history.open { display: block; }
  #gymlog .hist-row { display: flex; justify-content: space-between; font-size: 13px; color: #B7B4A9; padding: 3px 0; }
  #gymlog .spark { display: flex; align-items: flex-end; gap: 4px; height: 28px; margin-top: 12px; }
  #gymlog .bar { flex: 1; max-width: 16px; background: rgba(232,163,61,.35); border-radius: 3px 3px 1px 1px; min-height: 3px; }
  #gymlog .bar:last-child { background: #E8A33D; }
  #gymlog .card-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; gap: 8px; }
  #gymlog .toggle { cursor: pointer; color: #B7B4A9; font-size: 13px; font-weight: 600; padding: 7px 4px 7px 12px; display: flex; align-items: center; gap: 6px; user-select: none; }
  #gymlog .chev { width: 14px; height: 14px; transition: transform .15s; }
  #gymlog .toggle.open .chev { transform: rotate(180deg); }
  #gymlog .hist-row .del { color: #D97757; cursor: pointer; font-size: 12px; margin-left: 10px; }
  #gymlog .tabs { display: flex; gap: 6px; overflow-x: auto; margin: 14px -14px 12px; padding: 0 14px 2px; scrollbar-width: none;
    --fl: 0px; --fr: 0px;
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 var(--fl), #000 calc(100% - var(--fr)), transparent 100%);
    mask-image: linear-gradient(to right, transparent 0, #000 var(--fl), #000 calc(100% - var(--fr)), transparent 100%); }
  #gymlog .tabs::-webkit-scrollbar { display: none; }
  #gymlog .tab { flex: 0 0 auto; padding: 8px 14px; border-radius: 20px; border: 1px solid #2A2E34; background: #1C1F23; color: #B7B4A9; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  #gymlog .tab.active { background: #E8A33D; color: #16181B; border-color: #E8A33D; font-weight: 600; }
  #gymlog .tab-dot { width: 6px; height: 6px; border-radius: 50%; background: #E8A33D; }
  #gymlog .tab.active .tab-dot { background: #16181B; }
  #gymlog .tab-check { color: #7FBF7F; font-weight: 700; font-size: 12px; }
  #gymlog .tab.active .tab-check { color: #16181B; }
  #gymlog .today-line { font-size: 12px; color: #8C8A82; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
  #gymlog .today-line b { color: #EDEBE3; font-weight: 600; }
  /* day tabs + progress stay on screen while scrolling */
  #gymlog .sticky-top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; margin: 10px -14px 12px; padding: 8px 14px 0; background: #131518; transition: box-shadow .2s; }
  #gymlog .sticky-top.stuck { box-shadow: 0 10px 14px -10px rgba(0,0,0,.75); }
  /* covers the sub-pixel sliver of scrolled content that can show above a stuck bar at fractional scroll offsets;
     it overlaps the bar by 1px so there's no anti-aliased seam */
  #gymlog .sticky-top::before { content: ''; position: absolute; left: 0; right: 0; top: -8px; height: 9px; background: #131518; }
  #gymlog .sticky-top .tabs { margin: 0 -14px; }
  #gymlog .sticky-top .today-line { margin: 0; padding: 9px 0; }
  #gymlog .prog-rail { height: 3px; margin: 0 -14px; background: #1F2226; }
  #gymlog .prog-rail i { display: block; height: 100%; background: #7FBF7F; border-radius: 0 2px 2px 0; transition: width .3s; }
  #gymlog .card, #gymlog .ss-group, #gymlog .session { scroll-margin-top: calc(var(--stick, 0px) + env(safe-area-inset-top, 0px) + 10px); }
  #gymlog .set-head, #gymlog .set-row { display: grid; grid-template-columns: 34px 1fr 1fr; gap: 8px; align-items: center; }
  #gymlog .set-head { font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #5C5A52; margin-bottom: 6px; }
  #gymlog .set-head span:not(:first-child) { padding-left: 12px; }
  #gymlog .set-row { margin-bottom: 8px; }
  #gymlog .set-label { width: 26px; height: 26px; border-radius: 50%; background: #23262B; color: #8C8A82; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
  #gymlog .set-row input { min-width: 0; font-size: 17px; font-weight: 600; padding: 11px 12px; }
  #gymlog .easy-check { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #8C8A82; flex-shrink: 0; width: 62px; }
  #gymlog .easy-check input { width: auto; accent-color: #E8A33D; }
  #gymlog .session { padding: 8px 0; border-bottom: 1px solid #2C3036; }
  #gymlog .session:last-child { border-bottom: none; }
  #gymlog .session-head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #B7B4A9; margin-bottom: 6px; }
  #gymlog .session-sets { display: flex; gap: 6px; flex-wrap: wrap; }
  #gymlog .set-chip { background: #21242A; border-radius: 6px; padding: 3px 9px; font-size: 12px; color: #EDEBE3; border: 1px solid transparent; }
  #gymlog .set-chip.easy { color: #7FBF7F; border-color: #7FBF7F; }
  #gymlog .easy-note { font-size: 11px; color: #7FBF7F; margin-top: 2px; text-align: right; }
  #gymlog .toolbar { display: flex; gap: 6px; margin-top: 12px; }
  #gymlog .toolbar button { flex: 1; }
  #gymlog .pr-badge { display: inline-block; background: #E8A33D; color: #16181B; border-radius: 5px; padding: 1px 6px; font-size: 10px; font-weight: 700; letter-spacing: .04em; vertical-align: middle; }
  #gymlog .stats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  #gymlog .stat { background: #1C1F23; border: 1px solid #2A2E34; border-radius: 12px; padding: 8px 12px; font-size: 11px; color: #8C8A82; flex: 1; min-width: 92px; }
  #gymlog .stat b { display: block; color: #EDEBE3; font-size: 22px; font-weight: 700; margin-top: 2px; line-height: 1.1; }
  #gymlog .ed-ex { background: #1D2024; border: 1px solid #2C3036; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  #gymlog .ed-grid { display: flex; gap: 6px; margin-top: 8px; }
  #gymlog .ed-grid label { flex: 1; font-size: 10px; color: #8C8A82; }
  #gymlog .ed-grid input { margin-top: 3px; padding: 7px 8px; font-size: 14px; text-align: center; }
  #gymlog .ed-actions { display: flex; gap: 6px; margin-top: 8px; justify-content: flex-end; }
  #gymlog .hint { color: #5C5A52; font-size: 11px; line-height: 1.5; }
  #gymlog textarea { font-family: ui-monospace, monospace; font-size: 11px; height: 120px; resize: vertical; }
  #gymlog .timer-btn { padding: 7px 12px; font-size: 13px; border-radius: 20px; display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
  #gymlog .timer-btn.running { color: #16181B; background: #E8A33D; border-color: #E8A33D; }
  #gymlog .timer-btn.done { color: #7FBF7F; border-color: #7FBF7F; }
  #gymlog .card-foot .timer-btn { white-space: nowrap; padding: 7px 10px; }
  #gymlog .card-foot .toggle { white-space: nowrap; padding-left: 6px; }
  #gymlog .ex-pick { cursor: pointer; text-decoration: underline dotted #6E6C66; text-underline-offset: 4px; }
  #gymlog .pick-chev { width: 15px; height: 15px; margin-left: 4px; vertical-align: -2px; color: #E8A33D; }
  #gymlog .pick-opt.sel { border-color: #E8A33D; }
  #gymlog .pick-opt[disabled] { opacity: .4; }
  #gymlog .pick-opt b { display: flex; align-items: center; gap: 8px; }
  #gymlog .pick-opt b em { font-style: normal; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #E8A33D; border: 1px solid #E8A33D; border-radius: 5px; padding: 1px 5px; margin-left: 4px; }
  #gymlog .pick-opt b svg { width: 16px; height: 16px; color: #E8A33D; margin-left: auto; flex-shrink: 0; }
  #gymlog .alt-line { font-size: 11px; color: #E8A33D; margin-top: 3px; }
  #gymlog .session-head .mv { color: #E8A33D; cursor: pointer; margin-right: 14px; }
  #gymlog .ed-alt { border-top: 1px dashed #343840; margin-top: 10px; padding-top: 8px; }
  #gymlog .ed-alt-h { font-size: 10px; color: #E8A33D; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
  #gymlog .ed-alt-h button { letter-spacing: 0; text-transform: none; font-weight: 600; padding: 4px 10px; }
  #gymlog .ico { width: 14px; height: 14px; flex-shrink: 0; }
  #gymlog .done-chip { color: #7FBF7F; font-weight: 600; }
  #gymlog .card.logged { border-color: #2F3B31; }

  #gymlog .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  #gymlog .cycle-chip { text-align: right; min-width: 92px; }
  #gymlog .cycle-chip .num { font-size: 19px; font-weight: 700; color: #E8A33D; line-height: 1; }
  #gymlog .cycle-chip .num small { font-size: 13px; color: #8C8A82; font-weight: 600; }
  #gymlog .cycle-chip .lbl { font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: #8C8A82; margin-top: 1px; }
  #gymlog .cycle-chip.over .num { color: #D97757; }
  #gymlog .cycle-track { display: flex; gap: 3px; margin-top: 5px; justify-content: flex-end; }
  #gymlog .cycle-track i { width: 10px; height: 4px; border-radius: 2px; background: #2A2E34; }
  #gymlog .cycle-track i.on { background: #E8A33D; }
  #gymlog .cycle-chip.over .cycle-track i.on { background: #D97757; }

  #gymlog .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(19,21,24,.94); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid #23262B; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
  #gymlog .bottom-nav-inner { max-width: 520px; margin: 0 auto; display: flex; }
  #gymlog .nav-btn { flex: 1; background: none; border: none; color: #6E6C66; padding: 6px 0 4px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; border-radius: 10px; }
  #gymlog .nav-btn svg { width: 22px; height: 22px; }
  #gymlog .nav-btn.active { color: #E8A33D; }

  #gymlog .timer-bar { position: fixed; left: 0; right: 0; bottom: calc(62px + env(safe-area-inset-bottom)); z-index: 19; padding: 0 12px 8px; }
  #gymlog .timer-bar-inner { max-width: 496px; margin: 0 auto; background: #E8A33D; color: #16181B; border-radius: 14px; padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
  #gymlog .timer-bar.done .timer-bar-inner { background: #7FBF7F; }
  #gymlog .timer-clock { font-size: 30px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; min-width: 64px; }
  #gymlog .timer-name { flex: 1; min-width: 0; font-size: 12px; line-height: 1.3; }
  #gymlog .timer-name b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #gymlog .timer-name small { display: block; font-weight: 500; opacity: .7; }
  #gymlog .timer-bar button { background: rgba(22,24,27,.14); color: #16181B; padding: 8px 12px; font-size: 13px; border-radius: 10px; }
  #gymlog .timer-progress { position: absolute; left: 0; bottom: 0; height: 3px; background: rgba(22,24,27,.35); border-radius: 0 2px 2px 0; }
  #gymlog .timer-bar-inner { position: relative; overflow: hidden; }
  #gymlog .draft-note { font-size: 11px; color: #E8A33D; margin-top: 6px; text-align: center; }
  #gymlog [hidden] { display: none !important; }
  #gymlog .cycle-line { display: none; }
  #gymlog .card.priority { box-shadow: inset 3px 0 0 #E8A33D; }
  #gymlog .prio-tag { display: inline-block; border: 1px solid #E8A33D; color: #E8A33D; border-radius: 5px; padding: 0 5px; font-size: 9px; font-weight: 700; letter-spacing: .05em; vertical-align: middle; margin-left: 4px; }
  #gymlog .ed-grid select { margin-top: 3px; padding: 7px 8px; font-size: 13px; }
  #gymlog .prio-check { display: flex; align-items: flex-end; gap: 6px; padding-bottom: 8px; }
  #gymlog .prio-check input { width: auto; accent-color: #E8A33D; margin: 0; }
  #gymlog .vol-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #B7B4A9; padding: 4px 0; }
  #gymlog .vol-name { width: 88px; flex-shrink: 0; }
  #gymlog .vol-track { flex: 1; height: 8px; background: #21242A; border-radius: 4px; overflow: hidden; }
  #gymlog .vol-fill { height: 100%; background: #E8A33D; }
  #gymlog .vol-fill.full { background: #7FBF7F; }
  #gymlog .vol-num { width: 44px; text-align: right; flex-shrink: 0; color: #EDEBE3; }

  /* ----- per-set check-off ----- */
  #gymlog .set-head, #gymlog .set-row { grid-template-columns: 30px 1fr 1fr 46px; }
  #gymlog .set-check { width: 46px; height: 44px; padding: 0; border-radius: 12px; background: #23262B; border: 1px solid #2A2E34; color: #4A4D53; display: flex; align-items: center; justify-content: center; transition: background .15s, border-color .15s, color .15s; }
  #gymlog .set-check svg { width: 22px; height: 22px; }
  #gymlog .set-check.next { border-color: #E8A33D; color: #E8A33D; background: rgba(232,163,61,.08); }
  #gymlog .set-row.done .set-check { background: #7FBF7F; border-color: #7FBF7F; color: #16181B; }
  #gymlog .set-row.done .set-check:disabled { opacity: 1; }
  #gymlog .set-row.done input { background: #1B231D; border-color: #2F3B31; color: #CFE8CF; }
  #gymlog .set-row.done .set-label { background: #7FBF7F; color: #16181B; }
  #gymlog .set-row.next .set-label { background: #E8A33D; color: #16181B; }
  #gymlog .set-row.pop .set-check { animation: gl-pop .4s ease; }
  @keyframes gl-pop { 0% { transform: scale(1); } 35% { transform: scale(1.22); } 100% { transform: scale(1); } }
  #gymlog .set-hint { font-size: 11px; color: #6E6C66; margin: -2px 0 8px; }
  /* −/+ under the set you're about to do: adjust without opening the keyboard */
  #gymlog .step-row { display: grid; grid-template-columns: 30px 1fr 1fr 46px; gap: 8px; margin: -2px 0 10px; }
  #gymlog .step-pair { display: flex; gap: 6px; min-width: 0; }
  #gymlog button.step { flex: 1; min-width: 0; height: 38px; padding: 0; border-radius: 10px; background: #23262B; border: 1px solid #2A2E34; color: #EDEBE3; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  #gymlog button.step:active { background: #2E3238; border-color: #E8A33D; }
  #gymlog .set-row input.bump { animation: gl-bump .4s ease; }
  @keyframes gl-bump { from { border-color: #E8A33D; background: rgba(232,163,61,.12); } }
  #gymlog .sets-chip { color: #E8A33D; font-weight: 600; }
  #gymlog .card.active { border-color: rgba(232,163,61,.45); }
  #gymlog .today-line.complete { color: #7FBF7F; font-weight: 600; cursor: pointer; }
  #gymlog .pp { background: #1C1F23; border: 1px solid #2A2E34; border-radius: 16px; padding: 12px 14px; margin-bottom: 12px; }
  #gymlog .pp.done { border-color: #2F3B31; }
  #gymlog .pp:not(.open) { padding: 9px 14px; border-radius: 12px; }
  #gymlog .pp-head { display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-size: 13px; }
  #gymlog .pp-head b { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #E8A33D; }
  #gymlog .pp.done .pp-head b { color: #7FBF7F; }
  #gymlog .pp-head span { color: #8C8A82; font-size: 12px; }
  #gymlog .pp-list { margin-top: 10px; }
  #gymlog .pp-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid #23262B; font-size: 14px; color: #EDEBE3; cursor: pointer; }
  #gymlog .pp-item input { width: 20px; height: 20px; accent-color: #7FBF7F; flex-shrink: 0; }
  #gymlog .pp-item.on span { color: #6E6C66; text-decoration: line-through; }
  #gymlog .pp-item small { display: block; font-size: 11px; color: #8C8A82; text-decoration: none; }
  #gymlog .wu { background: #21242A; border-radius: 12px; padding: 9px 12px; margin: 0 0 12px; font-size: 12px; color: #B7B4A9; }
  #gymlog .wu b { color: #E8A33D; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; margin-right: 6px; }
  #gymlog .wu .wu-sets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  #gymlog .wu .set-chip { font-size: 13px; }
  #gymlog .wu small { display: block; color: #6E6C66; font-size: 11px; margin-top: 6px; }
  #gymlog .sum-pp { font-size: 13px; color: #B7B4A9; margin: -4px 0 14px; }
  #gymlog .sum-pp .ok { color: #7FBF7F; font-weight: 600; }

  /* ----- PR toast + confetti ----- */
  #gymlog .toast { position: fixed; left: 12px; right: 12px; top: max(12px, env(safe-area-inset-top)); z-index: 60; max-width: 496px; margin: 0 auto; background: #E8A33D; color: #16181B; border-radius: 16px; padding: 12px 16px; display: flex; gap: 12px; align-items: center; box-shadow: 0 12px 32px rgba(0,0,0,.5); animation: gl-drop .45s cubic-bezier(.2,1.4,.4,1); }
  #gymlog .toast.out { animation: gl-up .3s ease forwards; }
  #gymlog .toast-ico svg { width: 30px; height: 30px; display: block; }
  #gymlog .toast b { display: block; font-size: 15px; }

<body>

<div id="gymlog">
  <div class="head">
    <div>
      <h1 class="app-title">Gym log</h1>
      <p id="subtitle" class="app-sub">Tap an exercise to log this week's weight</p>
      <p id="cycle-line" class="cycle-line" hidden></p>
    </div>
    <div id="cycle-chip" class="cycle-chip" hidden></div>
  </div>
  <div id="view"></div>
  <p class="hint" id="backup-note" style="margin:18px 0 0;text-align:center;">Saved on this device only — export a backup now and then.</p>

  <div class="timer-bar" id="timer-bar" hidden>
    <div class="timer-bar-inner">
      <div class="timer-clock" id="timer-clock">0:00</div>
      <div class="timer-name" id="timer-name"></div>
      <button id="timer-add">+30s</button>
      <button id="timer-stop">Skip</button>
      <div class="timer-progress" id="timer-progress"></div>
    </div>
  </div>

  <div class="tfull" id="tfull" hidden>
    <button class="tfull-close" id="tfull-close" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div class="tfull-name" id="tfull-name"></div>
    <div class="tfull-ring">
      <svg viewBox="0 0 260 260"><circle class="trk" cx="130" cy="130" r="116"/><circle class="prg" id="tfull-prg" cx="130" cy="130" r="116" stroke-dasharray="728.85" stroke-dashoffset="0"/></svg>
      <div class="tfull-center"><div class="tfull-clock" id="tfull-clock">0:00</div><div class="tfull-sub" id="tfull-sub">Rest</div></div>
    </div>
    <div class="tfull-next" id="tfull-next"></div>
    <div class="tfull-actions">
      <button id="tfull-minus">−15s</button>
      <button id="tfull-plus">+30s</button>
      <button id="tfull-stop" class="stop">Skip</button>
    </div>
  </div>

  <div class="sheet-wrap" id="sheet" hidden></div>

  <nav class="bottom-nav">
    <div class="bottom-nav-inner">
      <button class="nav-btn" id="nav-log">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>
        Workout
      </button>
      <button class="nav-btn" id="nav-strength">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M8 21h8M5 7h14M5 7l-3 7a3 3 0 0 0 6 0L5 7zM19 7l-3 7a3 3 0 0 0 6 0l-3-7z"/></svg>
        Strength
      </button>
      <button class="nav-btn" id="nav-edit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>
        Routine
      </button>
      <button class="nav-btn" id="nav-data">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        Data
      </button>
    </div>
  </nav>
</div>

<script>
(function() {
  'use strict';

  // ---------- default routine ----------
  var MUSCLES = ['Side delts', 'Front delts', 'Rear delts', 'Chest', 'Back', 'Biceps', 'Triceps',

  function defaultRoutine() {
    return [
      { id: 'day1', label: 'Day 1', exercises: [
        { name: 'Dumbbell lateral raise', muscle: 'Side delts', priority: true, sets: 3, repMin: 6, repMax: 10, restSec: 90 },
        { name: 'Incline dumbbell press', muscle: 'Chest', sets: 3, repMin: 6, repMax: 10, restSec: 180 },
        { name: 'Flat machine/chest press', muscle: 'Chest', sets: 3, repMin: 8, repMax: 12, restSec: 120 },
        { name: 'Seated dumbbell shoulder press', muscle: 'Front delts', sets: 3, repMin: 8, repMax: 12, restSec: 120 },

        { name: 'Overhead dumbbell triceps extension', muscle: 'Triceps', sets: 3, repMin: 10, repMax: 15, restSec: 90 }

      { id: 'day2', label: 'Day 2', exercises: [
        { name: 'Dumbbell shoulder press', muscle: 'Front delts', priority: true, sets: 3, repMin: 6, repMax: 10, restSec: 120 },
        { name: 'Pull-ups / lat pulldown', muscle: 'Back', sets: 3, repMin: 6, repMax: 10, restSec: 180 },
        { name: 'Chest-supported row', muscle: 'Back', sets: 3, repMin: 8, repMax: 12, restSec: 120 },
        { name: 'Reverse pec deck', muscle: 'Rear delts', sets: 4, repMin: 12, repMax: 20, restSec: 90 },
        { name: 'Incline dumbbell curl', muscle: 'Biceps', sets: 3, repMin: 8, repMax: 12, restSec: 90 },
        { name: 'Dumbbell hammer curl', muscle: 'Biceps', sets: 2, repMin: 10, repMax: 15, restSec: 90 }
      ]},
      { id: 'day3', label: 'Day 3', exercises: [
        { name: 'Dumbbell lateral raise', muscle: 'Side delts', priority: true, sets: 3, repMin: 6, repMax: 10, restSec: 90 },
        { name: 'Squat / hack squat', muscle: 'Quads', sets: 3, repMin: 6, repMax: 10, restSec: 180 },
        { name: 'Romanian deadlift', muscle: 'Hamstrings', sets: 3, repMin: 8, repMax: 12, restSec: 180 },
        { name: 'Leg press', muscle: 'Quads', sets: 3, repMin: 10, repMax: 15, restSec: 120 },
        { name: 'Leg curl', muscle: 'Hamstrings', sets: 3, repMin: 10, repMax: 15, restSec: 90 },
        { name: 'Standing calf raise', muscle: 'Calves', sets: 4, repMin: 8, repMax: 15, restSec: 90 }
      ]},
      { id: 'day4', label: 'Day 4', exercises: [
        { name: 'Dumbbell shoulder press', muscle: 'Front delts', priority: true, sets: 3, repMin: 6, repMax: 10, restSec: 120 },
        { name: 'Seated dumbbell lateral raise', muscle: 'Side delts', sets: 4, repMin: 12, repMax: 20, restSec: 90 },
        { name: 'Reverse pec deck', muscle: 'Rear delts', sets: 3, repMin: 12, repMax: 20, restSec: 90 },
        { name: 'EZ-bar curl', muscle: 'Biceps', sets: 3, repMin: 8, repMax: 12, restSec: 90 },
        { name: 'Dumbbell skull crusher', muscle: 'Triceps', sets: 3, repMin: 10, repMax: 15, restSec: 90 },
        { name: 'Overhead dumbbell triceps extension', muscle: 'Triceps', sets: 2, repMin: 10, repMax: 15, restSec: 90 }
      ]},
      { id: 'day5', label: 'Day 5', exercises: [
        { name: 'Dumbbell lateral raise', muscle: 'Side delts', priority: true, sets: 3, repMin: 6, repMax: 10, restSec: 90 },
        { name: 'Incline Smith/machine press', muscle: 'Chest', sets: 3, repMin: 6, repMax: 10, restSec: 180 },
        { name: 'Lat pulldown', muscle: 'Back', sets: 3, repMin: 8, repMax: 12, restSec: 120 },
        // Moved here from Day 2: keeps the Day 2 id so its history stays attached.
        { id: 'day2_cable_row', name: 'Cable row', muscle: 'Back', sets: 3, repMin: 8, repMax: 12, restSec: 120 },
        { name: 'Seated dumbbell lateral raise', muscle: 'Side delts', sets: 4, repMin: 12, repMax: 20, restSec: 90 },
        { name: 'Reverse pec deck', muscle: 'Rear delts', sets: 2, repMin: 12, repMax: 20, restSec: 90 }
      ]}
    ].map(function(d) {
      d.exercises = d.exercises.map(function(ex) {
        // Legacy id = same slug the v3 store used, so existing history stays attached.
        if (!ex.id) ex.id = d.id + '_' + ex.name.toLowerCase().replace(/[^a-z0-9]+/g, '_');
        return ex;
      });
      return d;
    });
  }

  // Same plan without the specialization work: the priority shoulder exercise that opens
  // each day is dropped, everything else is unchanged. Exercise ids are kept, so history carries over.
  function standardRoutine() {
    return defaultRoutine().map(function(d) {
      d.exercises = d.exercises.filter(function(e) { return !e.priority; });
      return d;
    });
  }
  // Fits a 1-hour lunch break with ~10 min of travel each way (~25 min of training): two supersets
  // a day, pairing muscles that don't help each other — heavy push with pull, quads with hamstrings,

  // Exercises moved to another day keep their old id, so their history stays attached.
  function lunchRoutine() {
    return [
      { id: 'day1', label: 'Day 1', exercises: [
        { name: 'Incline dumbbell press', muscle: 'Chest', ss: 'A', sets: 3, repMin: 6, repMax: 10, restSec: 120 },
        { id: 'day2_chest_supported_row', name: 'Chest-supported row', muscle: 'Back', ss: 'A', sets: 3, repMin: 8, repMax: 12, restSec: 120 },
        { name: 'Seated dumbbell lateral raise', muscle: 'Side delts', ss: 'B', sets: 3, repMin: 12, repMax: 20, restSec: 75 },
        { id: 'day2_dumbbell_hammer_curl', name: 'Dumbbell hammer curl', muscle: 'Biceps', ss: 'B', sets: 3, repMin: 10, repMax: 15, restSec: 75 }
      ]},
      { id: 'day2', label: 'Day 2', exercises: [
        { name: 'Pull-ups / lat pulldown', muscle: 'Back', ss: 'A', sets: 3, repMin: 6, repMax: 10, restSec: 120 },
        { id: 'day1_seated_dumbbell_shoulder_press', name: 'Seated dumbbell shoulder press', muscle: 'Front delts', ss: 'A', sets: 3, repMin: 8, repMax: 12, restSec: 120 },
        { name: 'Reverse pec deck', muscle: 'Rear delts', ss: 'B', sets: 3, repMin: 12, repMax: 20, restSec: 75 },
        { id: 'day1_overhead_dumbbell_triceps_extension', name: 'Overhead dumbbell triceps extension', muscle: 'Triceps', ss: 'B', sets: 3, repMin: 10, repMax: 15, restSec: 75 }
      ]},
      { id: 'day3', label: 'Day 3', exercises: [
        { name: 'Squat / hack squat', muscle: 'Quads', sets: 3, repMin: 6, repMax: 10, restSec: 150 },
        { name: 'Romanian deadlift', muscle: 'Hamstrings', ss: 'A', sets: 3, repMin: 8, repMax: 12, restSec: 120 },
        { name: 'Standing calf raise', muscle: 'Calves', ss: 'A', sets: 3, repMin: 8, repMax: 15, restSec: 120 }
      ]},
      { id: 'day4', label: 'Day 4', exercises: [
        { id: 'day3_leg_press', name: 'Leg press', muscle: 'Quads', ss: 'A', sets: 3, repMin: 10, repMax: 15, restSec: 90 },
        { id: 'day3_leg_curl', name: 'Leg curl', muscle: 'Hamstrings', ss: 'A', sets: 3, repMin: 10, repMax: 15, restSec: 90 },
        { name: 'EZ-bar curl', muscle: 'Biceps', ss: 'B', sets: 3, repMin: 8, repMax: 12, restSec: 75 },
        { name: 'Dumbbell skull crusher', muscle: 'Triceps', ss: 'B', sets: 3, repMin: 10, repMax: 15, restSec: 75 }
      ]},
      { id: 'day5', label: 'Day 5', exercises: [
        { name: 'Incline Smith/machine press', muscle: 'Chest', ss: 'A', sets: 3, repMin: 6, repMax: 10, restSec: 120 },
        { name: 'Lat pulldown', muscle: 'Back', ss: 'A', sets: 3, repMin: 8, repMax: 12, restSec: 120 },
        { name: 'Seated dumbbell lateral raise', muscle: 'Side delts', ss: 'B', sets: 4, repMin: 12, repMax: 20, restSec: 60 },
        { name: 'Reverse pec deck', muscle: 'Rear delts', ss: 'B', sets: 4, repMin: 12, repMax: 20, restSec: 60 }
      ]}
    ].map(function(d) {
      d.exercises.forEach(function(ex) {
        if (!ex.id) ex.id = d.id + '_' + ex.name.toLowerCase().replace(/[^a-z0-9]+/g, '_');
        ex.priority = false;
      });
      return d;
    });
  }

  // Aesthetic plan: upper/lower twice a week plus a delts & arms day. Every muscle is trained twice
  // a week, with extra work where it shows most (upper chest, side delts, lats, arms) and exercises

  // Ids point at the exercises' existing history wherever there is one.
  // Free weights and cables first; each exercise lists equivalent alternatives (machines included) to pick
  // from when the station is taken. Ids are pinned so existing history stays where it belongs.
  function aestheticRoutine() {
    var X = function(id, name, muscle, sets, repMin, repMax, restSec, ss) {
      var e = { name: name, muscle: muscle, sets: sets, repMin: repMin, repMax: repMax, restSec: restSec, priority: false };
      if (id) e.id = id;
      if (ss) e.ss = ss;
      var alts = Array.prototype.slice.call(arguments, 8);
      if (alts.length) e.alts = alts;
      return e;
    };
    var A = function(id, name, sets, repMin, repMax, restSec) {
      return { id: id, name: name, sets: sets, repMin: repMin, repMax: repMax, restSec: restSec };
    };

      { id: 'ua', label: 'Upper A', exercises: [
        X('day1_incline_dumbbell_press', 'Incline dumbbell press', 'Chest', 4, 6, 10, 150, null,

        X('day5_lat_pulldown', 'Lat pulldown', 'Back', 3, 8, 12, 120, null,
          A('ua_pull_ups', 'Pull-ups / assisted pull-ups', 3, 6, 10, 120),
          A('ua_single_arm_cable_pulldown', 'Single-arm cable pulldown', 3, 10, 12, 90)),
        X('ua_flat_dumbbell_press', 'Flat dumbbell press', 'Chest', 3, 8, 12, 120, null,
          A('day1_flat_machine_chest_press', 'Machine chest press', 3, 8, 12, 120),
          A('ua_barbell_bench_press', 'Barbell bench press', 3, 6, 10, 150)),
        X('ua_chest_supported_dumbbell_row', 'Chest-supported dumbbell row', 'Back', 3, 8, 12, 120, null,
          A('day2_chest_supported_row', 'Chest-supported row (machine)', 3, 8, 12, 120),
          A('ua_one_arm_dumbbell_row', 'One-arm dumbbell row', 3, 8, 12, 90)),
        X('day1_dumbbell_lateral_raise', 'Dumbbell lateral raise', 'Side delts', 4, 10, 15, 75, null,
          A('day1_cable_lateral_raise', 'Cable lateral raise', 4, 12, 15, 75),
          A('ua_machine_lateral_raise', 'Machine lateral raise', 4, 12, 15, 75)),
        X('day1_overhead_dumbbell_triceps_extension', 'Overhead dumbbell triceps extension', 'Triceps', 3, 10, 15, 75, null,
          A('day1_overhead_cable_triceps_extension', 'Overhead cable triceps extension', 3, 10, 15, 75),
          A('day1_triceps_pushdown', 'Cable pushdown', 3, 10, 15, 75))
      ]},
      { id: 'la', label: 'Lower A', exercises: [
        X('day3_squat_hack_squat', 'Barbell squat', 'Quads', 3, 6, 10, 180, null,
          A('la_hack_squat', 'Hack squat', 3, 8, 12, 150),
          A('la_leg_press', 'Leg press', 3, 10, 15, 120)),
        X('day3_leg_curl', 'Leg curl', 'Hamstrings', 3, 10, 15, 90, null,
          A('la_lying_leg_curl', 'Lying leg curl', 3, 10, 15, 90),
          A('la_dumbbell_rdl', 'Dumbbell Romanian deadlift', 3, 10, 12, 90)),
        X('day3_leg_extension', 'Leg extension', 'Quads', 3, 10, 15, 90, null,
          A('la_goblet_squat', 'Goblet squat', 3, 10, 15, 90)),
        X('day3_standing_calf_raise', 'Standing calf raise', 'Calves', 4, 8, 12, 75, null,
          A('la_single_leg_calf_raise', 'Single-leg dumbbell calf raise', 4, 8, 12, 60),
          A('la_leg_press_calf_raise', 'Leg press calf raise', 4, 10, 15, 60)),
        X('day3_hanging_leg_raise', 'Hanging knee raise', 'Abs', 3, 10, 15, 60, null,
          A('la_reverse_crunch', 'Reverse crunch on bench', 3, 10, 15, 60),
          A('la_cable_crunch', 'Cable crunch', 3, 10, 15, 60))
      ]},
      { id: 'ub', label: 'Upper B', exercises: [
        X('day5_incline_smith_machine_press', 'Incline barbell press', 'Chest', 3, 6, 10, 150, null,
          A('ub_incline_smith_press', 'Incline Smith press', 3, 6, 10, 150),
          A('ub_incline_dumbbell_press', 'Incline dumbbell press', 3, 6, 10, 150)),
        X('day2_pull_ups_lat_pulldown', 'Pull-ups / lat pulldown', 'Back', 3, 6, 10, 150, null,

  // Exercise menu: the planned exercise and its alternatives, each with its own sets, reps and last session.

  function openExPicker(mainId, move) {

    }).join('');

    var hint = move ? 'Logged on the wrong exercise? Pick the one you actually did.'
      : locked ? 'Sets already logged on ' + cur.name + ' today. Delete them to switch.'
      : 'Station taken? Pick an equivalent. Each one keeps its own history.';
    var wrap = document.getElementById('sheet');
    wrap.innerHTML =
      '<div class="sheet-bg" data-close></div>' +
      '<div class="sheet">' +
        '<div class="sheet-grab"></div>' +

          if (!s || loggedOn(id, move.date)) return;

  function closeSheet() {

  // ---------- per-exercise chart ----------
  function chartHtml(key, hist) {
    // A session still in progress today would drag the line down mid-workout.
    var f = findEx(key);
    if (f && !exDone(f.ex)) hist = hist.filter(function(h) { return h.date !== todayStr(); });
    if (hist.length < 2) return '';
    var allBW = hist.every(function(h) { return h.sets.every(function(s) { return s.weight === 0; }); });
    var pts = hist.map(function(h) {
      return { date: h.date, e: bestOf([h]).e1rm || 0, w: avg(h.sets.map(function(s) { return s.weight; })), r: totalReps(h) };
    });
    var mode = allBW ? 'r' : pts.filter(function(p) { return p.e; }).length >= 2 ? 'e' : 'w';
    var label = mode === 'e' ? 'Est. 1RM' : mode === 'r' ? 'Total reps' : 'Avg weight';
    var unit = mode === 'r' ? ' reps' : ' kg';
    var data = pts.filter(function(p) { return mode !== 'e' || p.e; }).map(function(p) {
      return { date: p.date, v: round1(mode === 'e' ? p.e : mode === 'r' ? p.r : p.w) };
    }).slice(-16);
    if (data.length < 2) return '';

    var W = 320, H = 118, pl = 4, pr = 4, pt = 12, pb = 18;
    var vals = data.map(function(d) { return d.v; });
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    if (max === min) { max += 1; min -= 1; }
    var pad = (max - min) * 0.15;
    min -= pad; max += pad;
    var x = function(j) { return pl + j * (W - pl - pr) / (data.length - 1); };
    var y = function(v) { return pt + (1 - (v - min) / (max - min)) * (H - pt - pb); };
    var line = data.map(function(d, j) { return (j ? 'L' : 'M') + x(j).toFixed(1) + ' ' + y(d.v).toFixed(1); }).join(' ');
    var base = (H - pb).toFixed(1);
    var area = line + ' L' + x(data.length - 1).toFixed(1) + ' ' + base + ' L' + x(0).toFixed(1) + ' ' + base + ' Z';
    var gid = 'g-' + key.replace(/[^a-z0-9_]/gi, '');
    var grid = [pt, (pt + H - pb) / 2, H - pb].map(function(gy) {
      return '<line x1="0" x2="' + W + '" y1="' + gy + '" y2="' + gy + '" stroke="#2A2E34" stroke-dasharray="3 4"/>';
    }).join('');
    var dots = data.map(function(d, j) {
      var lastPt = j === data.length - 1;
      return '<g class="pt' + (lastPt ? ' sel' : '') + '" data-pt="' + key + '" data-date="' + d.date + '" data-v="' + d.v + '" data-unit="' + unit + '">' +
        '<circle cx="' + x(j).toFixed(1) + '" cy="' + y(d.v).toFixed(1) + '" r="13" fill="transparent"/>' +
        '<circle class="dot" cx="' + x(j).toFixed(1) + '" cy="' + y(d.v).toFixed(1) + '" r="' + (lastPt ? 5 : 3.5) + '" fill="' + (lastPt ? '#E8A33D' : '#1C1F23') + '" stroke="#E8A33D" stroke-width="2"/>' +
      '</g>';
    }).join('');
    var lastV = data[data.length - 1].v, change = round1(lastV - data[0].v);
    return '<div class="chart">' +
      '<div class="chart-head"><span>' + label + ' · <span id="chart-lbl-' + key + '">' + fmtDate(data[data.length - 1].date) + '</span></span>' +
        '<span><b id="chart-val-' + key + '">' + lastV + '</b>' + unit + ' <span class="' + (change >= 0 ? 'sets-chip' : '') + '" style="' + (change < 0 ? 'color:#D97757;font-weight:600;' : '') + '">' + (change >= 0 ? '+' : '') + change + ' since ' + fmtDate(data[0].date) + '</span></span></div>' +
      '<svg viewBox="0 0 ' + W + ' ' + H + '">' +
        '<defs><linearGradient id="' + gid + '" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#E8A33D" stop-opacity=".35"/><stop offset="1" stop-color="#E8A33D" stop-opacity="0"/></linearGradient></defs>' +
        grid +
        '<path d="' + area + '" fill="url(#' + gid + ')"/>' +
        '<path d="' + line + '" fill="none" stroke="#E8A33D" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' +
        dots +
        '<text x="0" y="' + (H - 3) + '" font-size="9" fill="#6E6C66">' + fmtDate(data[0].date) + '</text>' +
        '<text x="' + W + '" y="' + (H - 3) + '" font-size="9" fill="#6E6C66" text-anchor="end">' + fmtDate(data[data.length - 1].date) + '</text>' +
      '</svg></div>';
  }

  // ---------- consistency calendar ----------
  function isoLocal(d) { return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
  function addDays(iso, n) { var d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return isoLocal(d); }

  function consistencyHtml() {
    var perDay = {};
    for (var k in entries) (entries[k] || []).forEach(function(s) { perDay[s.date] = (perDay[s.date] || 0) + s.sets.length; });
    var dates = Object.keys(perDay).sort();
    if (!dates.length) return '';
    var today = todayStr();
    var thisMon = mondayOf(today);
    var COLS = 17;
    var start = addDays(thisMon, -(COLS - 1) * 7);
    var target = routine.length;
    var gymDays = function(mon) {
      var n = 0;
      for (var i = 0; i < 7; i++) if (perDay[addDays(mon, i)]) n++;
      return n;
    };

    var cells = '', months = '';
    var firstOfMonthCol = function(col) {
      for (var q = 0; q < 7; q++) { var qd = addDays(addDays(start, col * 7), q); if (qd.slice(8) === '01' && qd <= today) return qd; }
      return null;
    };
    for (var c = 0; c < COLS; c++) {
      var mon = addDays(start, c * 7);
      // label each column holding the 1st of a month; label the first column too unless a 1st is right next to it
      var fom = firstOfMonthCol(c);
      var lblDate = fom || (c === 0 && !firstOfMonthCol(1) && !firstOfMonthCol(2) ? mon : null);
      if (lblDate) {
        months += '<span style="grid-column:' + (c + 1) + '">' + new Date(lblDate + 'T00:00:00').toLocaleDateString('en-GB', { month: 'short' }) + '</span>';
      }
      for (var r = 0; r < 7; r++) {
        var d = addDays(mon, r);
        var n = perDay[d] || 0;
        var cls = d > today ? 'fut' : n >= 17 ? 'l3' : n >= 9 ? 'l2' : n > 0 ? 'l1' : '';
        if (d === today) cls += ' today';
        cells += '<i class="' + cls + '"' + (n && d <= today ? ' data-day="' + d + '"' : '') + ' title="' + fmtDate(d) + (n ? ': ' + n + ' sets' : '') + '"></i>';
      }
    }

    // streak = consecutive full weeks (every routine day trained). The current week
    // only counts once it's full; until then it doesn't break the streak.
    var thisWeek = gymDays(thisMon);
    var w = thisWeek >= target ? thisMon : addDays(thisMon, -7), streak = 0;
    while (gymDays(w) >= target) { streak++; w = addDays(w, -7); }
    var best = 0, run = 0;
    for (var wk = mondayOf(dates[0]); wk <= thisMon; wk = addDays(wk, 7)) {
      if (gymDays(wk) >= target) { run++; best = Math.max(best, run); } else if (wk !== thisMon) run = 0;
    }

    return '<div class="card">' +
      '<div class="ex-name">Consistency</div>' +
      '<p class="hint" style="margin:2px 0 10px;">Gym days over the last ' + COLS + ' weeks. A full week = all ' + target + ' routine days. Tap a day to see its workout.</p>' +
      '<div class="stats">' +
        '<div class="stat">This week<b>' + thisWeek + ' / ' + target + '</b></div>' +
        '<div class="stat">Full weeks in a row<b>' + streak + '</b></div>' +
        '<div class="stat">Best run<b>' + best + '</b></div>' +
      '</div>' +
      '<div class="cal-months">' + months + '</div>' +
      '<div class="cal">' + cells + '</div>' +
      '<div class="cal-legend">Less <i></i><i class="l1"></i><i class="l2"></i><i class="l3"></i> More</div>' +
    '</div>';
  }

  // ---------- strength model ----------
  // Same-name exercises on different days are one movement for strength purposes.
  function allExercises() {
    var out = [];
    store.list.forEach(function(p) { p.days.forEach(function(d) { d.exercises.forEach(function(e) {
      out.push(e);
      (e.alts || []).forEach(function(a) { out.push(altOf(e, a)); });
    }); }); });
    return out;
  }
  function movementKey(name) { return String(name).trim().toLowerCase(); }
  function movements() {
    var map = {};
    var activeIds = {};
    routine.forEach(function(d) { d.exercises.forEach(function(e) {
      activeIds[e.id] = true;
      (e.alts || []).forEach(function(a) { activeIds[a.id] = true; });
    }); });
    allExercises().forEach(function(e) {
      var k = movementKey(e.name);
      var m = map[k] || (map[k] = { key: k, name: e.name, muscle: e.muscle, ids: [], active: false });
      if (m.ids.indexOf(e.id) < 0) m.ids.push(e.id);
      if (activeIds[e.id]) { m.active = true; m.muscle = e.muscle; }
    });
    Object.keys(map).forEach(function(k) {
      var m = map[k], byDate = {};
      m.ids.forEach(function(id) {
        (entries[id] || []).forEach(function(s) {
          var x = byDate[s.date] || (byDate[s.date] = { date: s.date, sets: [] });
          x.sets = x.sets.concat(s.sets);
        });
      });
      m.sessions = Object.keys(byDate).sort().map(function(d) {
        var x = byDate[d];
        x.e = bestOf([x]).e1rm;
        x.top = x.sets.reduce(function(b, s) { return (e1rm(s) || 0) > (b ? e1rm(b) || 0 : -1) ? s : b; }, null);
        return x;
      });
      m.withE = m.sessions.filter(function(s) { return s.e > 0; });
    });
    return map;
  }
  // Current strength = best est. 1RM of the last 3 sessions (optionally only before a date).
  function currentE(m, before) {
    var s = m.withE.filter(function(x) { return !before || x.date < before; }).slice(-3);
    return s.length ? Math.max.apply(null, s.map(function(x) { return x.e; })) : 0;
  }
  // Per set position, so later sets carry the fatigue of the earlier ones.
  function setStrength(m, n) {
    if (!m) return null;
    var past = m.withE.filter(function(s) { return s.date < todayStr(); }).slice(-3);
    if (!past.length) return null;
    var fallback = Math.max.apply(null, past.map(function(s) { return s.e; }));
    var out = [];
    for (var i = 0; i < n; i++) {
      var best = 0;
      past.forEach(function(s) { var e = s.sets[i] ? e1rm(s.sets[i]) : 0; if (e > best) best = e; });
      out.push(best || fallback);
    }
    return out;
  }
  // Inverse Epley: reps you should manage at weight w given an est. 1RM.
  function predReps(E, w) {
    if (!E || !(w > 0)) return null;
    return 30 * (E / w - 1);
  }
  function fmtTarget(r) {
    if (r == null || r > 30) return '';
    return r < 1 ? '<1' : '≈' + Math.round(r);
  }

  // ---------- strength balance ----------
  var PAIRS = [
    { a: ['Chest', 'Front delts'], b: ['Back'], la: 'Push', lb: 'Pull' },
    { a: ['Front delts'], b: ['Rear delts'], la: 'Front delts', lb: 'Rear delts' },
    { a: ['Quads'], b: ['Hamstrings'], la: 'Quads', lb: 'Hamstrings' },
    { a: ['Biceps'], b: ['Triceps'], la: 'Biceps', lb: 'Triceps' }
  ];
  function balanceHtml(mv) {
    var plan = activePlan();
    var since = plan.cycle && plan.cycle.start && plan.cycle.start <= todayStr() ? plan.cycle.start : null;
    var rows = [];
    var build = function(from) {
      rows = [];
      Object.keys(mv).forEach(function(k) {
        var m = mv[k];
        if (!m.active) return;
        var s = m.withE.filter(function(x) { return !from || x.date >= from; });
        if (s.length < 3) return;
        var base = s[0].e;
        var cur = Math.max(s[s.length - 1].e, s[s.length - 2].e);
        rows.push({ name: m.name, muscle: m.muscle, base: base, cur: cur, pct: (cur / base - 1) * 100 });
      });
    };
    build(since);
    if (rows.length < 3 && since) { since = null; build(null); }
    if (!rows.length) {
      return '<div class="card" style="margin-top:14px;"><div class="ex-name">Strength balance</div>' +
        '<p class="hint" style="margin:4px 0 0;">Needs at least 3 sessions with reps on an exercise. Keep logging reps and it fills in.</p></div>';
    }
    var firstDate = null;
    Object.keys(mv).forEach(function(k) { var w = mv[k].withE; if (w.length && (!firstDate || w[0].date < firstDate)) firstDate = w[0].date; });

    var byMuscle = {};
    rows.forEach(function(r) { (byMuscle[r.muscle] = byMuscle[r.muscle] || []).push(r.pct); });
    var mPct = {};
    Object.keys(byMuscle).forEach(function(m) { mPct[m] = avg(byMuscle[m]); });
    var focus = {};
    routine.forEach(function(d) { d.exercises.forEach(function(e) { if (e.priority) focus[e.muscle] = true; }); });
    // side delts are what a shoulder block is about even if the flag sits on the press
    if (focus['Front delts'] || focus['Side delts']) { focus['Side delts'] = true; }

    var scale = Math.max(8, 1.15 * Math.max.apply(null, Object.keys(mPct).map(function(m) { return Math.abs(mPct[m]); })));
    var musclesHtml = MUSCLES.filter(function(m) { return mPct[m] !== undefined; }).map(function(m) {
      var p = mPct[m];
      var w = Math.min(50, Math.abs(p) / scale * 50);
      var style = p >= 0 ? 'left:50%;width:' + w + '%' : 'right:50%;width:' + w + '%';
      return '<div class="bal-row"><div>' + m + (focus[m] ? '<span class="focus-tag">FOCUS</span>' : '') + '</div>' +
        '<div class="bal-track"><div class="bal-fill' + (p < 0 ? ' neg' : focus[m] ? ' focus' : '') + '" style="' + style + '"></div></div>' +
        '<div class="bal-num">' + (p >= 0 ? '+' : '') + Math.round(p) + '%</div></div>';
    }).join('');

    var groupPct = function(list) {
      var v = [];
      rows.forEach(function(r) { if (list.indexOf(r.muscle) >= 0) v.push(r.pct); });
      return v.length ? avg(v) : null;
    };
    var pairsHtml = PAIRS.map(function(p) {
      var a = groupPct(p.a), b = groupPct(p.b);
      if (a == null || b == null) return '';
      var diff = a - b;
      var off = Math.abs(diff) >= 3;
      var left = 50 - Math.max(-15, Math.min(15, diff)) / 15 * 46;
      var verdict = !off ? 'In balance' : (diff > 0 ? p.la : p.lb) + ' ahead by ' + Math.round(Math.abs(diff)) + ' pts';
      return '<div class="pair">' +
        '<div class="pair-head"><span>' + p.la + ' <b>' + (a >= 0 ? '+' : '') + Math.round(a) + '%</b></span><span><b>' + (b >= 0 ? '+' : '') + Math.round(b) + '%</b> ' + p.lb + '</span></div>' +
        '<div class="pair-beam"><div class="pair-dot' + (off ? ' off' : '') + '" style="left:' + left.toFixed(1) + '%"></div></div>' +
        '<div class="pair-verdict' + (off ? ' off' : '') + '">' + verdict + '</div></div>';
    }).join('');

    var mvHtml = rows.slice().sort(function(x, y) { return y.pct - x.pct; }).map(function(r) {
      return '<div class="mv-row"><span>' + esc(r.name) + '</span><span>' + round1(r.base) + ' → ' + round1(r.cur) + ' kg</span>' +
        '<b style="color:' + (r.pct >= 0 ? '#7FBF7F' : '#D97757') + '">' + (r.pct >= 0 ? '+' : '') + Math.round(r.pct) + '%</b></div>';
    }).join('');

    var focusNote = focus['Side delts'] && mPct['Side delts'] !== undefined
      ? '<p class="hint" style="margin:10px 0 0;">Shoulders are the focus of this block, so them pulling ahead is the goal, not an imbalance.</p>' : '';

    return '<div class="card" style="margin-top:14px;">' +
      '<div class="ex-name">Strength balance</div>' +
      '<p class="hint" style="margin:2px 0 10px;">How much each muscle\'s est. 1RM has grown since ' + fmtDate(since || firstDate) +
        (since ? ' (cycle start)' : '') + '. It compares progress, not kilos — dumbbells and machines can\'t be compared in kg.</p>' +
      musclesHtml + focusNote +
      (pairsHtml ? '<div style="margin-top:12px;">' + pairsHtml + '</div>' : '') +
      '<details class="mv"><summary>Per exercise</summary>' + mvHtml + '</details>' +
    '</div>';
  }

  // ---------- rep predictor ----------
  var predState = null;
  function predictorHtml(list) {
    var opts = function(sel) {
      return list.map(function(m) { return '<option value="' + esc(m.key) + '"' + (m.key === sel ? ' selected' : '') + '>' + esc(m.name) + '</option>'; }).join('');
    };
    return '<div class="card">' +
      '<div class="ex-name">Rep predictor</div>' +
      '<p class="hint" style="margin:2px 0 0;">Uses the strength ratio between two exercises in your own logs.</p>' +
      '<label class="pl">If I do</label>' +
      '<select id="pa">' + opts(predState.a) + '</select>' +
      '<div class="pgrid">' +
        '<div class="pfield"><input type="number" inputmode="decimal" step="0.5" id="pa-w" value="' + predState.wa + '"><span>kg</span></div>' +
        '<div class="pfield"><input type="number" inputmode="numeric" step="1" id="pa-r" value="' + predState.ra + '"><span>reps</span></div>' +
      '</div>' +
      '<label class="pl">then on</label>' +
      '<select id="pb">' + opts(predState.b) + '</select>' +
      '<div class="pgrid">' +
        '<div class="pfield"><input type="number" inputmode="decimal" step="0.5" id="pb-w" value="' + predState.wb + '"><span>kg</span></div>' +
        '<div></div>' +
      '</div>' +
      '<div class="presult" id="pres"></div>' +
    '</div>';
  }
  function topOf(m) {
    var last = m.withE[m.withE.length - 1];
    return last && last.top ? last.top : { weight: 0, reps: 0 };
  }
  function paintPrediction(mv) {
    var mA = mv[predState.a], mB = mv[predState.b];
    var out = document.getElementById('pres');
    var wa = parseFloat(predState.wa), ra = parseInt(predState.ra, 10), wb = parseFloat(predState.wb);
    if (!mA || !mB || !(wa > 0) || !(ra > 0) || !(wb > 0)) {
      out.innerHTML = '<div class="sub">Fill in weight and reps.</div>';
      return;
    }
    var cA = currentE(mA), cB = currentE(mB);
    var ratio = cB / cA;
    var eA = wa * (1 + ra / 30);
    var eB = eA * ratio;
    var reps = predReps(eB, wb);

    var cutoff = addDays(todayStr(), -42);
    var recent = function(m) { return m.withE.filter(function(s) { return s.date >= cutoff; }).length; };
    var n = Math.min(recent(mA), recent(mB));
    var lastA = mA.withE[mA.withE.length - 1].date, lastB = mB.withE[mB.withE.length - 1].date;
    var gap = Math.abs((new Date(lastA) - new Date(lastB)) / 86400000);
    var level = n >= 4 && gap <= 14 ? 'good' : n >= 2 ? 'fair' : 'low';
    var levelTxt = { good: 'Good data', fair: 'Limited data', low: 'Very little data' }[level];

    var big, sub;
    if (reps < 1) { big = '<1<small> rep</small>'; sub = 'Too heavy — try a lower weight.'; }
    else if (reps > 30) { big = '30+<small> reps</small>'; sub = 'Too light to predict — try a heavier weight.'; }
    else { big = '≈' + Math.round(reps) + '<small> reps</small>'; sub = 'at ' + wb + ' kg on ' + esc(mB.name); }
    var notes = [];
    if (ra > 12 || (reps > 12 && reps <= 30)) notes.push('Above ~12 reps the estimate gets less precise.');
    if (gap > 21) notes.push('The two exercises were last logged ' + Math.round(gap) + ' days apart.');

    out.innerHTML =
      '<div class="big">' + big + '</div>' +
      '<div class="sub">' + sub + '</div>' +
      '<span class="conf ' + level + '">' + levelTxt + '</span>' +
      '<div class="why">' + wa + ' × ' + ra + ' → est. 1RM ' + round1(eA) + ' kg on ' + esc(mA.name) + '.<br>' +
        'Your current ratio ' + esc(mB.name) + ' / ' + esc(mA.name) + ' = ' + ratio.toFixed(2) +
        ' (' + round1(cB) + ' / ' + round1(cA) + ' kg) → ' + round1(eB) + ' kg.' +
        (notes.length ? '<br>' + notes.join(' ') : '') + '</div>';
  }

  function renderStrength() {
    var root = document.getElementById('view');
    var mv = movements();
    var list = Object.keys(mv).map(function(k) { return mv[k]; })
      .filter(function(m) { return m.withE.length; })
      .sort(function(x, y) { return (y.active - x.active) || x.name.localeCompare(y.name); });
    if (!list.length) {
      root.innerHTML = '<div class="card" style="margin-top:14px;"><div class="ex-name">Strength</div>' +
        '<p class="hint" style="margin:4px 0 0;">Log a few sessions with weight and reps and this page shows how your muscles progress against each other, plus a rep predictor between exercises.</p></div>';
      return;
    }
    if (!predState || !mv[predState.a] || !mv[predState.b] || !mv[predState.a].withE.length || !mv[predState.b].withE.length) {
      // start from the block's priority exercise, compared with the best-documented other one
      var prioKeys = {};
      routine.forEach(function(d) { d.exercises.forEach(function(e) { if (e.priority) prioKeys[movementKey(e.name)] = true; }); });
      var byData = list.slice().sort(function(x, y) {
        return (!!prioKeys[y.key] - !!prioKeys[x.key]) || (y.active - x.active) || (y.withE.length - x.withE.length);
      });
      var a = byData[0];
      var b = byData.filter(function(m) { return m !== a && !prioKeys[m.key]; })[0] || byData[1] || a;
      predState = { a: a.key, b: b.key, wa: topOf(a).weight, ra: topOf(a).reps, wb: topOf(b).weight };

    var sync = function() {
      predState.wa = document.getElementById('pa-w').value;

  // ---------- rest timer (clock-anchored, survives re-renders) ----------
  var timer = readJSON(TIMER_KEY, null); // { key, endAt, restSec }
  // A rest that ran out ages ago belongs to a past session: don't resurrect it on launch.
  if (timer && (!timer.endAt || timer.endAt < Date.now() - 10 * 60 * 1000)) {
    timer = null;
    localStorage.removeItem(TIMER_KEY);
  }
  var ticker = null;
  var wakeLock = null;

  // Keep the screen on while resting: a locked phone suspends JS, so the
  // end-of-rest vibration/beep would never fire.
  function acquireWakeLock() {
    try {
      if (!('wakeLock' in navigator) || wakeLock || document.visibilityState !== 'visible') return;
      navigator.wakeLock.request('screen').then(function(l) {

        l.addEventListener('release', function() { wakeLock = null; });
      }).catch(function() {});
    } catch (e) {}
  }
  function releaseWakeLock() {
    try { if (wakeLock) wakeLock.release(); } catch (e) {}
    wakeLock = null;
  }

  function timerRemaining() {
    if (!timer) return 0;
    return Math.max(0, Math.ceil((timer.endAt - Date.now()) / 1000));
  }
  function startTimer(key, restSec, name) {
    timer = { key: key, name: name || '', endAt: Date.now() + restSec * 1000, restSec: restSec, alerted: false };
    localStorage.setItem(TIMER_KEY, JSON.stringify(timer));
    acquireWakeLock();
    ensureTicker();
    paintTimers();
  }
  function extendTimer(sec) {
    if (!timer) return;
    var base = Math.max(timer.endAt, Date.now());
    timer.endAt = Math.max(Date.now() + 1000, base + sec * 1000);
    timer.restSec = Math.max(1, timer.restSec + sec);
    if (sec > 0) timer.alerted = false;
    localStorage.setItem(TIMER_KEY, JSON.stringify(timer));
    acquireWakeLock();
    ensureTicker();
    paintTimers();
  }

  var tfullOpen = false;

  // What comes after this rest: the next set of the same exercise (or of its superset partner),

  function nextUpHtml() {

    var group = ssGroup(f.day, f.ex);
    var target = group.length > 1 ? nextInGroup(group) : (setsDone(f.ex) < f.ex.sets ? f.ex : null);
    if (target) {
      var i = setsDone(target) + 1;
      var d = drafts[target.id];
      var prior = sortedHist(target.id).filter(function(s) { return s.date < todayStr(); });
      var p = prior.length ? prior[prior.length - 1].sets[i - 1] : null;
      var w = d && d.w[i - 1] ? parseFloat(d.w[i - 1]) : p ? p.weight : null;
      var r = d && d.r[i - 1] ? parseInt(d.r[i - 1], 10) : p ? p.reps : null;
      var val = (w == null && !r) ? target.repMin + '–' + target.repMax + ' reps' : fmtSet({ weight: w || 0, reps: r || null });
      var tag = group.length > 1 ? 'Superset ' + target.ss + ' · ' : '';

  function paintTimers() {
    var btns = document.querySelectorAll('[data-timer]');

    if (timer && remaining <= 0 && !timer.alerted) {
      timer.alerted = true;
      // Only alert if the rest ended just now, not when reopening the app much later.
      if (Date.now() - timer.endAt < 15000) {
        if (navigator.vibrate) navigator.vibrate([250, 100, 250]);
        beep();

    }
    var CLOCK_ICO = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>';
    btns.forEach(function(btn) {
      var key = btn.getAttribute('data-timer');
      btn.classList.remove('running', 'done');
      if (timer && timer.key === key) {
        if (remaining > 0) {
          btn.innerHTML = CLOCK_ICO + fmtClock(remaining);
          btn.classList.add('running');
        } else {
          btn.innerHTML = CLOCK_ICO + 'Rest done';
          btn.classList.add('done');
        }
      } else {
        btn.innerHTML = CLOCK_ICO + 'Rest ' + fmtClock(parseInt(btn.getAttribute('data-rest'), 10));

    // Floating bar: visible from anywhere in the app while a rest is running or just ended.
    var bar = document.getElementById('timer-bar');
    var app = document.getElementById('gymlog');
    var showBar = !!timer && (remaining > 0 || Date.now() - timer.endAt < 60000);
    var pct = timer && timer.restSec ? Math.max(0, Math.min(100, (1 - remaining / timer.restSec) * 100)) : 100;
    bar.hidden = !showBar;
    app.classList.toggle('timer-on', showBar);
    if (showBar) {
      bar.classList.toggle('done', remaining <= 0);
      document.getElementById('timer-clock').textContent = remaining > 0 ? fmtClock(remaining) : '0:00';
      document.getElementById('timer-name').innerHTML = '<b>' + esc(timer.name || 'Rest') + '</b>' +
        '<small>' + (remaining > 0 ? 'Resting · tap to expand' : 'Rest done — next set') + '</small>';
      document.getElementById('timer-progress').style.width = pct + '%';
    }

    if (tfullOpen && !showBar) closeTimerFull();
    if (tfullOpen && showBar) {
      var tf = document.getElementById('tfull');
      tf.classList.toggle('done', remaining <= 0);
      document.getElementById('tfull-name').textContent = timer.name || 'Rest';
      document.getElementById('tfull-clock').textContent = remaining > 0 ? fmtClock(remaining) : 'Go';
      document.getElementById('tfull-sub').textContent = remaining > 0 ? 'Rest' : 'Rest done';
      document.getElementById('tfull-prg').style.strokeDashoffset = (RING_C * pct / 100).toFixed(1);
      document.getElementById('tfull-next').innerHTML = nextUpHtml();

    // Nothing left to count down: stop ticking instead of spinning forever.
    // While the "done" bar is still shown, keep a slow tick so it hides itself after a minute.
    if (!timer || remaining <= 0) {
      stopTicker();
      if (showBar) setTimeout(paintTimers, 5000);
    }
  }

  // Tabs are rebuilt on every render: keep where they were scrolled, make sure the active day is in view,
  // and fade the edge that has more tabs behind it.
  var tabScroll = 0;
  function fitTabs(root) {
    var tabs = root.querySelector('.tabs');
    if (!tabs) return;
    tabs.scrollLeft = tabScroll;
    var act = tabs.querySelector('.tab.active');
    if (act) {
      var tr = tabs.getBoundingClientRect(), ar = act.getBoundingClientRect();
      if (ar.left < tr.left + 14 || ar.right > tr.right - 14) tabs.scrollLeft += (ar.left + ar.width / 2) - (tr.left + tr.width / 2);
    }
    var fade = function() {
      tabScroll = tabs.scrollLeft;
      tabs.style.setProperty('--fl', tabs.scrollLeft > 2 ? '32px' : '0px');
      tabs.style.setProperty('--fr', tabs.scrollLeft + tabs.clientWidth < tabs.scrollWidth - 2 ? '64px' : '0px');
    };

  // Sets done vs planned for the day, and when today's first and last sets were ticked.
  function setProgress(day) {

      total += ex.sets;
      var s = todaySession(ex.id);
      if (!s) return;
      done += exDone(ex) ? ex.sets : Math.min(s.sets.length, ex.sets);
      s.sets.forEach(function(x) { if (x.at) ats.push(x.at); });
    });
    return { done: done, total: total,
      start: ats.length ? Math.min.apply(null, ats) : null, end: ats.length ? Math.max.apply(null, ats) : null };
  }

  // This week, Monday to Sunday: what was trained, what's next in the rotation, rest days.

    var cursor = todayRest && !todayTrained ? idx - 1 : idx;

      var date = addDays(mon, i), dow = new Date(date + 'T00:00:00').getDay();

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gym log</title>
<meta name="theme-color" content="#16181B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym log">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
  html, body { margin: 0; padding: 0; background: #131518; min-height: 100vh; }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); padding-top: max(12px, env(safe-area-inset-top)); -webkit-tap-highlight-color: transparent; }

  #gymlog * { box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }
  #gymlog h1, #gymlog .num, #gymlog .weight-badge, #gymlog .timer-clock, #gymlog .stat b, #gymlog .vol-num { font-family: 'Barlow Condensed', 'Inter', sans-serif; }
  #gymlog { color: #EDEBE3; max-width: 520px; margin: 0 auto; padding: 8px 14px calc(96px + env(safe-area-inset-bottom)); }
  #gymlog.timer-on { padding-bottom: calc(160px + env(safe-area-inset-bottom)); }
  #gymlog select, #gymlog input, #gymlog textarea { background: #21242A; border: 1px solid #3A3E46; color: #EDEBE3; border-radius: 8px; padding: 10px 12px; font-size: 15px; width: 100%; }
  #gymlog select:focus, #gymlog input:focus, #gymlog textarea:focus { outline: none; border-color: #E8A33D; }
  #gymlog button { background: #E8A33D; color: #16181B; border: none; border-radius: 8px; padding: 11px 16px; font-weight: 600; font-size: 14px; cursor: pointer; }
  #gymlog button:active { transform: scale(0.98); }
  #gymlog button:disabled { opacity: .35; cursor: default; }
  #gymlog button.ghost { background: transparent; border: 1px solid #3A3E46; color: #B7B4A9; }
  #gymlog button.danger { background: transparent; border: 1px solid #D97757; color: #D97757; }
  #gymlog button.mini { padding: 6px 10px; font-size: 12px; }
  #gymlog .card { background: #1C1F23; border: 1px solid #2A2E34; border-radius: 14px; padding: 14px 16px 12px; margin-bottom: 10px; }
  #gymlog .row { display: flex; gap: 10px; align-items: center; }
  #gymlog .ex-name { font-weight: 600; font-size: 15px; line-height: 1.3; }
  #gymlog .ex-meta { color: #8C8A82; font-size: 12px; margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
  #gymlog .weight-badge { font-size: 28px; font-weight: 700; color: #E8A33D; min-width: 64px; text-align: right; line-height: 1; white-space: nowrap; }
  #gymlog .weight-badge.empty { color: #3A3E46; }
  #gymlog .delta { font-size: 12px; margin-top: 2px; text-align: right; white-space: nowrap; }
  #gymlog .delta.up { color: #7FBF7F; }
  #gymlog .delta.down { color: #D97757; }
  #gymlog .delta.flat { color: #8C8A82; }
  #gymlog .history { margin-top: 12px; padding-top: 12px; border-top: 1px solid #2A2E34; display: none; }
  #gymlog .history.open { display: block; }
  #gymlog .hist-row { display: flex; justify-content: space-between; font-size: 13px; color: #B7B4A9; padding: 3px 0; }
  #gymlog .spark { display: flex; align-items: flex-end; gap: 4px; height: 28px; margin-top: 12px; }
  #gymlog .bar { flex: 1; max-width: 16px; background: rgba(232,163,61,.35); border-radius: 3px 3px 1px 1px; min-height: 3px; }
  #gymlog .bar:last-child { background: #E8A33D; }
  #gymlog .card-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; gap: 8px; }
  #gymlog .toggle { cursor: pointer; color: #B7B4A9; font-size: 13px; font-weight: 600; padding: 7px 4px 7px 12px; display: flex; align-items: center; gap: 6px; user-select: none; }
  #gymlog .chev { width: 14px; height: 14px; transition: transform .15s; }
  #gymlog .toggle.open .chev { transform: rotate(180deg); }
  #gymlog .hist-row .del { color: #D97757; cursor: pointer; font-size: 12px; margin-left: 10px; }
  #gymlog .tabs { display: flex; gap: 6px; overflow-x: auto; margin: 14px -14px 12px; padding: 0 14px 2px; scrollbar-width: none; }
  #gymlog .tabs::-webkit-scrollbar { display: none; }
  #gymlog .tab { flex: 0 0 auto; padding: 8px 14px; border-radius: 20px; border: 1px solid #2A2E34; background: #1C1F23; color: #B7B4A9; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  #gymlog .tab.active { background: #E8A33D; color: #16181B; border-color: #E8A33D; font-weight: 600; }
  #gymlog .tab-dot { width: 6px; height: 6px; border-radius: 50%; background: #E8A33D; }
  #gymlog .tab.active .tab-dot { background: #16181B; }
  #gymlog .tab-check { color: #7FBF7F; font-weight: 700; font-size: 12px; }
  #gymlog .tab.active .tab-check { color: #16181B; }
  #gymlog .today-line { font-size: 12px; color: #8C8A82; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  #gymlog .today-track { flex: 1; height: 4px; background: #23262B; border-radius: 2px; overflow: hidden; }
  #gymlog .today-fill { height: 100%; background: #7FBF7F; border-radius: 2px; }
  #gymlog .set-head, #gymlog .set-row { display: grid; grid-template-columns: 34px 1fr 1fr; gap: 8px; align-items: center; }
  #gymlog .set-head { font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #5C5A52; margin-bottom: 6px; }
  #gymlog .set-head span:not(:first-child) { padding-left: 12px; }
  #gymlog .set-row { margin-bottom: 8px; }
  #gymlog .set-label { width: 26px; height: 26px; border-radius: 50%; background: #23262B; color: #8C8A82; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
  #gymlog .set-row input { min-width: 0; font-size: 17px; font-weight: 600; padding: 11px 12px; }
  #gymlog .easy-check { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #8C8A82; flex-shrink: 0; width: 62px; }
  #gymlog .easy-check input { width: auto; accent-color: #E8A33D; }
  #gymlog .session { padding: 8px 0; border-bottom: 1px solid #2C3036; }
  #gymlog .session:last-child { border-bottom: none; }
  #gymlog .session-head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #B7B4A9; margin-bottom: 6px; }
  #gymlog .session-sets { display: flex; gap: 6px; flex-wrap: wrap; }
  #gymlog .set-chip { background: #21242A; border-radius: 6px; padding: 3px 9px; font-size: 12px; color: #EDEBE3; border: 1px solid transparent; }
  #gymlog .set-chip.easy { color: #7FBF7F; border-color: #7FBF7F; }
  #gymlog .easy-note { font-size: 11px; color: #7FBF7F; margin-top: 2px; text-align: right; }
  #gymlog .toolbar { display: flex; gap: 6px; margin-top: 12px; }
  #gymlog .toolbar button { flex: 1; }
  #gymlog .pr-badge { display: inline-block; background: #E8A33D; color: #16181B; border-radius: 5px; padding: 1px 6px; font-size: 10px; font-weight: 700; letter-spacing: .04em; vertical-align: middle; }
  #gymlog .stats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  #gymlog .stat { background: #1C1F23; border: 1px solid #2A2E34; border-radius: 12px; padding: 8px 12px; font-size: 11px; color: #8C8A82; flex: 1; min-width: 92px; }
  #gymlog .stat b { display: block; color: #EDEBE3; font-size: 22px; font-weight: 700; margin-top: 2px; line-height: 1.1; }
  #gymlog .ed-ex { background: #1D2024; border: 1px solid #2C3036; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  #gymlog .ed-grid { display: flex; gap: 6px; margin-top: 8px; }
  #gymlog .ed-grid label { flex: 1; font-size: 10px; color: #8C8A82; }
  #gymlog .ed-grid input { margin-top: 3px; padding: 7px 8px; font-size: 14px; text-align: center; }
  #gymlog .ed-actions { display: flex; gap: 6px; margin-top: 8px; justify-content: flex-end; }
  #gymlog .hint { color: #5C5A52; font-size: 11px; line-height: 1.5; }
  #gymlog textarea { font-family: ui-monospace, monospace; font-size: 11px; height: 120px; resize: vertical; }
  #gymlog .timer-btn { padding: 7px 12px; font-size: 13px; border-radius: 20px; display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
  #gymlog .timer-btn.running { color: #16181B; background: #E8A33D; border-color: #E8A33D; }
  #gymlog .timer-btn.done { color: #7FBF7F; border-color: #7FBF7F; }
  #gymlog .ico { width: 14px; height: 14px; flex-shrink: 0; }
  #gymlog .done-chip { color: #7FBF7F; font-weight: 600; }
  #gymlog .card.logged { border-color: #2F3B31; }

  #gymlog .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  #gymlog .cycle-chip { text-align: right; min-width: 92px; }
  #gymlog .cycle-chip .num { font-size: 22px; font-weight: 700; color: #E8A33D; line-height: 1; }
  #gymlog .cycle-chip .num small { font-size: 14px; color: #8C8A82; font-weight: 600; }
  #gymlog .cycle-chip .lbl { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: #8C8A82; margin-top: 2px; }
  #gymlog .cycle-chip.over .num { color: #D97757; }
  #gymlog .cycle-track { display: flex; gap: 3px; margin-top: 6px; justify-content: flex-end; }
  #gymlog .cycle-track i { width: 10px; height: 4px; border-radius: 2px; background: #2A2E34; }
  #gymlog .cycle-track i.on { background: #E8A33D; }
  #gymlog .cycle-chip.over .cycle-track i.on { background: #D97757; }

  #gymlog .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(19,21,24,.94); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid #23262B; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
  #gymlog .bottom-nav-inner { max-width: 520px; margin: 0 auto; display: flex; }
  #gymlog .nav-btn { flex: 1; background: none; border: none; color: #6E6C66; padding: 6px 0 4px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; border-radius: 10px; }
  #gymlog .nav-btn svg { width: 22px; height: 22px; }
  #gymlog .nav-btn.active { color: #E8A33D; }

  #gymlog .timer-bar { position: fixed; left: 0; right: 0; bottom: calc(62px + env(safe-area-inset-bottom)); z-index: 19; padding: 0 12px 8px; }
  #gymlog .timer-bar-inner { max-width: 496px; margin: 0 auto; background: #E8A33D; color: #16181B; border-radius: 14px; padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
  #gymlog .timer-bar.done .timer-bar-inner { background: #7FBF7F; }
  #gymlog .timer-clock { font-size: 30px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; min-width: 64px; }
  #gymlog .timer-name { flex: 1; min-width: 0; font-size: 12px; line-height: 1.3; }
  #gymlog .timer-name b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #gymlog .timer-name small { display: block; font-weight: 500; opacity: .7; }
  #gymlog .timer-bar button { background: rgba(22,24,27,.14); color: #16181B; padding: 8px 12px; font-size: 13px; border-radius: 10px; }
  #gymlog .timer-progress { position: absolute; left: 0; bottom: 0; height: 3px; background: rgba(22,24,27,.35); border-radius: 0 2px 2px 0; }
  #gymlog .timer-bar-inner { position: relative; overflow: hidden; }
  #gymlog .draft-note { font-size: 11px; color: #E8A33D; margin-top: 6px; text-align: center; }
  #gymlog [hidden] { display: none !important; }
  #gymlog .cycle-line { display: none; }
  #gymlog .card.priority { box-shadow: inset 3px 0 0 #E8A33D; }
  #gymlog .prio-tag { display: inline-block; border: 1px solid #E8A33D; color: #E8A33D; border-radius: 5px; padding: 0 5px; font-size: 9px; font-weight: 700; letter-spacing: .05em; vertical-align: middle; margin-left: 4px; }
  #gymlog .ed-grid select { margin-top: 3px; padding: 7px 8px; font-size: 13px; }
  #gymlog .prio-check { display: flex; align-items: flex-end; gap: 6px; padding-bottom: 8px; }
  #gymlog .prio-check input { width: auto; accent-color: #E8A33D; margin: 0; }
  #gymlog .vol-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #B7B4A9; padding: 4px 0; }
  #gymlog .vol-name { width: 88px; flex-shrink: 0; }
  #gymlog .vol-track { flex: 1; height: 8px; background: #21242A; border-radius: 4px; overflow: hidden; }
  #gymlog .vol-fill { height: 100%; background: #E8A33D; }
  #gymlog .vol-fill.full { background: #7FBF7F; }
  #gymlog .vol-num { width: 44px; text-align: right; flex-shrink: 0; color: #EDEBE3; }

  /* ----- per-set check-off ----- */
  #gymlog .set-head, #gymlog .set-row { grid-template-columns: 30px 1fr 1fr 46px; }
  #gymlog .set-check { width: 46px; height: 44px; padding: 0; border-radius: 12px; background: #23262B; border: 1px solid #2A2E34; color: #4A4D53; display: flex; align-items: center; justify-content: center; transition: background .15s, border-color .15s, color .15s; }
  #gymlog .set-check svg { width: 22px; height: 22px; }
  #gymlog .set-check.next { border-color: #E8A33D; color: #E8A33D; background: rgba(232,163,61,.08); }
  #gymlog .set-row.done .set-check { background: #7FBF7F; border-color: #7FBF7F; color: #16181B; }
  #gymlog .set-row.done .set-check:disabled { opacity: 1; }
  #gymlog .set-row.done input { background: #1B231D; border-color: #2F3B31; color: #CFE8CF; }
  #gymlog .set-row.done .set-label { background: #7FBF7F; color: #16181B; }
  #gymlog .set-row.next .set-label { background: #E8A33D; color: #16181B; }
  #gymlog .set-row.pop .set-check { animation: gl-pop .4s ease; }
  @keyframes gl-pop { 0% { transform: scale(1); } 35% { transform: scale(1.22); } 100% { transform: scale(1); } }
  #gymlog .set-hint { font-size: 11px; color: #6E6C66; margin: -2px 0 8px; }
  #gymlog .sets-chip { color: #E8A33D; font-weight: 600; }
  #gymlog .card.active { border-color: rgba(232,163,61,.45); }
  #gymlog .today-line.complete { color: #7FBF7F; font-weight: 600; cursor: pointer; }

  /* ----- PR toast + confetti ----- */
  #gymlog .toast { position: fixed; left: 12px; right: 12px; top: max(12px, env(safe-area-inset-top)); z-index: 60; max-width: 496px; margin: 0 auto; background: #E8A33D; color: #16181B; border-radius: 16px; padding: 12px 16px; display: flex; gap: 12px; align-items: center; box-shadow: 0 12px 32px rgba(0,0,0,.5); animation: gl-drop .45s cubic-bezier(.2,1.4,.4,1); }
  #gymlog .toast.out { animation: gl-up .3s ease forwards; }
  #gymlog .toast-ico svg { width: 30px; height: 30px; display: block; }
  #gymlog .toast b { display: block; font-size: 15px; }
  #gymlog .toast span { font-size: 12px; font-weight: 500; }
  @keyframes gl-drop { from { transform: translateY(-140%); } to { transform: translateY(0); } }
  @keyframes gl-up { to { transform: translateY(-140%); opacity: 0; } }
  .gl-confetti { position: fixed; inset: 0; pointer-events: none; z-index: 70; overflow: hidden; }
  .gl-confetti i { position: absolute; top: -14px; width: 8px; height: 12px; border-radius: 2px; animation: gl-fall var(--dur) cubic-bezier(.25,.6,.4,1) var(--delay) forwards; }
  @keyframes gl-fall { to { transform: translate3d(var(--dx), 105vh, 0) rotate(var(--rot)); } }
  @media (prefers-reduced-motion: reduce) { .gl-confetti { display: none; } }

  /* ----- workout summary sheet ----- */
  #gymlog .sheet-wrap { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
  #gymlog .sheet-bg { position: absolute; inset: 0; background: rgba(0,0,0,.62); animation: gl-fade .25s ease; }
  #gymlog .sheet { position: relative; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; background: #1C1F23; border-radius: 24px 24px 0 0; padding: 10px 20px calc(20px + env(safe-area-inset-bottom)); animation: gl-rise .4s cubic-bezier(.2,1,.3,1); }
  #gymlog .sheet-grab { width: 40px; height: 4px; border-radius: 2px; background: #3A3E46; margin: 0 auto 18px; }
  @keyframes gl-fade { from { opacity: 0; } }
  @keyframes gl-rise { from { transform: translateY(100%); } }
  #gymlog .sum-kicker { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #7FBF7F; font-weight: 700; }
  #gymlog .sum-title { font-family: 'Barlow Condensed', sans-serif; font-size: 44px; font-weight: 700; line-height: 1; margin: 4px 0 2px; }
  #gymlog .sum-date { color: #8C8A82; font-size: 13px; }
  #gymlog .sum-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 18px 0 12px; }
  #gymlog .sum-stat { background: #23262B; border-radius: 14px; padding: 12px 14px; font-size: 11px; color: #8C8A82; }
  #gymlog .sum-stat b { display: block; font-family: 'Barlow Condensed', sans-serif; font-size: 32px; line-height: 1; color: #EDEBE3; margin-bottom: 2px; }
  #gymlog .sum-stat b small { font-size: 16px; color: #8C8A82; }
  #gymlog .sum-stat.hl b { color: #E8A33D; }
  #gymlog .sum-vs { font-size: 13px; color: #B7B4A9; margin-bottom: 14px; }
  #gymlog .sum-vs .up { color: #7FBF7F; font-weight: 600; }
  #gymlog .sum-vs .down { color: #D97757; font-weight: 600; }
  #gymlog .sum-pr { display: flex; align-items: center; gap: 10px; background: rgba(232,163,61,.1); border: 1px solid rgba(232,163,61,.35); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; font-size: 13px; }
  #gymlog .sum-pr svg { width: 20px; height: 20px; color: #E8A33D; flex-shrink: 0; }
  #gymlog .sum-ex { padding: 10px 0; border-top: 1px solid #2A2E34; font-size: 13px; }
  #gymlog .sum-ex-name { font-weight: 600; }
  #gymlog .sum-ex-sets { color: #8C8A82; font-size: 12px; margin-top: 2px; }

  /* ----- full-screen rest timer ----- */
  #gymlog .timer-bar-inner { cursor: pointer; }
  #gymlog .tfull { position: fixed; inset: 0; z-index: 40; background: radial-gradient(circle at 50% 38%, #24282E 0%, #131518 72%); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); animation: gl-fade .2s ease; }
  #gymlog .tfull-close { position: absolute; top: max(12px, env(safe-area-inset-top)); left: 8px; background: none; color: #8C8A82; padding: 12px; }
  #gymlog .tfull-close svg { width: 28px; height: 28px; display: block; }
  #gymlog .tfull-name { font-size: 15px; font-weight: 600; color: #B7B4A9; text-align: center; max-width: 320px; }
  #gymlog .tfull-ring { position: relative; width: min(76vw, 300px); aspect-ratio: 1; margin: 24px 0; }
  #gymlog .tfull-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
  #gymlog .tfull-ring .trk { fill: none; stroke: #23262B; stroke-width: 14; }
  #gymlog .tfull-ring .prg { fill: none; stroke: #E8A33D; stroke-width: 14; stroke-linecap: round; transition: stroke-dashoffset .3s linear, stroke .3s; }
  #gymlog .tfull.done .prg { stroke: #7FBF7F; }
  #gymlog .tfull-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #gymlog .tfull-clock { font-family: 'Barlow Condensed', sans-serif; font-size: clamp(64px, 22vw, 100px); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  #gymlog .tfull.done .tfull-clock { color: #7FBF7F; }
  #gymlog .tfull-sub { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #8C8A82; margin-top: 6px; }
  #gymlog .tfull-next { background: #1C1F23; border: 1px solid #2A2E34; border-radius: 18px; padding: 14px 18px; width: 100%; max-width: 340px; text-align: center; }
  #gymlog .tfull-next small { display: block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #8C8A82; }
  #gymlog .tfull-next b { display: block; font-family: 'Barlow Condensed', sans-serif; font-size: 32px; line-height: 1.1; margin-top: 4px; color: #E8A33D; }
  #gymlog .tfull-next span { font-size: 13px; color: #B7B4A9; }
  #gymlog .tfull-actions { display: flex; gap: 10px; margin-top: 22px; width: 100%; max-width: 340px; }
  #gymlog .tfull-actions button { flex: 1; padding: 15px 0; font-size: 15px; border-radius: 14px; background: #23262B; color: #EDEBE3; }
  #gymlog .tfull-actions button.stop { background: #E8A33D; color: #16181B; }
  #gymlog .tfull.done .tfull-actions button.stop { background: #7FBF7F; }

  /* ----- per-exercise chart ----- */
  #gymlog .chart { margin: 0 0 14px; }
  #gymlog .chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 11px; color: #8C8A82; margin-bottom: 6px; }
  #gymlog .chart-head b { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; color: #EDEBE3; font-weight: 700; }
  #gymlog .chart svg { width: 100%; height: auto; display: block; overflow: visible; }
  #gymlog .chart .pt { cursor: pointer; }
  #gymlog .chart .pt.sel .dot { fill: #EDEBE3; stroke: #EDEBE3; }
  #gymlog .session.hl { background: rgba(232,163,61,.08); border-radius: 8px; margin: 0 -8px; padding: 8px; }

  /* ----- consistency calendar ----- */
  #gymlog .cal-months, #gymlog .cal { display: grid; grid-template-columns: repeat(17, 1fr); gap: 3px; }
  #gymlog .cal { grid-template-rows: repeat(7, auto); grid-auto-flow: column; }
  #gymlog .cal-months { font-size: 9px; color: #6E6C66; margin-bottom: 4px; height: 12px; }
  #gymlog .cal-months span { white-space: nowrap; overflow: visible; }
  #gymlog .cal i, #gymlog .cal-legend i { aspect-ratio: 1; border-radius: 3px; background: #23262B; display: block; }
  #gymlog .cal i.l1, #gymlog .cal-legend i.l1 { background: rgba(232,163,61,.3); }
  #gymlog .cal i.l2, #gymlog .cal-legend i.l2 { background: rgba(232,163,61,.62); }
  #gymlog .cal i.l3, #gymlog .cal-legend i.l3 { background: #E8A33D; }
  #gymlog .cal i.fut { background: transparent; }
  #gymlog .cal i.today { outline: 1.5px solid #EDEBE3; outline-offset: -1.5px; }
  #gymlog .cal-legend { display: flex; justify-content: flex-end; align-items: center; gap: 3px; font-size: 10px; color: #6E6C66; margin-top: 8px; }
  #gymlog .cal-legend i { width: 10px; height: 10px; }

  /* ----- rep targets in set rows ----- */
  #gymlog .rep-cell { position: relative; min-width: 0; }
  #gymlog .rep-cell input { width: 100%; padding-right: 40px; }
  #gymlog .tgt { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 12px; font-weight: 600; color: #6E6C66; pointer-events: none; font-variant-numeric: tabular-nums; }
  #gymlog .tgt.up { color: #7FBF7F; }
  #gymlog .tgt.down { color: #D97757; }

  /* ----- strength view ----- */
  #gymlog .bal-row { display: grid; grid-template-columns: 96px 1fr 50px; gap: 8px; align-items: center; font-size: 12px; color: #B7B4A9; padding: 5px 0; }
  #gymlog .bal-track { position: relative; height: 8px; background: #23262B; border-radius: 4px; }
  #gymlog .bal-track::after { content: ''; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: #4A4D53; }
  #gymlog .bal-fill { position: absolute; top: 0; bottom: 0; border-radius: 4px; background: #7FBF7F; }
  #gymlog .bal-fill.neg { background: #D97757; }
  #gymlog .bal-fill.focus { background: #E8A33D; }
  #gymlog .bal-num { text-align: right; color: #EDEBE3; font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 700; }
  #gymlog .focus-tag { display: inline-block; font-size: 8px; font-weight: 700; letter-spacing: .06em; color: #E8A33D; border: 1px solid #E8A33D; border-radius: 4px; padding: 0 4px; margin-left: 4px; vertical-align: middle; }
  #gymlog .pair { padding: 12px 0 4px; border-top: 1px solid #2A2E34; }
  #gymlog .pair-head { display: flex; justify-content: space-between; font-size: 12px; color: #B7B4A9; }
  #gymlog .pair-head b { color: #EDEBE3; }
  #gymlog .pair-beam { position: relative; height: 6px; background: #23262B; border-radius: 3px; margin: 12px 4px 8px; }
  #gymlog .pair-beam::before { content: ''; position: absolute; left: 50%; top: -5px; bottom: -5px; width: 2px; margin-left: -1px; background: #4A4D53; border-radius: 1px; }
  #gymlog .pair-dot { position: absolute; top: 50%; width: 16px; height: 16px; border-radius: 50%; transform: translate(-50%, -50%); background: #7FBF7F; box-shadow: 0 0 0 3px #1C1F23; transition: left .4s; }
  #gymlog .pair-dot.off { background: #E8A33D; }
  #gymlog .pair-verdict { font-size: 12px; text-align: center; color: #7FBF7F; font-weight: 600; }
  #gymlog .pair-verdict.off { color: #E8A33D; }
  #gymlog details.mv { margin-top: 12px; }
  #gymlog details.mv summary { font-size: 13px; font-weight: 600; color: #B7B4A9; cursor: pointer; padding: 6px 0; }
  #gymlog .mv-row { display: grid; grid-template-columns: 1fr auto 48px; gap: 10px; font-size: 12px; padding: 6px 0; border-top: 1px solid #23262B; color: #B7B4A9; }
  #gymlog .mv-row b { color: #EDEBE3; font-weight: 600; text-align: right; }
  #gymlog .pl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #8C8A82; margin: 14px 0 6px; display: block; }
  #gymlog .pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  #gymlog .pfield { position: relative; }
  #gymlog .pfield input { padding-right: 44px; font-size: 17px; font-weight: 600; }
  #gymlog .pfield span { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 12px; color: #6E6C66; pointer-events: none; }
  #gymlog .presult { margin-top: 16px; background: #23262B; border-radius: 16px; padding: 16px; text-align: center; }
  #gymlog .presult .big { font-family: 'Barlow Condensed', sans-serif; font-size: 52px; font-weight: 700; line-height: 1; color: #E8A33D; }
  #gymlog .presult .big small { font-size: 20px; color: #B7B4A9; }
  #gymlog .presult .sub { font-size: 13px; color: #B7B4A9; margin-top: 4px; }
  #gymlog .presult .why { font-size: 11px; color: #6E6C66; margin-top: 10px; line-height: 1.5; }
  #gymlog .conf { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 5px; margin-top: 10px; }
  #gymlog .conf.good { background: rgba(127,191,127,.15); color: #7FBF7F; }
  #gymlog .conf.fair { background: rgba(232,163,61,.15); color: #E8A33D; }
  #gymlog .conf.low { background: rgba(217,119,87,.15); color: #D97757; }
</style>
</head>
<body>

<div id="gymlog">
  <div class="head">
    <div>
      <h1 style="font-size:32px;font-weight:700;margin:0;line-height:1;">Gym log</h1>
      <p id="subtitle" style="color:#8C8A82;font-size:13px;margin:4px 0 0;">Tap an exercise to log this week's weight</p>
      <p id="cycle-line" class="cycle-line" hidden></p>
    </div>
    <div id="cycle-chip" class="cycle-chip" hidden></div>
  </div>
  <div id="view"></div>
  <p class="hint" id="backup-note" style="margin:18px 0 0;text-align:center;">Saved on this device only — export a backup now and then.</p>

  <div class="timer-bar" id="timer-bar" hidden>
    <div class="timer-bar-inner">
      <div class="timer-clock" id="timer-clock">0:00</div>
      <div class="timer-name" id="timer-name"></div>
      <button id="timer-add">+30s</button>
      <button id="timer-stop">Stop</button>
      <div class="timer-progress" id="timer-progress"></div>
    </div>
  </div>

  <div class="tfull" id="tfull" hidden>
    <button class="tfull-close" id="tfull-close" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div class="tfull-name" id="tfull-name"></div>
    <div class="tfull-ring">
      <svg viewBox="0 0 260 260"><circle class="trk" cx="130" cy="130" r="116"/><circle class="prg" id="tfull-prg" cx="130" cy="130" r="116" stroke-dasharray="728.85" stroke-dashoffset="0"/></svg>
      <div class="tfull-center"><div class="tfull-clock" id="tfull-clock">0:00</div><div class="tfull-sub" id="tfull-sub">Rest</div></div>
    </div>
    <div class="tfull-next" id="tfull-next"></div>
    <div class="tfull-actions">
      <button id="tfull-minus">−15s</button>
      <button id="tfull-plus">+30s</button>
      <button id="tfull-stop" class="stop">Skip</button>
    </div>
  </div>

  <div class="sheet-wrap" id="sheet" hidden></div>

  <nav class="bottom-nav">
    <div class="bottom-nav-inner">
      <button class="nav-btn" id="nav-log">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>
        Workout
      </button>
      <button class="nav-btn" id="nav-strength">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M8 21h8M5 7h14M5 7l-3 7a3 3 0 0 0 6 0L5 7zM19 7l-3 7a3 3 0 0 0 6 0l-3-7z"/></svg>
        Strength
      </button>
      <button class="nav-btn" id="nav-edit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>
        Routine
      </button>
      <button class="nav-btn" id="nav-data">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        Data
      </button>
    </div>
  </nav>
</div>

<script>
(function() {
  'use strict';

  // ---------- default routine ----------
  var MUSCLES = ['Side delts', 'Front delts', 'Rear delts', 'Chest', 'Back', 'Biceps', 'Triceps',
                 'Quads', 'Hamstrings', 'Glutes', 'Calves', 'Abs', 'Other'];

  function defaultRoutine() {
    return [
      { id: 'day1', label: 'Day 1', exercises: [
        { name: 'Dumbbell lateral raise', muscle: 'Side delts', priority: true, sets: 3, repMin: 6, repMax: 10, restSec: 90 },
        { name: 'Incline dumbbell press', muscle: 'Chest', sets: 3, repMin: 6, repMax: 10, restSec: 180 },
        { name: 'Flat machine/chest press', muscle: 'Chest', sets: 3, repMin: 8, repMax: 12, restSec: 120 },
        { name: 'Seated dumbbell shoulder press', muscle: 'Front delts', sets: 3, repMin: 8, repMax: 12, restSec: 120 },
        { name: 'Seated dumbbell lateral raise', muscle: 'Side delts', sets: 4, repMin: 12, repMax: 20, restSec: 90 },
        { name: 'Overhead dumbbell triceps extension', muscle: 'Triceps', sets: 3, repMin: 10, repMax: 15, restSec: 90 }
      ]},
      { id: 'day2', label: 'Day 2', exercises: [
        { name: 'Dumbbell shoulder press', muscle: 'Front delts', priority: true, sets: 3, repMin: 6, repMax: 10, restSec: 120 },
        { name: 'Pull-ups / lat pulldown', muscle: 'Back', sets: 3, repMin: 6, repMax: 10, restSec: 180 },
        { name: 'Chest-supported row', muscle: 'Back', sets: 3, repMin: 8, repMax: 12, restSec: 120 },
        { name: 'Reverse pec deck', muscle: 'Rear delts', sets: 4, repMin: 12, repMax: 20, restSec: 90 },
        { name: 'Incline dumbbell curl', muscle: 'Biceps', sets: 3, repMin: 8, repMax: 12, restSec: 90 },
        { name: 'Dumbbell hammer curl', muscle: 'Biceps', sets: 2, repMin: 10, repMax: 15, restSec: 90 }
      ]},
      { id: 'day3', label: 'Day 3', exercises: [
        { name: 'Dumbbell lateral raise', muscle: 'Side delts', priority: true, sets: 3, repMin: 6, repMax: 10, restSec: 90 },
        { name: 'Squat / hack squat', muscle: 'Quads', sets: 3, repMin: 6, repMax: 10, restSec: 180 },
        { name: 'Romanian deadlift', muscle: 'Hamstrings', sets: 3, repMin: 8, repMax: 12, restSec: 180 },
        { name: 'Leg press', muscle: 'Quads', sets: 3, repMin: 10, repMax: 15, restSec: 120 },
        { name: 'Leg curl', muscle: 'Hamstrings', sets: 3, repMin: 10, repMax: 15, restSec: 90 },
        { name: 'Standing calf raise', muscle: 'Calves', sets: 4, repMin: 8, repMax: 15, restSec: 90 }
      ]},
      { id: 'day4', label: 'Day 4', exercises: [
        { name: 'Dumbbell shoulder press', muscle: 'Front delts', priority: true, sets: 3, repMin: 6, repMax: 10, restSec: 120 },
        { name: 'Seated dumbbell lateral raise', muscle: 'Side delts', sets: 4, repMin: 12, repMax: 20, restSec: 90 },
        { name: 'Reverse pec deck', muscle: 'Rear delts', sets: 3, repMin: 12, repMax: 20, restSec: 90 },
        { name: 'EZ-bar curl', muscle: 'Biceps', sets: 3, repMin: 8, repMax: 12, restSec: 90 },
        { name: 'Dumbbell skull crusher', muscle: 'Triceps', sets: 3, repMin: 10, repMax: 15, restSec: 90 },
        { name: 'Overhead dumbbell triceps extension', muscle: 'Triceps', sets: 2, repMin: 10, repMax: 15, restSec: 90 }
      ]},
      { id: 'day5', label: 'Day 5', exercises: [
        { name: 'Dumbbell lateral raise', muscle: 'Side delts', priority: true, sets: 3, repMin: 6, repMax: 10, restSec: 90 },
        { name: 'Incline Smith/machine press', muscle: 'Chest', sets: 3, repMin: 6, repMax: 10, restSec: 180 },
        { name: 'Lat pulldown', muscle: 'Back', sets: 3, repMin: 8, repMax: 12, restSec: 120 },
        // Moved here from Day 2: keeps the Day 2 id so its history stays attached.
        { id: 'day2_cable_row', name: 'Cable row', muscle: 'Back', sets: 3, repMin: 8, repMax: 12, restSec: 120 },
        { name: 'Seated dumbbell lateral raise', muscle: 'Side delts', sets: 4, repMin: 12, repMax: 20, restSec: 90 },
        { name: 'Reverse pec deck', muscle: 'Rear delts', sets: 2, repMin: 12, repMax: 20, restSec: 90 }
      ]}
    ].map(function(d) {
      d.exercises = d.exercises.map(function(ex) {
        // Legacy id = same slug the v3 store used, so existing history stays attached.
        if (!ex.id) ex.id = d.id + '_' + ex.name.toLowerCase().replace(/[^a-z0-9]+/g, '_');
        return ex;
      });
      return d;
    });
  }

  // Routines saved before muscles/priority existed get them from the default routine
  // (matched by exercise id, then by name). Unknown exercises fall back to 'Other'.
  function fillMeta(days) {
    var byId = {}, byName = {};
    defaultRoutine().forEach(function(d) {
      d.exercises.forEach(function(e) { byId[e.id] = e; byName[e.name.toLowerCase()] = e; });
    });
    days.forEach(function(d) {
      d.exercises.forEach(function(e) {
        var ref = byId[e.id] || byName[e.name.toLowerCase()];
        if (!e.muscle) e.muscle = ref ? ref.muscle : 'Other';
        if (e.priority === undefined) e.priority = !!(ref && ref.priority);
      });
    });
    return days;
  }

  // ---------- storage ----------
  var STORE_KEY = 'gymlog-entries-v4';
  var LEGACY_KEY = 'gymlog-entries-v3';
  var ROUTINE_KEY = 'gymlog-routine-v1';
  var ROUTINES_KEY = 'gymlog-routines-v1';
  var TIMER_KEY = 'gymlog-timer-v1';
  var BACKUP_KEY = 'gymlog-lastbackup-v1';

  var entries = {};
  var routine = [];
  var activeDay = null;
  var view = 'log';
  var openCards = {};
  var drafts = {};

  function readJSON(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) { return fallback; }
  }

  function saveEntries() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(entries)); }
    catch (e) { alert('Save failed: browser storage is full or unavailable.'); }
  }

  // ---------- routines: several saved plans, one active; `routine` is the active plan's days ----------
  // store = { active: id, list: [{ id, name, days, cycle: { start: 'YYYY-MM-DD', weeks: n } | null }] }
  var store = null;

  function activePlan() {
    return store.list.find(function(p) { return p.id === store.active; }) || store.list[0];
  }
  function saveRoutine() {
    activePlan().days = routine;
    try { localStorage.setItem(ROUTINES_KEY, JSON.stringify(store)); }
    catch (e) { alert('Could not save the routine.'); }
  }
  function loadRoutines() {
    var s = readJSON(ROUTINES_KEY, null);
    if (!s || !Array.isArray(s.list) || !s.list.length) {
      // First run with multi-routine support: the single saved routine (or the default) becomes plan #1.
      var old = readJSON(ROUTINE_KEY, null);
      var days = Array.isArray(old) && old.length ? old : defaultRoutine();
      s = { active: 'plan1', list: [{ id: 'plan1', name: 'Shoulder specialization', days: days, cycle: null }] };
    }
    s.list.forEach(function(p) { fillMeta(p.days); });
    store = s;
    routine = activePlan().days;
    try { localStorage.setItem(ROUTINES_KEY, JSON.stringify(store)); } catch (e) {}
  }
  function switchPlan(id) {
    store.active = id;
    routine = activePlan().days;
    saveRoutine();
    activeDay = pickStartDay();
  }

  // ---------- training cycle ----------
  function cycleInfo() {
    var c = activePlan().cycle;
    if (!c || !c.start || !c.weeks) return null;
    var start = new Date(c.start + 'T00:00:00');
    var today = new Date(todayStr() + 'T00:00:00');
    var days = Math.round((today - start) / 86400000);
    if (days < 0) return { text: 'Cycle starts in ' + (-days) + (days === -1 ? ' day' : ' days'), over: false, week: 0, weeks: c.weeks, before: -days };
    var week = Math.floor(days / 7) + 1;
    if (week > c.weeks) return { text: 'Week ' + week + ' — cycle planned for ' + c.weeks + ' weeks is over', over: true, week: week, weeks: c.weeks };
    return { text: 'Week ' + week + ' / ' + c.weeks + (week === c.weeks ? ' — last week' : ''), over: false, week: week, weeks: c.weeks, last: week === c.weeks };
  }
  function paintCycle() {
    var el = document.getElementById('cycle-line');
    var info = cycleInfo();
    var name = activePlan().name;
    var chip = document.getElementById('cycle-chip');
    if (!info) {
      chip.hidden = true;
    } else {
      chip.hidden = false;
      chip.classList.toggle('over', !!info.over);
      var track = '';
      if (info.weeks <= 16) {
        for (var i = 1; i <= info.weeks; i++) track += '<i' + (i <= info.week ? ' class="on"' : '') + '></i>';
      }
      chip.innerHTML = info.before
        ? '<div class="num">' + info.before + '<small>d</small></div><div class="lbl">to cycle start</div>'
        : '<div class="num">' + info.week + '<small> / ' + info.weeks + '</small></div>' +
          '<div class="lbl">' + (info.over ? 'Cycle over' : info.last ? 'Last week' : 'Week') + '</div>' +
          (track ? '<div class="cycle-track">' + track + '</div>' : '');
    }
    if (!info && store.list.length < 2) { el.hidden = true; return; }
    el.hidden = false;
    el.textContent = (store.list.length > 1 ? name : '') + (info ? (store.list.length > 1 ? ' · ' : '') + info.text : '');
    el.classList.toggle('over', !!(info && info.over));
  }

  // ---------- weekly sets per muscle ----------
  function mondayOf(dateStr) {
    var d = new Date(dateStr + 'T00:00:00');
    var dow = (d.getDay() + 6) % 7;
    d.setDate(d.getDate() - dow);
    return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  }
  function weeklyVolume() {
    var planned = {}, done = {}, muscleOf = {};
    routine.forEach(function(d) {
      d.exercises.forEach(function(e) {
        planned[e.muscle] = (planned[e.muscle] || 0) + e.sets;
        muscleOf[e.id] = e.muscle;
      });
    });
    // Exercises from other saved routines still count if logged this week.
    store.list.forEach(function(p) {
      p.days.forEach(function(d) { d.exercises.forEach(function(e) { if (!muscleOf[e.id]) muscleOf[e.id] = e.muscle; }); });
    });
    var weekStart = mondayOf(todayStr());
    for (var k in entries) {
      var m = muscleOf[k];
      if (!m) continue;
      (entries[k] || []).forEach(function(s) {
        if (s.date >= weekStart) done[m] = (done[m] || 0) + s.sets.length;
      });
    }
    return MUSCLES.filter(function(m) { return planned[m] || done[m]; })
      .map(function(m) { return { muscle: m, done: done[m] || 0, planned: planned[m] || 0 }; })
      .sort(function(a, b) { return b.planned - a.planned || b.done - a.done; });
  }

  // ---------- drafts: typed-but-unlogged values survive the re-render after logging another exercise ----------
  function captureDraft(key, setCount) {
    var d = { w: [], r: [], easy: false };
    for (var i = 1; i <= setCount; i++) {
      var wi = document.getElementById('w-' + key + '-' + i);
      var ri = document.getElementById('r-' + key + '-' + i);
      d.w.push(wi ? wi.value : '');
      d.r.push(ri ? ri.value : '');
    }
    var ei = document.getElementById('easy-' + key);
    d.easy = !!(ei && ei.checked);
    drafts[key] = d;
  }
  function clearDraft(key) {
    delete drafts[key];
  }

  // ---------- which day to open on ----------
  // Open the day you trained today, or else the one after the last day you trained.
  function pickStartDay() {
    var lastDate = null;
    for (var k in entries) (entries[k] || []).forEach(function(s) { if (!lastDate || s.date > lastDate) lastDate = s.date; });
    if (!lastDate) return routine[0].id;

    var idx = -1, bestHits = 0;
    routine.forEach(function(d, i) {
      var hits = d.exercises.filter(function(ex) {
        return (entries[ex.id] || []).some(function(s) { return s.date === lastDate; });
      }).length;
      if (hits > bestHits) { bestHits = hits; idx = i; }
    });
    if (idx < 0) return routine[0].id;
    if (lastDate === todayStr()) return routine[idx].id;
    return routine[(idx + 1) % routine.length].id;
  }

  // ---------- backup health ----------
  function daysSinceBackup() {
    var at = localStorage.getItem(BACKUP_KEY);
    if (!at) return null;
    return Math.floor((Date.now() - new Date(at).getTime()) / 86400000);
  }
  function markBackedUp() {

  // v3 -> v4: sets become { weight, reps }. The v3 key is left untouched as a fallback.

    Object.keys(v3).forEach(function(key) {

  // ---------- helpers ----------

  // ---------- today's session, per-set check-off ----------
  var TROPHY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>';

  function checkSet(key, i) {

  // ---------- PRs ----------
  function checkPR(key, snap, name) {
    var ts = todaySession(key);

    var now = bestOf([ts]);
    var was = snap.todayBest;
    var lines = [];
    if (prev.e1rm && now.e1rm > Math.max(prev.e1rm, was.e1rm) + 0.05) {
      lines.push('Est. 1RM ' + round1(now.e1rm) + ' kg (+' + round1(now.e1rm - prev.e1rm) + ')');
    }
    if (prev.weight > 0 && now.weight > Math.max(prev.weight, was.weight)) {

    }

  function celebrate(title, lines) {

    var el = document.createElement('div');
    el.className = 'toast';
    el.id = 'toast';

  // ---------- workout summary ----------
  function showSummary(day) {
    var t = todayStr();
    var sets = 0, vol = 0, ats = [], prs = [], rows = '';
    day.exercises.forEach(function(ex) {
      var h = sortedHist(ex.id);
      var ts = h.find(function(s) { return s.date === t; });
      if (!ts) return;
      var before = bestOf(h.filter(function(s) { return s.date < t; }));
      var nb = bestOf([ts]);
      var isPr = (before.e1rm > 0 && nb.e1rm > before.e1rm + 0.05) || (before.weight > 0 && nb.weight > before.weight);
      sets += ts.sets.length;
      vol += volumeOf(ts) || 0;
      ts.sets.forEach(function(s) { if (s.at) ats.push(s.at); });
      if (isPr) prs.push(ex.name);
      rows += '<div class="sum-ex"><div class="sum-ex-name">' + esc(ex.name) + (isPr ? ' <span class="pr-badge">PR</span>' : '') + '</div>' +
        '<div class="sum-ex-sets">' + ts.sets.map(fmtSet).join(' · ') + '</div></div>';
    });

    });
    var pVol = 0, pSets = 0;

        '<div class="sheet-grab"></div>' +
        '<div class="sum-kicker">Workout complete</div>' +
        '<div class="sum-title">' + esc(day.label) + '</div>' +
        '<div class="sum-date">' + dateTxt + '</div>' +

  // ---------- per-exercise chart ----------
  function chartHtml(key, hist) {
    // A session still in progress today would drag the line down mid-workout.
    var f = findEx(key);
    if (f && !exDone(f.ex)) hist = hist.filter(function(h) { return h.date !== todayStr(); });
    if (hist.length < 2) return '';
    var allBW = hist.every(function(h) { return h.sets.every(function(s) { return s.weight === 0; }); });
    var pts = hist.map(function(h) {
      return { date: h.date, e: bestOf([h]).e1rm || 0, w: avg(h.sets.map(function(s) { return s.weight; })), r: totalReps(h) };
    });

    var label = mode === 'e' ? 'Est. 1RM' : mode === 'r' ? 'Total reps' : 'Avg weight';
    var unit = mode === 'r' ? ' reps' : ' kg';
    var data = pts.filter(function(p) { return mode !== 'e' || p.e; }).map(function(p) {

    var x = function(j) { return pl + j * (W - pl - pr) / (data.length - 1); };
    var y = function(v) { return pt + (1 - (v - min) / (max - min)) * (H - pt - pb); };

    var area = line + ' L' + x(data.length - 1).toFixed(1) + ' ' + base + ' L' + x(0).toFixed(1) + ' ' + base + ' Z';

        '<span><b id="chart-val-' + key + '">' + lastV + '</b>' + unit + ' <span class="' + (change >= 0 ? 'sets-chip' : '') + '" style="' + (change < 0 ? 'color:#D97757;font-weight:600;' : '') + '">' + (change >= 0 ? '+' : '') + change + ' since ' + fmtDate(data[0].date) + '</span></span></div>' +

        dots +

  // ---------- consistency calendar ----------
  function isoLocal(d) { return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
  function addDays(iso, n) { var d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return isoLocal(d); }

  function consistencyHtml() {
    var perDay = {};
    for (var k in entries) (entries[k] || []).forEach(function(s) { perDay[s.date] = (perDay[s.date] || 0) + s.sets.length; });
    var dates = Object.keys(perDay).sort();
    if (!dates.length) return '';
    var today = todayStr();
    var thisMon = mondayOf(today);
    var COLS = 17;

    var target = routine.length;
    var gymDays = function(mon) {

      return null;
